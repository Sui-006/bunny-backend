# Render 部署配置（Web Service）
# 注意：真正的密钥请在 Render Dashboard 的环境变量里配置，不要写进本文件。
services:
  - type: web
    name: bunny-backend
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      # 以下为「必须」项：在 Render 环境变量里填写真实值
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: BARK_URL
        sync: false
      - key: DEFAULT_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOW_IMPLICIT_OWNER
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: AMAP_KEY
        sync: false
      # 网易云 song_url 地域校验：Render 在美国，需伪装 X-Real-IP 为国内 IP 才能拿到播放地址
      - key: NETEASE_REAL_IP
        value: 223.5.5.5

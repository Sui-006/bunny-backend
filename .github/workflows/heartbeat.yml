# 心跳：定时戳一下后端的 /api/proactive，让 AI 有机会主动发消息
# 后端会自己判断该不该发（冷却 / 定时问候 / 空闲提醒），所以这里只管「准时敲门」。
name: heartbeat

on:
  schedule:
    # 每 10 分钟敲一次门：既让 AI 有机会主动发消息，也防止 Render 免费版 15 分钟空闲休眠。
    # （主动消息有 30 分钟冷却 + 各档位日期去重，频繁敲门不会重复发。）
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping proactive endpoint
        run: |
          curl -fsS \
            --retry 4 --retry-delay 20 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            https://bunny-backend-bv89.onrender.com/api/proactive \
            || true

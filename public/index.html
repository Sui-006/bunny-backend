<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bunny's Home</title>
  <meta name="description" content="Bunny's Home — 属于 Bunny & Elliott 的个人 AI 生活操作系统（任务 / 习惯 / 计划 / 记账 / 健康 / AI 陪伴）">
  <meta name="theme-color" content="#6b8cae">
  <!-- PWA：可安装到 iPhone / Android 主屏幕 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <!-- iOS 独立窗口（添加到主屏幕后以 App 形态打开，不显示 Safari 地址栏） -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bunny's Home">
  <link rel="stylesheet" href="fonts/fonts.css">
  <style>
    @font-face {
      font-family: 'BAUHS93';
      src: url('BAUHS93.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face { font-family: 'Arial Rounded MT Bold'; src: url('ARLRDBD.TTF') format('truetype'); font-weight: normal; font-style: normal; }
    @font-face { font-family: 'Colonna MT'; src: url('COLONNA.TTF') format('truetype'); font-weight: normal; font-style: normal; }
    @font-face { font-family: 'Curlz MT'; src: url('CURLZ___.TTF') format('truetype'); font-weight: normal; font-style: normal; }
    @font-face { font-family: 'Ink Free'; src: url('Inkfree.ttf') format('truetype'); font-weight: normal; font-style: normal; }
    @font-face { font-family: 'Blackadder ITC'; src: url('ITCBLKAD.TTF') format('truetype'); font-weight: normal; font-style: normal; }
    @font-face { font-family: 'Edwardian Script ITC'; src: url('ITCEDSCR.TTF') format('truetype'); font-weight: normal; font-style: normal; }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --accent: #6b8cae;
      --accent-strong: #3e6b8e;
      --accent-soft: #a9c4dc;
      --accent-hover: #b8d6ea;
      --accent-border: #a0bfd4;
      --accent-bg: #f7fafe;
      --accent-tint: #e8f0f8;
      --accent-line: #e2ecf4;

      --bg: #f4f7fb;
      --bg2: #ffffff;
      --card: rgba(255,255,255,0.85);
      --card-solid: #ffffff;
      --border: rgba(210,226,240,0.6);
      --border-strong: rgba(180,200,220,0.8);
      --text: #33465c;
      --text-soft: #6b7f94;
      --text-faint: #93a5b8;
      --shadow: 0 2px 10px rgba(40,60,90,0.05);
      --shadow-md: 0 8px 28px rgba(40,60,90,0.10);
      --radius: 16px;
      --radius-lg: 22px;
      --radius-sm: 12px;
      --sidebar-w: 252px;
      --topbar-h: 56px;
      --bottomnav-h: 60px;
      --dur: 0.18s;
      /* 全局字体缩放（小/标准/大/特大）：统一 typography scale，值由 applyTheme 按 DB.appearance.fontScale 设置 */
      --app-font-scale: 1;
    }
    html[data-theme="dark"] {
      --bg: #0f141b;
      --bg2: #161d27;
      --card: rgba(26,34,46,0.8);
      --card-solid: #1a222e;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.14);
      --text: #dbe4ee;
      --text-soft: #93a5b8;
      --text-faint: #64748b;
      --shadow: 0 2px 10px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 28px rgba(0,0,0,0.45);
      --accent-bg: #141b24;
      --accent-tint: #1c2733;
      --accent-line: #223040;
    }
    /* 根字号固定为 15px（不随字体档位缩放）；文字缩放由各 font-size 的 calc(* var(--app-font-scale)) 完成。
       不再使用 zoom：zoom 会同时缩放布局，导致 iOS fixed/dvh/visualViewport 异常。 */
    html { font-size: 15px; }
    body {
      font-family: 'BAUHS93', -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh; height: 100dvh;
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }
    button, input, textarea, select { font-family: inherit; color: inherit; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(140,160,180,0.35); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(140,160,180,0.55); }

    .app { display: block; height: 100vh; height: 100dvh; width: 100%; }
    .scrim { position: fixed; inset: 0; background: rgba(15,23,35,0.4); z-index: 110; opacity: 0; pointer-events: none; transition: opacity 0.25s; backdrop-filter: blur(2px); }
    .scrim.show { opacity: 1; pointer-events: auto; }

    /* ============ Sidebar（fixed overlay drawer，绝不挤压主内容） ============ */
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 120;
      width: var(--sidebar-w); max-width: 86vw; height: 100%;
      background: var(--accent-bg); border-right: 1px solid var(--accent-line);
      display: flex; flex-direction: column; padding: calc(18px + env(safe-area-inset-top)) 12px 12px;
      transform: translateX(-102%);
      transition: transform 0.28s ease;
      box-shadow: 2px 0 20px rgba(0,0,0,0.12);
    }
    .sidebar.open { transform: translateX(0); }
    .logo {
      font-size:calc(18px * var(--app-font-scale, 1)); font-weight: 700; letter-spacing: 1px; color: var(--accent);
      padding: 6px 12px 14px; display: flex; align-items: center; gap: 8px;
    }
    .logo .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-new {
      display: flex; align-items: center; gap: 8px; width: 100%;
      background: var(--bg2); border: 1px solid var(--accent-line); border-radius: 14px;
      padding: 11px 14px; font-size:calc(14px * var(--app-font-scale, 1)); color: var(--accent-strong); cursor: pointer;
      transition: background 0.15s; margin-bottom: 12px; text-align: left;
    }
    .nav-new:hover { background: var(--accent-tint); }
    .nav-section {
      font-size:calc(10.5px * var(--app-font-scale, 1)); letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text-faint); padding: 12px 12px 6px; font-weight: 700;
    }
    .nav-scroll { flex: 1; overflow-y: auto; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px;
      font-size:calc(14px * var(--app-font-scale, 1)); color: var(--text-soft); cursor: pointer; transition: background 0.15s, color 0.15s;
      margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left;
    }
    .nav-item:hover { background: var(--accent-tint); color: var(--text); }
    .nav-item.active { background: var(--accent-tint); color: var(--accent-strong); font-weight: 600; }
    .nav-item .ico { width: 20px; text-align: center; flex-shrink: 0; }
    .nav-item .lbl { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-item .badge { font-size:calc(11px * var(--app-font-scale, 1)); background: var(--accent); color: #fff; border-radius: 10px; padding: 1px 7px; }
    .nav-foot { border-top: 1px solid var(--accent-line); padding-top: 8px; }

    /* ============ Main / Topbar ============ */
    .main { width: 100%; display: flex; flex-direction: column; min-width: 0; height: 100vh; position: relative; }
    .main .bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 1; pointer-events: none; z-index: 0; transition: opacity 0.3s; }
    .topbar {
      height: calc(var(--topbar-h) + env(safe-area-inset-top)); flex-shrink: 0; display: flex; align-items: center; gap: 12px;
      padding: env(safe-area-inset-top) 18px 0; position: relative; z-index: 2;
      background: rgba(255,255,255,0.55); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    html[data-theme="dark"] .topbar { background: rgba(18,25,34,0.55); }
    .menu-btn { background: none; border: none; font-size:calc(22px * var(--app-font-scale, 1)); color: var(--accent); cursor: pointer; display: block; line-height: 1; }
    .topbar-title { font-size:calc(17px * var(--app-font-scale, 1)); font-weight: 700; color: var(--accent-strong); }
    .topbar-sub { font-size:calc(12px * var(--app-font-scale, 1)); color: var(--text-faint); }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 12px; background: var(--card); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; cursor: pointer; font-size:calc(16px * var(--app-font-scale, 1));
      transition: background 0.15s, transform 0.1s; position: relative;
    }
    .icon-btn:hover { background: var(--accent-tint); }
    .icon-btn:active { transform: scale(0.94); }
    .icon-btn .dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: #ef5350; border: 1.5px solid var(--bg2); }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; background: var(--accent-tint); border: 2px solid var(--accent-soft);
      background-size: cover; background-position: center; cursor: pointer; flex-shrink: 0;
    }
    .view { flex: 1; overflow-y: auto; position: relative; z-index: 1; padding: 22px 24px calc(100px + env(safe-area-inset-bottom)); }
    /* AI Chat：整个页面就是聊天，无外边距、无内边距、铺满动态视口 */
    .view.view-chat { padding: 0; overflow: hidden; }
    .view-inner { max-width: 1080px; margin: 0 auto; animation: viewIn 0.22s ease; }
    @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* ============ FAB ============ */
    .fab {
      position: fixed; right: 22px; bottom: calc(24px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%;
      background: var(--accent); color: #fff; font-size:calc(28px * var(--app-font-scale, 1)); border: none; cursor: pointer;
      box-shadow: 0 8px 24px rgba(60,90,130,0.4); z-index: 60; display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, background 0.2s; line-height: 1;
    }
    .fab:hover { background: var(--accent-strong); transform: translateY(-2px); }
    .fab:active { transform: scale(0.92); }

    /* ============ Cards / common ============ */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); backdrop-filter: blur(6px); }
    .card-pad { padding: 18px 20px; }
    .section-head { display: flex; align-items: baseline; gap: 8px; margin: 26px 0 12px; }
    .section-head h2 { font-size:calc(16px * var(--app-font-scale, 1)); font-weight: 700; color: var(--text); }
    .section-head .hint { font-size:calc(12px * var(--app-font-scale, 1)); color: var(--text-faint); }
    .section-head .more { margin-left: auto; font-size:calc(12px * var(--app-font-scale, 1)); color: var(--accent); cursor: pointer; background: none; border: none; }
    .grid { display: grid; gap: 14px; }
    .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .muted { color: var(--text-faint); font-size:calc(12px * var(--app-font-scale, 1)); }
    .h2 { font-size:calc(22px * var(--app-font-scale, 1)); font-weight: 700; color: var(--text); }
    .h1 { font-size:calc(26px * var(--app-font-scale, 1)); font-weight: 700; color: var(--text); letter-spacing: 0.5px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .spread { display: flex; align-items: center; justify-content: space-between; }
    .grow { flex: 1; min-width: 0; }

    /* buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 16px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer;
      background: var(--card-solid); color: var(--text); font-size:calc(13.5px * var(--app-font-scale, 1)); transition: all 0.15s; white-space: nowrap;
    }
    .btn:hover { background: var(--accent-tint); border-color: var(--accent-border); }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
    .btn-soft { background: var(--accent-tint); border-color: transparent; color: var(--accent-strong); }
    .btn-danger { background: #fbeaea; border-color: #f3cdcd; color: #c0392b; }
    .btn-danger:hover { background: #f6d8d8; }
    .btn-sm { padding: 6px 11px; font-size:calc(12.5px * var(--app-font-scale, 1)); border-radius: 10px; }
    .btn-block { width: 100%; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* inputs */
    .input, .textarea, .select {
      width: 100%; padding: 10px 13px; border: 1px solid var(--border); border-radius: 12px;
      background: var(--card-solid); font-size:calc(14px * var(--app-font-scale, 1)); color: var(--text); outline: none; transition: border 0.15s;
    }
    .input:focus, .textarea:focus, .select:focus { border-color: var(--accent-border); }
    .textarea { resize: vertical; min-height: 60px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size:calc(12.5px * var(--app-font-scale, 1)); color: var(--text-soft); margin-bottom: 5px; font-weight: 600; }
    .field .row.gap2 { gap: 8px; }
    .search-box { position: relative; }
    .search-box input { padding-left: 38px; }
    .search-box .sico { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-faint); font-size:calc(15px * var(--app-font-scale, 1)); }

    /* progress */
    .progress { height: 7px; background: var(--accent-tint); border-radius: 10px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: var(--accent); border-radius: 10px; transition: width 0.4s ease; }
    .ring { transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 8; }
    .ring .bg { stroke: var(--accent-tint); }
    .ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }

    /* chips / tags */
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size:calc(11.5px * var(--app-font-scale, 1)); background: var(--accent-tint); color: var(--accent-strong); border: 1px solid var(--accent-line); }
    .tag { display: inline-flex; align-items: center; gap: 3px; padding: 1px 8px; border-radius: 8px; font-size:calc(11px * var(--app-font-scale, 1)); background: var(--accent-tint); color: var(--accent-strong); margin: 1px; }

    /* checkbox */
    .chk { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--accent-border); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; background: var(--card-solid); }
    .chk:hover { border-color: var(--accent); }
    .chk.on { background: var(--accent); border-color: var(--accent); }
    .chk.on::after { content: '✓'; color: #fff; font-size:calc(12px * var(--app-font-scale, 1)); font-weight: 700; }
    .chk.sm { width: 17px; height: 17px; border-width: 1.5px; }
    .chk.sm::after { font-size:calc(10px * var(--app-font-scale, 1)); }

    /* task row */
    .task-row { display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 14px; cursor: pointer; transition: background 0.15s; border: 1px solid transparent; }
    .task-row:hover { background: var(--accent-tint); border-color: var(--accent-line); }
    .task-row .t-title { flex: 1; font-size:calc(14px * var(--app-font-scale, 1)); color: var(--text); word-break: break-word; transition: opacity 0.2s; }
    .task-row.done .t-title { text-decoration: line-through; opacity: 0.45; }
    .task-row .t-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
    .prio { width: 4px; height: 18px; border-radius: 4px; flex-shrink: 0; }
    .prio.high { background: #ef5350; } .prio.med { background: #f59e0b; } .prio.low { background: #38bdf8; } .prio.none { background: transparent; }
    .drag-hint { opacity: 0.5; cursor: grab; font-size:calc(13px * var(--app-font-scale, 1)); }

    /* empty */
    .empty { text-align: center; padding: 46px 20px; color: var(--text-faint); }
    .empty .eico { font-size:calc(44px * var(--app-font-scale, 1)); margin-bottom: 10px; opacity: 0.6; }
    .empty .etitle { font-size:calc(15px * var(--app-font-scale, 1)); color: var(--text-soft); font-weight: 600; margin-bottom: 4px; }
    .empty .esub { font-size:calc(12.5px * var(--app-font-scale, 1)); }

    /* ============ Modal / drawer / toast / menu ============ */
    .overlay { position: fixed; inset: 0; background: rgba(12,20,30,0.42); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 18px; animation: fadeIn 0.18s ease; backdrop-filter: blur(3px); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal { background: var(--card-solid); border-radius: var(--radius-lg); width: 100%; max-width: 460px; max-height: 86vh; overflow-y: auto; box-shadow: var(--shadow-md); animation: popIn 0.2s ease; border: 1px solid var(--border); }
    @keyframes popIn { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: none; } }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 12px; }
    .modal-head h3 { font-size:calc(16px * var(--app-font-scale, 1)); color: var(--text); }
    .modal-head .x { background: none; border: none; font-size:calc(22px * var(--app-font-scale, 1)); color: var(--text-faint); cursor: pointer; }
    .modal-body { padding: 4px 20px 20px; }
    .modal-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 4px 20px 20px; }
    .drawer { position: fixed; z-index: 210; background: var(--card-solid); box-shadow: var(--shadow-md); animation: slideUp 0.25s ease; }
    .drawer.bottom { left: 0; right: 0; bottom: 0; max-height: 82vh; border-radius: 24px 24px 0 0; overflow-y: auto; }
    .drawer.right { top: 0; right: 0; bottom: 0; width: 100%; max-width: 400px; border-radius: 20px 0 0 20px; overflow-y: auto; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
    @keyframes slideRight { from { transform: translateX(100%); } to { transform: none; } }
    .drawer.right { animation-name: slideRight; }
    .sheet { background: var(--card-solid); border-radius: 24px 24px 0 0; width: 100%; max-width: 460px; padding: 12px 14px 24px; animation: slideUp 0.25s ease; box-shadow: var(--shadow-md); }
    .sheet-item { display: flex; align-items: center; gap: 14px; padding: 15px 12px; border-radius: 14px; cursor: pointer; font-size:calc(15px * var(--app-font-scale, 1)); color: var(--text); border: none; background: none; width: 100%; text-align: left; }
    .sheet-item:hover { background: var(--accent-tint); }
    .sheet-item .ico { width: 26px; text-align: center; font-size:calc(19px * var(--app-font-scale, 1)); }
    .sheet-grab { width: 40px; height: 4px; border-radius: 4px; background: var(--border-strong); margin: 4px auto 10px; }
    .sheet-head { margin-bottom: 12px; }
    #toastRoot { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 500; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
    .toast { background: var(--card-solid); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 14px; font-size:calc(13.5px * var(--app-font-scale, 1)); box-shadow: var(--shadow-md); animation: toastIn 0.25s ease; display: flex; align-items: center; gap: 8px; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
    .toast.out { opacity: 0; transform: translateY(-8px); transition: 0.25s; }
    #menuRoot { position: fixed; z-index: 400; }
    .menu { position: fixed; background: var(--card-solid); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-md); padding: 5px; min-width: 150px; animation: popIn 0.14s ease; }
    .menu button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 9px 12px; border: none; background: none; border-radius: 10px; font-size:calc(13.5px * var(--app-font-scale, 1)); color: var(--text); cursor: pointer; }
    .menu button:hover { background: var(--accent-tint); }
    .menu button.danger { color: #c0392b; }
    .menu button.danger:hover { background: #fbeaea; }
    .menu-header { font-size:calc(11px * var(--app-font-scale, 1)); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted, #94a3b8); padding: 8px 12px 4px; }

    /* color swatches */
    .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
    .sw { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.12s; }
    .sw:hover { transform: scale(1.12); }
    .sw.sel { border-color: var(--text); box-shadow: 0 0 0 3px var(--accent-tint); }
    .sw-custom { width: 30px; height: 30px; border-radius: 50%; border: 2px dashed var(--border-strong); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size:calc(15px * var(--app-font-scale, 1)); position: relative; overflow: hidden; }
    .sw-custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    /* ============ Calendar ============ */
    .cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .cal-title { font-size:calc(20px * var(--app-font-scale, 1)); font-weight: 700; color: var(--text); }
    .cal-nav { display: flex; gap: 6px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-dow { text-align: center; font-size:calc(11px * var(--app-font-scale, 1)); color: var(--text-faint); font-weight: 700; padding: 6px 0; letter-spacing: 0.5px; }
    .cal-cell { min-height: 88px; border: 1px solid var(--border); border-radius: 14px; padding: 6px; cursor: pointer; transition: all 0.15s; background: var(--card); position: relative; overflow: hidden; }
    .cal-cell:hover { border-color: var(--accent-border); }
    .cal-cell.other { opacity: 0.35; }
    .cal-cell.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .cal-cell .dnum { font-size:calc(13px * var(--app-font-scale, 1)); font-weight: 700; color: var(--text-soft); margin-bottom: 4px; }
    .cal-cell.today .dnum { color: var(--accent); }
    .cal-dot { font-size:calc(10.5px * var(--app-font-scale, 1)); line-height: 1.5; padding: 1px 5px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 1px; }
    .cal-more { font-size:calc(10px * var(--app-font-scale, 1)); color: var(--text-faint); }
    .mt-dots { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
    .mt-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
    .mt-more { font-size: calc(9px * var(--app-font-scale, 1)); color: var(--text-faint); line-height: 1; }
    .mt-color-dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
    .cal-cell.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-tint); }
    .pd-marks { display: flex; gap: 3px; align-items: center; margin-top: 2px; }
    .pd-period { width: 8px; height: 8px; border-radius: 50%; background: #ec4899; display: inline-block; }
    .pd-info { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); display: inline-block; }
    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .week-col { border: 1px solid var(--border); border-radius: 14px; min-height: 180px; padding: 8px; background: var(--card); }
    .week-col.today { border-color: var(--accent); }
    .week-col-head { font-size:calc(12px * var(--app-font-scale, 1)); font-weight: 700; color: var(--text-soft); text-align: center; margin-bottom: 6px; }
    .week-col.today .week-col-head { color: var(--accent); }
    .week-col .dnum { text-align: center; font-size:calc(11px * var(--app-font-scale, 1)); color: var(--text-faint); margin-bottom: 6px; }

    /* ============ Habit / Health / Stat ============ */
    .habit-card { display: flex; align-items: center; gap: 12px; padding: 15px; }
    .habit-ico { width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size:calc(21px * var(--app-font-scale, 1)); flex-shrink: 0; }
    .habit-streak { font-size:calc(12px * var(--app-font-scale, 1)); color: #f59e0b; font-weight: 600; }
    .stat-card { padding: 16px; }
    .stat-card .v { font-size:calc(26px * var(--app-font-scale, 1)); font-weight: 700; color: var(--text); letter-spacing: 0.5px; }
    .stat-card .u { font-size:calc(13px * var(--app-font-scale, 1)); color: var(--text-faint); }
    .stat-card .l { font-size:calc(12px * var(--app-font-scale, 1)); color: var(--text-soft); margin-bottom: 4px; }
    .chart-wrap { padding: 12px; }
    .seg { display: inline-flex; background: var(--accent-tint); border-radius: 12px; padding: 3px; gap: 2px; }
    .seg button { border: none; background: none; padding: 6px 13px; border-radius: 9px; font-size:calc(12.5px * var(--app-font-scale, 1)); color: var(--text-soft); cursor: pointer; }
    .seg button.on { background: var(--card-solid); color: var(--accent-strong); font-weight: 600; box-shadow: var(--shadow); }

    /* ============ Messages / Chat ============ */
    .conv-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; cursor: pointer; transition: background 0.15s; }
    .conv-item:hover { background: var(--accent-tint); }
    .conv-item .c-last { font-size:calc(12.5px * var(--app-font-scale, 1)); color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-item .c-time { font-size:calc(11px * var(--app-font-scale, 1)); color: var(--text-faint); flex-shrink: 0; }
    .unread { min-width: 18px; height: 18px; border-radius: 10px; background: var(--accent); color: #fff; font-size:calc(11px * var(--app-font-scale, 1)); display: flex; align-items: center; justify-content: center; padding: 0 5px; }
    /* 消息主列：meta 名/时间 → 引用/附件 → 气泡 → Token。左（AI）/右（用户）由 .mine 统一控制。 */
    .chat-msg-main { display: flex; flex-direction: column; max-width: 86%; min-width: 0; align-items: flex-start; }
    .chat-msg-main.mine { align-items: flex-end; }
    .chat-meta { font-size:calc(10px * var(--app-font-scale, 1)); color: var(--text-faint); margin-bottom: 2px; line-height: 1.3; }
    .chat-tokenline { font-size:calc(10.5px * var(--app-font-scale, 1)); color: var(--text-faint); margin-top: 3px; line-height: 1.3; user-select: none; }
    /* 气泡：shrink-wrap 到内容，短消息也有自然尺寸；min-width/min-height 避免「好/嗯」变成一小块；长消息自然换行，绝不撑破 */
    .bubble {
      display: inline-block; width: fit-content;
      max-width: 100%; min-width: 48px; min-height: 36px;
      padding: 11px 15px; border-radius: 18px; font-size:calc(14px * var(--app-font-scale, 1)); line-height: 1.6;
      word-break: break-word; overflow-wrap: anywhere; text-align: left;
    }
    .bubble.in { background: var(--card-solid); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
    .bubble.out { background: var(--accent); color: #fff; border-bottom-right-radius: 6px; }
    /* 气泡透明度只淡化背景、不影响文字（需求 8）：--bubble-alpha 仅作用于背景色 */
    @supports (background: color-mix(in srgb, red 50%, transparent)) {
      .bubble.in { background: color-mix(in srgb, var(--card-solid) calc(var(--bubble-alpha, 1) * 100%), transparent); }
      .bubble.out { background: color-mix(in srgb, var(--accent) calc(var(--bubble-alpha, 1) * 100%), transparent); }
    }
    /* AI 思考摘要（仅展示 provider 明确提供的可展示 reasoning summary；不泄漏隐藏 CoT） */
    .think-box {
      margin: -2px 0 8px; padding: 8px 10px; border-radius: 10px;
      background: rgba(0,0,0,0.04); border-left: 3px solid var(--accent-border);
      font-size:calc(12.5px * var(--app-font-scale, 1)); color: var(--text-soft); cursor: pointer; line-height: 1.55;
    }
    html[data-theme="dark"] .think-box { background: rgba(255,255,255,0.05); }
    .think-box .think-head { font-weight: 600; font-size:calc(12px * var(--app-font-scale, 1)); color: var(--text-faint); margin-bottom: 3px; display: flex; align-items: center; gap: 4px; }
    .think-box .think-summary { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; overflow-wrap: anywhere; }
    .think-box .think-more { font-size:calc(11.5px * var(--app-font-scale, 1)); color: var(--accent-strong); margin-top: 3px; }
    /* 思考底部 Sheet：约 55% 高度、内部独立滚动、下拉关闭、遮罩关闭、不推挤 Chat 页面 */
    .thinking-overlay { align-items: flex-end; padding: 0; }
    .thinking-sheet {
      background: var(--card-solid); border: 1px solid var(--border);
      border-radius: 24px 24px 0 0; width: 100%; max-width: none;
      min-height: 40dvh; max-height: 55dvh; height: auto; display: flex; flex-direction: column;
      padding: 12px 16px calc(18px + env(safe-area-inset-bottom));
      animation: slideUp 0.25s ease; box-shadow: var(--shadow-md); position: relative;
    }
    .thinking-sheet-head { display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size:calc(15px * var(--app-font-scale, 1)); margin-bottom: 10px; flex-shrink: 0; }
    .thinking-sheet-head .x { background: none; border: none; font-size:calc(20px * var(--app-font-scale, 1)); color: var(--text-faint); cursor: pointer; line-height: 1; }
    .thinking-sheet-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; font-size:calc(13.5px * var(--app-font-scale, 1)); line-height: 1.7; color: var(--text-soft); white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
    .chat-input-bar { display: flex; flex-shrink: 0; gap: 8px; align-items: center; padding: 10px 14px calc(var(--chat-safe-bottom, env(safe-area-inset-bottom))); border-top: 1px solid var(--border); }
    .chat-input { flex: 1; min-width: 0; resize: none; border: 1px solid var(--border); border-radius: 22px; padding: 10px 16px; font-size:calc(14px * var(--app-font-scale, 1)); line-height: 1.5; outline: none; max-height: 132px; min-height: 46px; background: var(--card-solid); overflow-y: auto; }
    .chat-input:focus { border-color: var(--accent-border); }
    /* composer 按钮：+ / 发送 / 停止 不重叠，等宽圆角 */
    .composer-btn { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); background: var(--card-solid); cursor: pointer; font-size:calc(18px * var(--app-font-scale, 1)); color: var(--accent-strong); transition: background 0.15s, transform 0.1s; }
    .composer-btn:hover { background: var(--accent-tint); }
    .composer-btn:active { transform: scale(0.94); }
    .composer-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .composer-btn.send { background: var(--accent); border-color: var(--accent); color: #fff; }
    .composer-btn.send:disabled { background: var(--accent); opacity: 0.45; }
    .composer-btn.stop { background: #fbeaea; border-color: #f3cdcd; color: #c0392b; }
    .composer-btn.stop:hover { background: #f6d8d8; }
    /* 回到底部 */
    .chat-scroll-top { position: absolute; bottom: 16px; right: 18px; width: 40px; height: 40px; border-radius: 50%; background: var(--card-solid); border: 1px solid var(--border); box-shadow: var(--shadow-md); color: var(--accent-strong); font-size:calc(18px * var(--app-font-scale, 1)); cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 5; }
    .chat-scroll-top.show { display: flex; }
    /* 空状态建议 chips */
    .chat-suggest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
    .chat-suggest .chip { cursor: pointer; border: 1px solid var(--accent-line); background: var(--card-solid); }
    .chat-suggest .chip:hover { background: var(--accent-tint); }

    /* 聊天气泡操作：小图标、淡色、默认隐藏，hover / 长按 / 点击出现 */
    .chat-msg-row { position: relative; }
    /* 通知点击后的定位高亮：短暂闪烁目标消息，绝不永久改变样式 */
    .chat-msg-row.chat-message-located { border-radius: 12px; animation: locateFlash 1.6s ease-out; }
    @keyframes locateFlash {
      0%   { background: var(--accent-tint); box-shadow: 0 0 0 2px var(--accent); }
      100% { background: transparent; box-shadow: 0 0 0 2px transparent; }
    }
    .chat-actions { display: flex; gap: 2px; margin-top: 4px; opacity: 0; transition: opacity 0.15s; }
    .chat-msg-row:hover .chat-actions, .chat-msg-row:active .chat-actions { opacity: 1; }
    .chat-actions .mini-act { border: none; background: none; color: var(--text-faint); font-size:calc(11px * var(--app-font-scale, 1)); padding: 2px 7px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; }
    .chat-actions .mini-act:hover { color: var(--accent-strong); background: var(--accent-tint); }
    .mini-act { border: none; background: none; color: var(--text-faint); font-size:calc(11px * var(--app-font-scale, 1)); padding: 2px 7px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0; }
    .mini-act:hover { color: var(--accent-strong); background: var(--accent-tint); }

    /* AI 后台写入成功的系统提示（时间线事件，非聊天气泡）：居中、浅灰、半透明、轻量 */
    .ai-action-notice {
      align-self: center;
      margin: 4px auto;
      padding: 5px 13px;
      border-radius: 999px;
      font-size:calc(12px * var(--app-font-scale, 1));
      line-height: 1.5;
      text-align: center;
      color: var(--text-faint);
      background: var(--accent-tint);
      background: color-mix(in srgb, var(--text) 7%, transparent);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* AI 工具工作状态（与「编写动态」同一视觉体系）：居中胶囊、轻量、短暂。
       由 OS.chat.setToolStatus 直接局部更新，绝不触发整页 render / scrollToBottom。 */
    .tool-status {
      align-self: center;
      display: flex; align-items: center; gap: 7px;
      margin: 2px auto;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: calc(12px * var(--app-font-scale, 1));
      line-height: 1.5;
      color: var(--text-faint);
      background: color-mix(in srgb, var(--text) 7%, transparent);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .tool-status-spin {
      width: 9px; height: 9px; border-radius: 50%;
      border: 2px solid var(--accent-border);
      border-top-color: var(--accent-strong);
      animation: tool-status-spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    .tool-status-done { color: var(--accent-strong); }
    .tool-status-done .tool-status-spin { display: none; }
    .tool-status-error { color: #c0392b; }
    .tool-status-error .tool-status-spin { display: none; }
    @keyframes tool-status-spin { to { transform: rotate(360deg); } }

    /* 引用 AI 动态（进入对话时显示在输入框上方） */
    .quote-card { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; margin: 0 14px 8px; border: 1px solid var(--accent-line); border-left: 3px solid #f472b6; border-radius: 12px; background: var(--accent-tint); font-size:calc(12.5px * var(--app-font-scale, 1)); color: var(--text-soft); }
    .quote-card .q-body { flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; }
    .quote-card .q-x { border: none; background: none; color: var(--text-faint); cursor: pointer; font-size:calc(15px * var(--app-font-scale, 1)); line-height: 1; padding: 2px; }

    /* 聊天背景（用户可设默认 / 纯色 / 图片） */
    /* ChatRoot：fixed 锚定布局视口，用 top/bottom:0（inset 拉伸）撑满视口，不写 height。
       inset 锚定的是视口边缘，任意字体档位都正好铺满可视区（字体档位只缩放文字、不缩放布局），
       彻底消除「大字体底部留白 / 小字体向下溢出」的根源。键盘弹出时由 JS 抬高 bottom 边。 */
    .chat-stage { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none; }
    .chat-stage .chat-bg { position: absolute; inset: 0; background-size: cover; background-position: center; z-index: 0; }
    .chat-stage .chat-bg-overlay { position: absolute; inset: 0; background: var(--card-solid); opacity: 0.72; z-index: 1; }
    html[data-theme="dark"] .chat-stage .chat-bg-overlay { opacity: 0.82; }
    .chat-stage > * { position: relative; z-index: 2; }
    /* 顶部栏 / 消息区 / composer 均为 ChatRoot 的流式子项，不随文档滚动 */
    .chat-header { flex-shrink: 0; }
    .chat-body { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    /* 唯一滚动容器：#chatMsgs。iOS 惯性滚动 + overscroll 断链，滑动消息区绝不拖拽整个窗口/页面 */
    #chatMsgs { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    .chat-title { cursor: pointer; }
    .chat-title:hover { text-decoration: underline; text-decoration-color: var(--accent-soft); }

    /* 会话列表（侧栏式，⋮ 菜单） */
    .session-list { display: flex; flex-direction: column; gap: 2px; }
    .session-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; cursor: pointer; color: var(--text-soft); font-size:calc(13.5px * var(--app-font-scale, 1)); border: none; background: none; width: 100%; text-align: left; }
    .session-item:hover { background: var(--accent-tint); color: var(--text); }
    .session-item.active { background: var(--accent-tint); color: var(--accent-strong); font-weight: 600; }
    .session-item .s-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session-item .s-menu { border: none; background: none; color: var(--text-faint); cursor: pointer; font-size:calc(15px * var(--app-font-scale, 1)); padding: 2px 5px; border-radius: 8px; flex-shrink: 0; }
    .session-item .s-menu:hover { color: var(--accent-strong); background: var(--accent-tint); }

    /* 会话列表（overlay drawer，绝不挤压气泡宽度） */
    .chat-sidebar {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 116;
      width: 264px; max-width: 84vw; height: 100%;
      background: var(--card-solid); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: calc(12px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));
      transform: translateX(-102%); transition: transform 0.28s ease;
      box-shadow: 2px 0 20px rgba(0,0,0,0.14);
    }
    .chat-sidebar.open { transform: translateX(0); }
    .chat-scrim { position: fixed; inset: 0; background: rgba(15,23,35,0.35); z-index: 115; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .chat-scrim.show { opacity: 1; pointer-events: auto; }

    /* 播放器底部抽屉 */
    .player-sheet-cover { width: 120px; height: 120px; border-radius: 16px; background-size: cover; background-position: center; box-shadow: 0 12px 30px rgba(0,0,0,0.25); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size:calc(44px * var(--app-font-scale, 1)); color: rgba(255,255,255,0.9); }
    .player-sheet-list { max-height: 220px; overflow-y: auto; }

    /* ============ Player ============ */
    .player-stage { display: flex; flex-direction: column; align-items: center; padding: 30px 20px; gap: 22px; }
    .album { width: 220px; height: 220px; border-radius: 24px; background-size: cover; background-position: center; box-shadow: 0 20px 50px rgba(0,0,0,0.25); position: relative; overflow: hidden; }
    .album.playing::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at center, transparent 55%, rgba(0,0,0,0.18)); }
    .album .disc { position: absolute; width: 64px; height: 64px; border-radius: 50%; background: #111; left: 50%; top: 50%; transform: translate(-50%,-50%); }
    .player-controls { display: flex; align-items: center; gap: 22px; }
    .pctrl { background: none; border: none; font-size:calc(26px * var(--app-font-scale, 1)); cursor: pointer; color: var(--text); }
    .pctrl.play { width: 60px; height: 60px; border-radius: 50%; background: var(--accent); color: #fff; font-size:calc(26px * var(--app-font-scale, 1)); display: flex; align-items: center; justify-content: center; }
    .seek { width: 100%; height: 5px; border-radius: 5px; background: var(--accent-tint); cursor: pointer; position: relative; }
    .seek > span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--accent); }
    .seek-knob { position: absolute; width: 13px; height: 13px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); top: 50%; transform: translate(-50%,-50%); }

    /* ============ Timeline (stage) ============ */
    .timeline { position: relative; padding-left: 24px; }
    .timeline::before { content: ''; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--accent-line); }
    .tl-item { position: relative; margin-bottom: 16px; }
    .tl-item::before { content: ''; position: absolute; left: -21px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 3px solid var(--card-solid); }

    /* ============ Notes ============ */
    .note-card { padding: 15px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; height: 100%; transition: transform 0.15s, box-shadow 0.15s; }
    .note-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .note-title { font-size:calc(15px * var(--app-font-scale, 1)); font-weight: 700; color: var(--text); }
    .note-body { font-size:calc(13px * var(--app-font-scale, 1)); color: var(--text-soft); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }

    /* splash */
    .splash { position: fixed; inset: 0; background: var(--bg2); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: opacity 0.6s ease; }
    .splash.fade-out { opacity: 0; pointer-events: none; }
    .splash-title { font-size:calc(40px * var(--app-font-scale, 1)); font-weight: 700; letter-spacing: 8px; color: var(--accent); opacity: 0; animation: welcomeIn 1s ease forwards; }
    .splash-sub { margin-top: 8px; font-size:calc(14px * var(--app-font-scale, 1)); color: var(--accent-strong); opacity: 0; animation: welcomeIn 1s ease 0.4s forwards; }

  <script>
"use strict";
/* =========================================================================
   Bunny's Home — Personal AI Life OS  (single-file, vanilla JS)
   Hash router + localStorage persistence + optional backend for AI chat.

// 后端地址自适应：同源部署（Render / 本地调试）走相对路径；否则（如 Vercel 托管前端）走绝对地址。
// 修复：曾固定为绝对地址，后改成 '' 导致 Vercel 上请求同源 /api/* 返回 HTML，登录/同步全部失效。
const API_BASE = (() => {
  const h = location.hostname;
  if (h === 'localhost' || h === '127.0.0.1' || h.endsWith('.onrender.com')) return '';

})();
const LS_KEY = 'bunny_os_v1';

/* ---------------- utils ---------------- */
function uid() { return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8)); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

function parseDate(s) { const p = String(s || '').split('-').map(Number); if (p.length !== 3 || p.some(isNaN)) return null; return new Date(p[0], p[1] - 1, p[2]); }

function ymd(s) { const p = String(s || '').split('-'); return p[0] + '.' + p[1] + '.' + p[2]; }
function startOfWeek(s) { const d = parseDate(s) || new Date(); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return dstr(d); }

function relTime(ts) { if (!ts) return ''; const d = Date.now() - ts; const m = Math.floor(d / 60000); if (m < 1) return '刚刚'; if (m < 60) return m + '分钟前'; const h = Math.floor(m / 60); if (h < 24) return h + '小时前'; const dd = Math.floor(h / 24); if (dd < 30) return dd + '天前'; return new Date(ts).toLocaleDateString(); }

/* ---- AI 编辑痕迹（Audit Log）：读 doc.ai.auditLog，渲染「[助手] 于 … 编辑」 ----
   区分 [我]/[助手]/[系统]；update 带 before/after 时可展开看「字段：旧值 → 新值」。 */
function latestAuditFor(entityType, entityId) {
  const log = (DB && DB.ai && Array.isArray(DB.ai.auditLog)) ? DB.ai.auditLog : [];
  return log.find((a) => a.entityType === entityType && a.entityId === entityId) || null;
}
function auditActorLabel(actor) { return actor === 'user' ? '[我]' : actor === 'system' ? '[系统]' : '[助手]'; }
function auditActionLabel(action) { return action === 'create' ? '创建' : action === 'delete' ? '删除' : '编辑'; }
function auditTimeStr(ts) {
  const d = new Date(ts); if (!Number.isFinite(d.getTime())) return '';
  const p = (n) => (n < 10 ? '0' + n : '' + n);

}
function auditVal(v) {
  if (v === undefined || v === null) return '∅';
  if (typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean') return String(v);
  return JSON.stringify(v);
}
function auditTraceHtml(entityType, entityId) {
  const a = latestAuditFor(entityType, entityId);
  if (!a) return '';
  const head = auditActorLabel(a.actor) + ' 于 ' + auditTimeStr(a.at) + ' ' + auditActionLabel(a.action);
  let diff = '';
  if (a.action === 'update' && a.before && a.after) {
    const keys = Object.keys(a.after).filter((k) => k in a.after);
    if (keys.length) {
      diff = '<span class="audit-diff">' + keys.map((k) => '<span><b>' + esc(k) + '</b>：' + esc(auditVal(a.before[k])) + ' → ' + esc(auditVal(a.after[k])) + '</span>').join('') + '</span>';
    }
  }
  const tip = (a.reason ? a.reason + (a.aiAction ? '（' + a.aiAction + '）' : '') : (a.aiAction || ''));
  return '<div class="audit-trace"' + (tip ? ' title="' + esc(tip) + '"' : '') + '>' + head + diff + '</div>';
}

/* ---- 「祂的评论」（AI 对日志/健康/财务记录的评论；只读展示 + 引用到聊天） ---- */
let _commentPending = new Set(); // 正在等 AI 考虑的 (recordType:recordId)，用于「生成中」占位
function aiCommentFor(recordType, recordId) {
  return (DB.ai.comments || []).find((c) => c.recordType === recordType && c.recordId === recordId) || null;
}
function recordContentForQuote(recordType, recordId) {
  if (recordType === 'journal') {
    const j = (DB.journal || []).find((x) => x.id === recordId);
    return j ? ((j.date ? j.date + ' ' : '') + (j.time || '') + ' · ' + (j.content || '')).trim() : '';
  }
  if (recordType === 'health') {
    const h = (DB.health || []).find((x) => x.id === recordId);
    return h ? ('日期 ' + (h.date || '') + ' · 睡眠 ' + (h.sleep ?? 0) + 'h · 饮水 ' + (h.water ?? 0) + 'L · 摄入 ' + (h.caloriesIn ?? 0) + '千卡 · 消耗 ' + (h.caloriesOut ?? 0) + '千卡 · 体重 ' + (h.weight ?? '—') + 'kg') : '';
  }
  const e = (DB.expenses || []).find((x) => x.id === recordId);
  if (e) return ((e.kind === 'income' ? '收入 ' : '支出 ') + (e.title || '') + ' ' + fmtMoney(e.amountCents) + (e.category ? ' (' + e.category + ')' : ''));
  const p = (DB.purchases || []).find((x) => x.id === recordId);
  if (p) return ('购买 ' + (p.itemName || '') + ' ×' + (p.quantity ?? 1) + ' 共 ' + fmtMoney(p.totalAmountCents));
  return '';
}
function commentSectionHtml(recordType, recordId) {
  const c = aiCommentFor(recordType, recordId);
  if (c) {
    return '<div class="deity-comment"><div class="dc-head"><span class="dc-title">♥ 祂的评论</span><span class="dc-time">' + relTime(c.updatedAt || c.createdAt) + '</span></div>' +
      '<div class="dc-body">' + esc(c.text) + '</div>' +
      '<button class="dc-quote" onclick="event.stopPropagation();quoteRecordComment(\'' + recordType + '\',\'' + recordId + '\')">↳ 引用到聊天</button></div>';
  }
  if (_commentPending.has(recordType + ':' + recordId)) return '<div class="deity-comment dc-pending">♥ 祂正在想…</div>';
  return '';
}
function quoteRecordComment(recordType, recordId) {
  const c = aiCommentFor(recordType, recordId);
  if (!c) { toast('这条评论已不存在', true); return; }
  OS.chat.quotedRecord = { type: 'record_comment', recordType, recordId, recordContent: recordContentForQuote(recordType, recordId), aiComment: c.text, createdAt: c.createdAt };
  OS.go('/chat');
}
function greeting() { const h = new Date().getHours(); if (h < 5) return '夜深了'; if (h < 12) return '早上好'; if (h < 14) return '中午好'; if (h < 18) return '下午好'; return '晚上好'; }
function todayLong() { const d = new Date(); const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday']; const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']; return days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }

function hexToHsl(hex) {
  let r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b); let h = 0, s = 0, l = (max + min) / 2;
  if (max !== min) { const d = max - min; s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    if (max === r) h = (g - b) / d + (g < b ? 6 : 0); else if (max === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h /= 6; }
  return { h: h * 360, s, l };
}
function hslToHex(h, s, l) {
  s = Math.max(0, Math.min(1, s)); l = Math.max(0, Math.min(1, l));
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  const to = (v) => Math.round((v + m) * 255).toString(16).padStart(2, '0');

}
function colorVars(hex) { const { h, s, l } = hexToHsl(hex);
  return { '--tc': hex, '--tc-strong': hslToHex(h, s, Math.max(0, l - 0.14)), '--tc-soft': hslToHex(h, s * 0.55, Math.min(0.93, l + 0.30)), '--tc-border': hslToHex(h, s, Math.min(1, l + 0.16)), '--tc-tint': hslToHex(h, Math.min(0.5, s), 0.95), '--tc-bg': hslToHex(h, Math.min(0.45, s), 0.97) };
}
function hexToRgba(hex, a) { const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16); return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; }

function inlineMd(s) {
  return String(s || '')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

// 剥离模型误输出的 function_calls / invoke / parameter / thinking XML（防泄漏到气泡；后端同样剥离，这里是流式渲染层的双保险）
function stripInternalXml(text) {
  const s = String(text == null ? '' : text);

  return s
    .replace(/<\s*(?:antml:)?function_calls\b[^>]*>[\s\S]*?<\s*\/\s*(?:antml:)?function_calls\s*>/gi, '')
    .replace(/<\s*(?:antml:)?(?:invoke|parameter|function_call|tool_call|tool_use)\b[^>]*>[\s\S]*?<\s*\/\s*(?:antml:)?(?:invoke|parameter|function_call|tool_call|tool_use)\s*>/gi, '')
    .replace(/<\s*(?:antml:)?thinking\b[^>]*>[\s\S]*?<\s*\/\s*(?:antml:)?thinking\s*>/gi, '')
    .replace(/<\s*\/?\s*(?:antml:)?(?:function_calls|function_call|invoke|parameter|tool_call|tool_use|thinking)\b[^>]*>/gi, '')

function renderMarkdown(text) {
  const e = esc(text); const lines = e.split('\n'); let html = '', listTag = null, inCode = false, codeBuf = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^\s*```/.test(line)) { if (inCode) { html += '<pre><code>' + codeBuf.join('\n') + '</code></pre>'; codeBuf = []; inCode = false; } else { if (listTag) { html += '</' + listTag + '>'; listTag = null; } inCode = true; } continue; }
    if (inCode) { codeBuf.push(line); continue; }
    const trimmed = line.trim();
    if (trimmed === '') { if (listTag) { html += '</' + listTag + '>'; listTag = null; } continue; }
    const h = trimmed.match(/^(#{1,6})\s+(.*)$/);
    if (h) { if (listTag) { html += '</' + listTag + '>'; listTag = null; } html += '<h' + h[1].length + '>' + inlineMd(h[2]) + '</h' + h[1].length + '>'; continue; }
    if (/^\s*(---|\*\*\*|___)\s*$/.test(trimmed)) { if (listTag) { html += '</' + listTag + '>'; listTag = null; } html += '<hr>'; continue; }
    const li = line.match(/^\s*[-*+]\s+(.*)$/), oli = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (li || oli) { const tag = li ? 'ul' : 'ol'; if (listTag !== tag) { if (listTag) html += '</' + listTag + '>'; html += '<' + tag + '>'; listTag = tag; } html += '<li>' + inlineMd((li || oli)[1]) + '</li>'; continue; }
    if (listTag) { html += '</' + listTag + '>'; listTag = null; }
    const q = line.match(/^\s*&gt;\s?(.*)$/);
    if (q) { html += '<blockquote>' + inlineMd(q[1]) + '</blockquote>'; continue; }
    html += '<div>' + inlineMd(line) + '</div>';
  }
  if (inCode) html += '<pre><code>' + codeBuf.join('\n') + '</code></pre>';
  if (listTag) html += '</' + listTag + '>';
  return html;
}

/* ---------------- 后端同步：local-first + 写穿 /api/state ----------------
   核心数据（计划/任务/习惯/健康/…）持久化到后端 PostgreSQL；

let _syncTimer = null;

const SYNC = {
  async push() {
    try {
      await fetch(API_BASE + '/api/state', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...DB, _serverSeeded: true }) });
    } catch (e) { /* 后端不可达：静默，仍走本地 */ }
  },
  async bootstrap() {
    try {
      const r = await fetch(API_BASE + '/api/state');
      if (!r.ok) return;
      const j = await r.json();
      const remote = j && j.data;
      if (!remote || typeof remote !== 'object') return;
      if (remote._serverSeeded) {
        delete remote._serverSeeded;
        for (const k of Object.keys(remote)) DB[k] = remote[k];
        DB._serverSeeded = true;
        try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) {}
        applyTheme(); render(); // 刷新 UI + 重新应用主题/字体缩放/壁纸（服务端数据覆盖后不丢失外观设置）
      } else {
        SYNC.push(); // 首次：上传本地数据播种服务端
      }
    } catch (e) { /* 忽略 */ }
  },
};

function applyAccent(hex) {
  const root = document.documentElement;
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  root.style.setProperty('--accent', hex);
  const { h, s, l } = hexToHsl(hex);
  root.style.setProperty('--accent-strong', hslToHex(h, s, dark ? Math.min(1, l + 0.16) : Math.max(0, l - 0.16)));
  root.style.setProperty('--accent-soft', hslToHex(h, s * 0.5, dark ? Math.max(0.25, l) : Math.min(0.93, l + 0.30)));
  root.style.setProperty('--accent-hover', hslToHex(h, s, dark ? Math.max(0.2, l - 0.06) : Math.min(1, l + 0.12)));
  root.style.setProperty('--accent-border', hslToHex(h, s, dark ? Math.max(0.3, l) : Math.min(1, l + 0.18)));
  root.style.setProperty('--accent-bg', hslToHex(h, Math.min(0.5, s), dark ? 0.10 : 0.97));
  root.style.setProperty('--accent-tint', hslToHex(h, Math.min(0.55, s), dark ? 0.17 : 0.92));
  root.style.setProperty('--accent-line', hslToHex(h, Math.min(0.55, s), dark ? 0.22 : 0.88));
}

/* ---- iOS 左边缘横滑：右滑切换 Sidebar（关→开，开→关），左滑关闭；阻止浏览器返回、不产生历史记录 ---- */
let _edgeStart = null;
function bindEdgeSwipe() {
  const EDGE = 26, TRIGGER = 56;
  document.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { _edgeStart = null; return; }
    const t = e.touches[0];
    _edgeStart = (t.clientX <= EDGE) ? { x: t.clientX, y: t.clientY } : null;
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (!_edgeStart) return;
    const t = e.touches[0]; const dx = t.clientX - _edgeStart.x, dy = t.clientY - _edgeStart.y;
    // 明确是「左边缘横向滑」时阻止原生返回手势（无论方向），保证侧栏手势优先于浏览器返回
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.4 && e.cancelable) e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', (e) => {
    if (!_edgeStart) return;
    const t = e.changedTouches[0]; const dx = t.clientX - _edgeStart.x, dy = t.clientY - _edgeStart.y;
    _edgeStart = null;
    if (Math.abs(dx) <= Math.abs(dy) * 1.4) return;
    if (dx > TRIGGER) OS.toggleSidebar();        // 右滑：关→开，开→关（右滑返回关闭 Sidebar）
    else if (dx < -TRIGGER) OS.toggleSidebar(false); // 左滑：关闭
  });
}

function parseHash() {
  let h = location.hash.replace(/^#/, '');
  if (!h || h === '/') h = '/today';
  if (h.startsWith('/settings/')) { const seg = h.split('/')[2]; h = seg ? '/settings/' + seg : '/settings'; }
  if (!ROUTES[h] && h.startsWith('/plans/')) h = '/plans';
  if (!ROUTES[h]) h = '/today';
  return h;
}

function saveTaskModal(id) {
  const title = document.getElementById('tkTitle').value.trim();
  if (!title) { toast('请输入任务名称', true); return; }
  const date = document.getElementById('tkDate').value || todayStr();
  const time = document.getElementById('tkTime').value;
  const priority = document.getElementById('tkPrio').value;
  const tags = document.getElementById('tkTags').value.split(/[,，]/).map((s) => s.trim()).filter(Boolean);
  const note = document.getElementById('tkNote').value.trim();
  const planId = document.getElementById('tkPlan').value || null;
  const lp = planId ? planById(planId) : null;
  const chain = lp ? planChain(lp) : { longTermPlanId: null, stagePlanId: null, monthlyPlanId: null, weeklyPlanId: null };
  if (id) {
    const t = taskById(id);
    Object.assign(t, { title, date, time, priority, tags, note, planId, ...chain });
  } else {

function planChain(plan) {
  const chain = { longTermPlanId: null, stagePlanId: null, monthlyPlanId: null, weeklyPlanId: null };
  let cur = plan;
  while (cur) {
    if (cur.type === 'long-term') chain.longTermPlanId = cur.id;
    else if (cur.type === 'stage') chain.stagePlanId = cur.id;
    else if (cur.type === 'monthly') chain.monthlyPlanId = cur.id;
    else if (cur.type === 'weekly') chain.weeklyPlanId = cur.id;
    cur = planById(cur.parentPlanId);
  }
  return chain;
}
function planProgress(plan) {
  const goals = plan.stageGoals || [];
  if (goals.length === 0) {
    const range = plan.type === 'monthly' || plan.type === 'weekly' ? [] : [];
    // for monthly/weekly, progress from their own tasks（月度任务用打卡数据，绝不从 DB.tasks 反推）
    if (plan.type === 'monthly') {
      const mt = plan.monthlyTasks || [];
      if (mt.length === 0) return 0;
      return Math.round(mt.reduce((s, t) => s + monthlyTaskProgress(t), 0) / mt.length);
    }
    if (plan.type === 'weekly') { const t = DB.tasks.filter((x) => x.weeklyPlanId === plan.id); return t.length ? Math.round(t.filter((x) => x.completed).length / t.length * 100) : 0; }
    return 0;
  }
  return Math.round(goals.reduce((s, g) => s + (g.progress || 0), 0) / goals.length);
}

  modal('<div class="modal-head"><h3>主题颜色</h3><button class="x" onclick="OS.closeModal()">✕</button></div><div class="modal-body">' + swatchHtml(p.themeColor) + '<input type="hidden" id="swVal" value="' + p.themeColor + '"><div style="margin-top:12px;font-size:calc(12px * var(--app-font-scale, 1));color:var(--text-faint)">颜色只作用于当前计划</div></div><div class="modal-foot"><button class="btn" onclick="OS.closeModal()">取消</button><button class="btn btn-primary" onclick="savePlanColor(\'' + id + '\')">保存</button></div>');
}
function savePlanColor(id) {
  const p = planById(id); p.themeColor = document.getElementById('swVal').value; p.updatedAt = Date.now(); saveDB(); closeModal(); render();
}
function duplicatePlan(id) {
  const p = planById(id); const c = JSON.parse(JSON.stringify(p));
  c.id = uid(); c.title = p.title + '（副本）'; c.createdAt = c.updatedAt = Date.now(); c.archived = false;
  if (c.stageGoals) c.stageGoals = c.stageGoals.map((g) => ({ ...g, id: uid() }));
  if (c.results) c.results = c.results.map((r) => ({ ...r, id: uid() }));
  DB.plans.push(c); saveDB(); render(); toast('已复制 ✓');
}
function archivePlan(id) {
  const p = planById(id); p.archived = !p.archived; p.updatedAt = Date.now(); saveDB(); render();
}
function removePlan(id) {
  const p = planById(id);
  confirmDialog('删除计划', '删除「' + p.title + '」？此操作不可撤销。', () => {
    DB.plans = DB.plans.filter((x) => x.id !== id);
    // 删除最后一个时自动补一个空白计划
    if (activePlans(p.type).length === 0) DB.plans.push(defaultPlan(p.type));
    // 解除关联
    DB.tasks.forEach((t) => { for (const f of ['planId', 'weeklyPlanId', 'monthlyPlanId', 'stagePlanId', 'longTermPlanId']) if (t[f] === id) t[f] = null; });
    if (OS.ui.planSel) delete OS.ui.planSel[p.type];
    saveDB(); render(); toast('已删除');
    AIBus.emit({ type: 'PLAN_DELETED', entityType: 'plan', entityId: id, payload: { planType: p.type, title: p.title } });
  }, '删除');
}
function openPlanCreate(type) {
  const meta = TYPE_META[type];
  let fields = '<div class="field"><label>名称</label><input class="input" id="pcName" placeholder="' + esc(meta.def || meta.label) + '"></div>';
  if (type === 'monthly') fields += '<div class="field"><label>选择月份</label><input class="input" type="month" id="pcMonth" value="' + (new Date().getFullYear() + '-' + pad(new Date().getMonth() + 1)) + '"></div>';
  else if (type === 'weekly') fields += '<div class="field"><label>选择某一周</label><input class="input" type="date" id="pcWeek" value="' + startOfWeek(todayStr()) + '"></div>';
  else fields += '<div class="field"><div class="row gap2" style="gap:8px"><div class="grow"><label>开始日期</label><input class="input" type="date" id="pcStart" value="' + todayStr() + '"></div><div class="grow"><label>结束日期</label><input class="input" type="date" id="pcEnd"></div></div></div>';
  fields += '<div class="field"><label>主题颜色</label>' + swatchHtml(meta.color) + '<input type="hidden" id="swVal" value="' + meta.color + '"></div>';
  modal('<div class="modal-head"><h3>新建' + meta.label + '</h3><button class="x" onclick="OS.closeModal()">✕</button></div><div class="modal-body">' + fields + '</div><div class="modal-foot"><button class="btn" onclick="OS.closeModal()">取消</button><button class="btn btn-primary" onclick="submitPlanCreate(\'' + type + '\')">创建</button></div>');
}
function submitPlanCreate(type) {
  const name = document.getElementById('pcName').value.trim();
  const color = document.getElementById('swVal').value;
  let plan;
  if (type === 'monthly') {
    const m = document.getElementById('pcMonth').value; if (!m) { toast('请选择月份', true); return; }
    const y = +m.slice(0, 4), mo = +m.slice(5, 7);
    plan = { id: uid(), type, title: name || monthTitle(y, mo - 1), description: '', startDate: m + '-01', endDate: m + '-28', themeColor: color, parentPlanId: null, archived: false, createdAt: Date.now(), updatedAt: Date.now(), longGoal: '', stageGoals: [], results: [], monthlyTasks: [] };
  } else if (type === 'weekly') {
    const ws = document.getElementById('pcWeek').value || startOfWeek(todayStr());
    plan = { id: uid(), type, title: name || weekTitle(ws), description: '', startDate: ws, endDate: addDays(ws, 6), themeColor: color, parentPlanId: null, archived: false, createdAt: Date.now(), updatedAt: Date.now(), longGoal: '', stageGoals: [], results: [], monthlyTasks: [] };
  } else {
    plan = { id: uid(), type, title: name || TYPE_META[type].def, description: '', startDate: document.getElementById('pcStart').value, endDate: document.getElementById('pcEnd').value, themeColor: color, parentPlanId: null, archived: false, createdAt: Date.now(), updatedAt: Date.now(), longGoal: '', stageGoals: [], results: [], monthlyTasks: [] };
  }
  DB.plans.push(plan); saveDB(); closeModal();
  if (!OS.ui.planSel) OS.ui.planSel = {}; OS.ui.planSel[type] = plan.id;
  render(); toast('已创建 ✓');
  AIBus.emit({ type: 'PLAN_CREATED', entityType: 'plan', entityId: plan.id, payload: plan });
}

function viewPlanType(type) {
  const plan = selPlan(type);
  if (!plan) return '<div class="empty"><div class="eico">📋</div><div class="etitle">暂无' + TYPE_META[type].label + '</div><button class="btn btn-primary" style="margin-top:12px" onclick="openPlanCreate(\'' + type + '\')">＋ 新建</button></div>';
  const v = colorVars(plan.themeColor);
  let html = '<div class="h1" style="margin-bottom:2px">' + TYPE_META[type].label + '</div><div class="muted" style="margin-bottom:14px">' + esc(TYPE_META[type].sub) + '</div>';
  html += planTabsHtml(type, plan);
  html += '<div style="' + Object.entries(v).map(([k, val]) => k + ':' + val).join(';') + '">';
  if (type === 'long-term') html += viewLongTerm(plan, v);

function planHeader(plan, v) {
  const pct = planProgress(plan);
  const range = plan.startDate ? (ymd(plan.startDate) + (plan.endDate ? ' — ' + ymd(plan.endDate) : '')) : '未设置周期';

/* --- goals helpers (shared long-term / stage) --- */
function addGoal(planId) {
  const p = planById(planId); if (!p.stageGoals) p.stageGoals = [];
  p.stageGoals.push({ id: uid(), title: '新目标', progress: 0, dueDate: '', completed: false, result: '' });
  p.updatedAt = Date.now(); saveDB(); render();
}
function setGoal(planId, gid, field, value) {
  const p = planById(planId); const g = (p.stageGoals || []).find((x) => x.id === gid); if (!g) return;
  g[field] = field === 'progress' ? Math.max(0, Math.min(100, +value || 0)) : value;
  p.updatedAt = Date.now(); saveDB();
  if (field === 'progress' || field === 'completed') { const el = document.getElementById('goalPct_' + gid); if (el) el.textContent = g.progress + '%'; }
  AIBus.emit({ type: 'PLAN_UPDATED', entityType: 'plan', entityId: planId, payload: { goalId: gid, field } });
}
function toggleGoal(planId, gid) {
  const p = planById(planId); const g = (p.stageGoals || []).find((x) => x.id === gid); if (!g) return;
  g.completed = !g.completed; g.progress = g.completed ? 100 : 0; p.updatedAt = Date.now(); saveDB(); render();
  AIBus.emit({ type: 'PLAN_UPDATED', entityType: 'plan', entityId: planId, payload: { goalId: gid, completed: g.completed } });
}
function delGoal(planId, gid) {
  const p = planById(planId); p.stageGoals = (p.stageGoals || []).filter((x) => x.id !== gid); p.updatedAt = Date.now(); saveDB(); render();
}
function goalDragStart(e, planId, gid) { e.dataTransfer.setData('text/plain', gid); }
function goalDrop(e, planId, targetId) {
  e.preventDefault();
  const gid = e.dataTransfer.getData('text/plain'); const p = planById(planId);
  if (!p || !gid || gid === targetId) return;
  const arr = p.stageGoals || []; const from = arr.findIndex((x) => x.id === gid); const to = arr.findIndex((x) => x.id === targetId);
  if (from < 0 || to < 0) return;
  arr.splice(to, 0, arr.splice(from, 1)[0]); p.updatedAt = Date.now(); saveDB(); render();
}
function goalRowHtml(plan, g, v, withResult) {
  return '<div class="card card-pad" draggable="true" ondragstart="goalDragStart(event,\'' + plan.id + '\',\'' + g.id + '\')" ondragover="event.preventDefault()" ondrop="goalDrop(event,\'' + plan.id + '\',\'' + g.id + '\')" style="padding:12px 14px;margin-bottom:10px">' +
    '<div class="row" style="gap:10px;margin-bottom:8px"><span class="chk' + (g.completed ? ' on' : '') + '" onclick="toggleGoal(\'' + plan.id + '\',\'' + g.id + '\')"></span>' +
    '<input class="input" style="border:none;background:transparent;font-weight:600;padding:2px" value="' + esc(g.title) + '" onchange="setGoal(\'' + plan.id + '\',\'' + g.id + '\',\'title\',this.value)">' +
    '<span class="drag-hint">⠿</span><button class="icon-btn" style="border:none;background:none;color:#c0392b" onclick="delGoal(\'' + plan.id + '\',\'' + g.id + '\')">🗑</button></div>' +
    '<div class="row" style="gap:10px"><input type="range" min="0" max="100" value="' + (g.progress || 0) + '" style="flex:1" oninput="setGoal(\'' + plan.id + '\',\'' + g.id + '\',\'progress\',this.value)"><span id="goalPct_' + g.id + '" class="chip" style="min-width:44px;justify-content:center">' + (g.progress || 0) + '%</span></div>' +
    '<div class="row" style="gap:8px;margin-top:8px"><span class="muted">截止</span><input class="input" type="date" value="' + esc(g.dueDate || '') + '" style="padding:6px 10px;font-size:calc(12.5px * var(--app-font-scale, 1))" onchange="setGoal(\'' + plan.id + '\',\'' + g.id + '\',\'dueDate\',this.value)">' +
    (withResult ? '<span class="muted">成果</span><input class="input" value="' + esc(g.result || '') + '" placeholder="阶段性成果" style="padding:6px 10px;font-size:calc(12.5px * var(--app-font-scale, 1));flex:1" onchange="setGoal(\'' + plan.id + '\',\'' + g.id + '\',\'result\',this.value)">' : '') +
    '</div></div>';
}

  const goals = plan.stageGoals || [];

function setLongGoal(id, value) { const p = planById(id); p.longGoal = value; p.updatedAt = Date.now(); saveDB(); }

/* --- stage --- */
function viewStage(plan, v) {
  let html = planHeader(plan, v);

function addResult(planId) { const p = planById(planId); if (!p.results) p.results = []; p.results.push({ id: uid(), title: '新成果', progress: 0, completed: false }); p.updatedAt = Date.now(); saveDB(); render(); }
function setResult(planId, rid, field, value) { const p = planById(planId); const r = (p.results || []).find((x) => x.id === rid); if (!r) return; r[field] = field === 'progress' ? Math.max(0, Math.min(100, +value || 0)) : value; p.updatedAt = Date.now(); saveDB(); const el = document.getElementById('resPct_' + rid); if (el && field === 'progress') el.textContent = r.progress + '%'; }
function delResult(planId, rid) { const p = planById(planId); p.results = (p.results || []).filter((x) => x.id !== rid); p.updatedAt = Date.now(); saveDB(); render(); }
function resultRowHtml(plan, r, v) {
  return '<div class="card card-pad" style="padding:12px 14px;margin-bottom:10px;border:1px solid ' + v['--tc-border'] + '"><div class="row" style="gap:10px;margin-bottom:8px">' +
    '<span class="chk' + (r.completed ? ' on' : '') + '" onclick="setResult(\'' + plan.id + '\',\'' + r.id + '\',\'completed\',' + (!r.completed) + ')"></span>' +
    '<input class="input" style="border:none;background:transparent;font-weight:600;padding:2px" value="' + esc(r.title) + '" onchange="setResult(\'' + plan.id + '\',\'' + r.id + '\',\'title\',this.value)">' +

/* --- monthly：月份标题 → 月历（任务颜色点）→ 月度任务卡片（名称 + 进度 + 打卡） --- */
// 月度任务进度：真实数据（checkIns.length / target），绝不画死视觉效果
function monthlyTaskProgress(t) {
  const checkIns = Array.isArray(t.checkIns) ? t.checkIns : [];
  const target = Math.max(1, Math.round(Number(t.target) || 0));
  return Math.min(100, Math.round(checkIns.length / target * 100));
}
// 按日期聚合「当天哪些任务打了卡」→ { 'YYYY-MM-DD': [taskId, ...] }，只来自真实 check-ins
function monthlyTaskCheckinsByDate(tasks) {
  const map = {};
  for (const t of (tasks || [])) {
    for (const d of (Array.isArray(t.checkIns) ? t.checkIns : [])) {
      const key = String(d || '').trim(); if (!key) continue;
      (map[key] = map[key] || []).push(t.id);
    }
  }
  return map;
}
function viewMonthlyPlan(plan, v) {
  const d = parseDate(plan.startDate) || new Date();
  const y = d.getFullYear(), m = d.getMonth();
  const tasks = plan.monthlyTasks || [];
  const today = todayStr();
  let html = planHeader(plan, v);
  // 月份标题（必须写在日历上方）
  html += '<div class="cal-head"><button class="btn btn-sm" onclick="shiftPlanMonth(\'' + plan.id + '\',-1)">‹ 上月</button><span class="cal-title">' + monthTitle(y, m) + '</span><button class="btn btn-sm" onclick="shiftPlanMonth(\'' + plan.id + '\',1)">下月 ›</button></div>';
  // 月历：格子只显示「任务颜色点」（来自真实打卡），绝不塞任务文字 / 当日计划
  const first = new Date(y, m, 1); const start = new Date(y, m, 1 - ((first.getDay() + 6) % 7));
  const byDate = monthlyTaskCheckinsByDate(tasks);
  html += '<div class="cal-grid">' + DOW.map((w) => '<div class="cal-dow">' + w + '</div>').join('');
  for (let i = 0; i < 42; i++) {
    const cell = new Date(start); cell.setDate(start.getDate() + i); const ds = dstr(cell); const inMonth = cell.getMonth() === m;
    const doneIds = byDate[ds] || [];
    let dots = '';
    const shown = doneIds.slice(0, 4);
    for (const id of shown) { const t = tasks.find((x) => x.id === id); dots += '<span class="mt-dot" style="background:' + (t ? t.color : '#6b8cae') + '"></span>'; }
    if (doneIds.length > 4) dots += '<span class="mt-more">+' + (doneIds.length - 4) + '</span>';
    html += '<div class="cal-cell' + (inMonth ? '' : ' other') + (ds === today ? ' today' : '') + '"><div class="dnum">' + cell.getDate() + '</div>' + (dots ? '<div class="mt-dots">' + dots + '</div>' : '') + '</div>';
  }
  html += '</div>';
  // 月度任务卡片（日历下方）：名称 + 进度条 + 进度% + 今日打卡
  html += '<div class="section-head" style="margin-top:20px"><h2>月度任务</h2><button class="btn btn-primary btn-sm" onclick="monthlyTaskModal(\'' + plan.id + '\')">＋ 新建任务</button></div>';
  html += tasks.length === 0
    ? '<div class="card card-pad empty" style="padding:26px"><div class="esub">还没有月度任务</div><div class="muted" style="font-size:calc(12px * var(--app-font-scale, 1));margin-top:6px">点击「＋ 新建任务」添加，完成后每日打卡</div></div>'
    : tasks.map((t) => monthlyTaskCardHtml(plan, t)).join('');
  return html;
}
function shiftPlanMonth(id, n) { const p = planById(id); const d = parseDate(p.startDate); d.setMonth(d.getMonth() + n); const ym = d.getFullYear() + '-' + pad(d.getMonth() + 1); p.startDate = ym + '-01'; p.endDate = ym + '-28'; p.title = monthTitle(d.getFullYear(), d.getMonth()); p.updatedAt = Date.now(); saveDB(); render(); }
function monthlyTaskCardHtml(plan, t) {
  const pct = monthlyTaskProgress(t);
  const count = Array.isArray(t.checkIns) ? t.checkIns.length : 0;
  const target = Math.max(1, Math.round(Number(t.target) || 0));
  const doneToday = Array.isArray(t.checkIns) && t.checkIns.includes(todayStr());
  const c = t.color || '#10b981';
  return '<div class="card card-pad" style="margin-bottom:12px;border-left:4px solid ' + c + '">' +
    '<div class="row" style="gap:10px;align-items:center"><span class="mt-color-dot" style="background:' + c + '"></span>' +
    '<div class="grow"><div style="font-weight:700;font-size:calc(15px * var(--app-font-scale, 1))">' + esc(t.name) + '</div>' +
    '<div class="muted" style="font-size:calc(11.5px * var(--app-font-scale, 1))">已打卡 ' + count + ' / ' + target + ' 次</div></div>' +
    '<button class="icon-btn" style="border:none;background:none" onclick="monthlyTaskMenu(event,\'' + plan.id + '\',\'' + t.id + '\')">⋯</button></div>' +
    '<div class="progress" style="margin:10px 0 8px"><span style="width:' + pct + '%;background:' + c + '"></span></div>' +
    '<div class="row" style="gap:10px;align-items:center"><span class="chip" style="font-weight:700;min-width:44px;justify-content:center">' + pct + '%</span><span class="grow"></span>' +
    '<button class="btn btn-sm ' + (doneToday ? 'btn-soft' : 'btn-primary') + '" onclick="monthlyTaskCheckinAction(\'' + plan.id + '\',\'' + t.id + '\')">' + (doneToday ? '今日已打卡 ✓' : '今日打卡') + '</button></div></div>';
}
// 打卡（幂等）：同一任务同一天只算一次，重复点击不增加进度
function monthlyTaskCheckinAction(planId, taskId) {
  const plan = planById(planId); if (!plan) return;
  const t = (plan.monthlyTasks || []).find((x) => x.id === taskId); if (!t) return;
  if (!Array.isArray(t.checkIns)) t.checkIns = [];
  const today = todayStr();
  if (t.checkIns.includes(today)) { toast('今天已打卡 ✓'); return; }
  t.checkIns.push(today); t.updatedAt = Date.now(); plan.updatedAt = Date.now();
  saveDB(); render();
  toast('已打卡 🔥 ' + monthlyTaskProgress(t) + '%');
}
function monthlyTaskModal(planId, taskId) {
  const plan = planById(planId); if (!plan) return;
  const t = taskId ? (plan.monthlyTasks || []).find((x) => x.id === taskId) : null;
  const color = t ? t.color : '#10b981';
  modal('<div class="modal-head"><h3>' + (t ? '编辑任务' : '新建任务') + '</h3><button class="x" onclick="OS.closeModal()">✕</button></div><div class="modal-body">' +
    '<div class="field"><label>任务名称</label><input class="input" id="mtName" value="' + esc(t ? t.name : '') + '" placeholder="如：学完第一章"></div>' +
    '<div class="field"><label>目标打卡次数</label><input class="input" type="number" id="mtTarget" value="' + (t ? (t.target || 30) : 30) + '" min="1" placeholder="30"></div>' +
    '<div class="field"><label>任务颜色</label>' + swatchHtml(color) + '<input type="hidden" id="swVal" value="' + color + '"></div>' +
    '</div><div class="modal-foot">' + (t ? '<button class="btn btn-danger" onclick="deleteMonthlyTask(\'' + planId + '\',\'' + t.id + '\')">删除</button>' : '') + '<button class="btn" style="margin-left:auto" onclick="OS.closeModal()">取消</button><button class="btn btn-primary" onclick="saveMonthlyTask(\'' + planId + '\',\'' + (t ? t.id : '') + '\')">保存</button></div>');
}
function saveMonthlyTask(planId, taskId) {
  const plan = planById(planId); if (!plan) return;
  const name = document.getElementById('mtName').value.trim();
  if (!name) { toast('请输入任务名称', true); return; }
  const target = Math.max(1, Math.round(Number(document.getElementById('mtTarget').value) || 30));
  const color = document.getElementById('swVal').value;
  if (!Array.isArray(plan.monthlyTasks)) plan.monthlyTasks = [];
  if (taskId) {

/* ================= HABIT ================= */
const FREQ = { daily: '每天', weekdays: '工作日', weekly: '每周', custom: '自定义' };
function habitById(id) { return DB.habits.find((h) => h.id === id); }
function isHabitDone(h, date) { return (h.completions || []).includes(date); }
function habitStreak(h) {
  const set = new Set(h.completions || []);
  let streak = 0, d = todayStr();
  if (!set.has(d)) d = addDays(d, -1);
  while (set.has(d)) { streak++; d = addDays(d, -1); }
  return streak;
}
// 累计完成次数：只统计「已跨 0 点」的日期（严格早于今天），今天的打卡由今日状态/连续天数体现。
function habitTotalCompletions(h) {
  const today = todayStr();
  return new Set((h.completions || []).filter((d) => d && d < today)).size;
}
function toggleHabit(id, date) {
  const h = habitById(id); if (!h) return;
  if (!Array.isArray(h.completions)) h.completions = [];
  // 幂等：同一天重复点击/刷新/重进都不再累加，也不删除已有记录
  if (h.completions.includes(date)) { toast('今日已打卡 ✓'); return; }
  h.completions.push(date);
  h.streak = habitStreak(h);
  saveDB(); render();
  toast('已打卡 🔥 ' + habitStreak(h) + ' 天');
  AIBus.emit({ type: 'HABIT_COMPLETED', entityType: 'habit', entityId: id, payload: h });
}
function habitRowHtml(h, date) {

    '<span class="habit-streak">' + total + ' 次 · 🔥 ' + habitStreak(h) + ' 天</span>' +
    '<span class="chk' + (done ? ' on' : '') + '" onclick="event.stopPropagation();toggleHabit(\'' + h.id + '\',\'' + date + '\')"></span>' +
    '<button class="icon-btn" style="border:none;background:none" onclick="event.stopPropagation();habitMenu(event,\'' + h.id + '\')">⋯</button></div>';

function parseSleep(s) {
  const t = String(s || '').trim(); if (!t) return null;
  let hours = 0, hit = false;
  const hm = t.match(/(\d+(?:\.\d+)?)\s*h/i); if (hm) { hours += +hm[1]; hit = true; }
  const mm = t.match(/(\d+)\s*m/i); if (mm) { hours += +mm[1] / 60; hit = true; }
  if (hit) return Math.round(hours * 100) / 100;
  const n = Number(t); return Number.isFinite(n) ? n : null;
}

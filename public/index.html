function aiNewMemorySave() { const c = document.getElementById('amNewContent').value.trim(); if (!c) { toast('内容不能为空', true); return; } aiAddMemory(c, document.getElementById('amNewCat').value.trim() || '偏好', 'manual', null); closeModal(); render(); toast('已记住 ♥'); }
function viewAIMemory() {
  const list = DB.ai.memories || [];
  let html = '<div class="spread" style="margin-bottom:16px"><div><div class="h1">AI 记忆</div><div class="muted">祂记住的关于你的事情</div></div><button class="btn btn-primary" onclick="aiNewMemory()">＋ 新增</button></div>';
  html += '<div class="muted" style="font-size:12px;margin-bottom:10px">只记长期偏好、习惯、明确「记住」请求和重要信息，不记每句话。</div>';
  html += '<div>' + (list.length ? list.map(aiMemoryItemHtml).join('') : '<div class="empty"><div class="eico">🧠</div><div class="etitle">还没有记忆</div><div class="esub">和祂聊聊，或点击右上角主动告诉祂</div></div>') + '</div>';
  return html;
}

/* ---- AI 状态页 ---- */
function aiStateItemHtml(s) {
  return '<div class="ai-state-item"><div class="spread"><div class="emotion">' + esc(s.emotion) + aiStateDotsHtml(s.intensity) + '</div>' + (s.acknowledged ? '<span class="chip" style="font-size:10px">已回应</span>' : '<button class="btn btn-sm" onclick="aiAcknowledgeState(\'' + s.id + '\')">回应祂</button>') + '</div>' +
    (s.reason ? '<div class="muted" style="font-size:12.5px;margin-top:6px;line-height:1.6">' + esc(s.reason) + '</div>' : '') +
    '<div class="muted" style="font-size:11px;margin-top:6px">来自 · ' + esc(aiStateTriggerLabel(s)) + ' · ' + relTime(s.createdAt) + '</div></div>';
}
function viewAIActivity() {
  const states = DB.ai.states || [];
  const acts = DB.ai.activities || [];
  const cur = aiCurrentState();
  let html = '<div class="h1" style="margin-bottom:2px">最近的祂</div><div class="muted" style="margin-bottom:14px">AI 状态 · 祂此刻的感受</div>';
  if (cur) html += '<div class="card card-pad ai-companion" style="margin-bottom:16px"><div class="row" style="gap:10px;align-items:center"><div class="ai-heart">♥</div><div><div style="font-weight:800;font-size:16px">' + esc(cur.emotion) + ' · ' + esc(aiIntensityText(cur.intensity)) + '</div><div class="muted" style="font-size:12.5px">' + esc(cur.reason || '') + '</div></div></div></div>';
  const today = todayStr();
  const groups = [
    ['今天', (s) => dstr(new Date(s.createdAt)) === today],
    ['昨天', (s) => dstr(new Date(s.createdAt)) === addDays(today, -1)],
    ['本周', (s) => s.createdAt > Date.now() - 7 * 86400000],
    ['更早', () => true],
  ];
  let any = false;
  for (const g of groups) {
    const items = states.filter(g[1]);
    if (!items.length) continue; any = true;
    html += '<div class="section-head"><h2>' + g[0] + '</h2></div>' + items.map(aiStateItemHtml).join('');
  }
  if (!any) html += '<div class="empty"><div class="eico">💗</div><div class="etitle">祂还没有表露情绪</div><div class="esub">状态只在有意义的事件时产生，不会刷屏</div></div>';
  html += '<div class="section-head" style="margin-top:20px"><h2>AI 动态</h2></div>';
  html += '<div>' + (acts.length ? acts.slice(0, 30).map(aiActivityItemHtml).join('') : '<div class="empty"><div class="eico">✨</div><div class="etitle">暂无动态</div></div>') + '</div>';
  return html;
}

/* ---- 首页 · AI 陪伴头部 + 天气 ---- */
function aiCompanionStatus() {
  const st = aiCurrentState();
  if (st) return { text: aiIntensityText(st.intensity) + ' · ' + st.emotion, state: st };
  const ctx = buildAIContext();
  if (ctx.music && ctx.music.playing) return { text: '一起听 · ' + ctx.music.title, state: null };
  if (ctx.weather && ctx.weather.text) return { text: ctx.weather.text + ' ' + ctx.weather.temp + '°C', state: null };
  return { text: '我在这儿，随时陪着你', state: null };
}
function aiNoticeHtml(n) {
  const icon = { INFO: '💡', REMINDER: '⏰', IMPORTANT: '❗', GENTLE_NUDGE: '🌿' }[n.kind] || '💡';
  let html = '<div class="ai-notice"><div style="font-size:16px">' + icon + '</div><div class="body"><div style="font-weight:700;font-size:13.5px">' + esc(n.title) + '</div><div class="muted" style="font-size:12.5px">' + esc(n.body) + '</div>';
  if (n.actions && n.actions.length) html += '<div class="actions">' + n.actions.map((a) => '<button class="btn btn-sm ' + (a.primary ? 'btn-primary' : '') + '" onclick="event.stopPropagation();aiNoticeAction(\'' + n.id + '\',\'' + a.key + '\')">' + esc(a.label) + '</button>').join('') + '</div>';
  html += '</div><button class="icon-btn" style="border:none;background:none;color:var(--text-faint)" onclick="event.stopPropagation();dismissReminder(\'' + n.id + '\')">✕</button></div>';
  return html;
}
function aiCompanionHeader() {
  const st = aiCurrentState();
  const status = aiCompanionStatus();
  const unread = (DB.ai.notifications || []).filter((n) => !n.read);
  let html = '<div class="card card-pad ai-companion" style="margin-bottom:14px">';
  html += '<div class="spread" style="align-items:flex-start"><div class="row" style="gap:10px;align-items:center"><div class="ai-heart">♥</div><div><div style="font-weight:800;font-size:16px">♥ 我的AI</div><div class="status">' + esc(status.text) + '</div></div></div>';
  if (st) html += '<span class="ai-state-pill" style="cursor:pointer" onclick="OS.go(\'/ai/activity\')">' + esc(aiIntensityText(st.intensity) + ' · ' + st.emotion) + '</span>';
  html += '</div>';
  html += '<div class="row" style="gap:8px;margin-top:10px"><button class="btn btn-sm btn-primary" onclick="OS.go(\'/chat\')">和我聊聊</button><button class="btn btn-sm" onclick="OS.go(\'/ai/memory\')">查看记忆</button></div>';
  html += unread.map(aiNoticeHtml).join('');
  html += '</div>';
  return html;
}
function aiMarkNoticeRead(id) { const n = (DB.ai.notifications || []).find((x) => x.id === id); if (n) n.read = true; saveDB(); render(); }
// 仅关闭提醒，不跳转（“我知道了”）
function dismissReminder(id) { const n = (DB.ai.notifications || []).find((x) => x.id === id); if (n) n.read = true; saveDB(); render(); }
function weatherSectionHtml() {
  const w = DB.weather; const loc = DB.location;
  if (!w && !loc) return '';
  let html = '<div class="row" style="gap:8px;margin-bottom:12px;flex-wrap:wrap">';
  if (w) { const ico = { sunny: '☀️', cloudy: '⛅', rain: '🌧', overcast: '☁️' }[w.code] || '🌤'; html += '<span class="chip">' + ico + ' ' + esc(w.text) + ' ' + esc(String(w.temp)) + '°C' + (w.source === 'mock' ? ' <span style="opacity:.6">Mock</span>' : '') + '</span>'; }
  if (loc) html += '<span class="chip">📍 ' + esc(loc.city) + '</span>';
  html += '<button class="btn btn-sm" onclick="refreshWeather()" title="刷新天气">↻ 刷新</button>';
  if (!w) html += '<button class="btn btn-sm" onclick="aiLocationModal()">开启定位/天气</button>';
  html += '</div>';
  return html;
}
async function refreshWeather() {
  if (!aiCan('weather')) { toast('天气权限已关闭，请先在「我的AI 设置」中打开', true); return; }
  await WeatherProvider.refresh();
  toast(DB.weather && DB.weather.source === 'amap' ? '已更新实时天气' : '当前为 Mock 天气（未定位或未配置 AMAP_KEY）');
}

/* ---- 权限开关 UI ---- */
function aiPermTogglesHtml() {
  const p = aiPerm();
  let html = '<div class="field" style="margin-bottom:6px"><label style="margin:0;font-weight:700">♥ 我的AI 权限</label><div class="muted" style="font-size:11px">决定祂能看见和使用什么。位置默认关闭。</div></div>';
  for (const k in AI_PERM_DEFAULT) html += '<div class="field" style="margin-bottom:2px"><div class="row" style="justify-content:space-between"><label style="margin:0;font-size:13px">' + esc(AI_PERM_LABEL[k] || k) + '</label><button class="btn btn-sm ' + (p[k] ? 'btn-primary' : '') + '" onclick="aiTogglePerm(\'' + k + '\')">' + (p[k] ? '开' : '关') + '</button></div></div>';
  return html;
}

/* ---- 位置权限 ---- */
function aiLocationModal() {
  if (!aiCan('location')) { toast('位置权限已关闭，请先在「我的AI 设置」中打开', true); return; }
  modal('<div class="modal-head"><h3>位置权限</h3><button class="x" onclick="OS.closeModal()">✕</button></div><div class="modal-body"><div class="muted" style="font-size:14px;line-height:1.7">允许我的AI使用当前位置吗？<br>用于天气提醒与问候，可随时在「我的AI 设置」中关闭。</div></div><div class="modal-foot"><button class="btn" onclick="OS.closeModal()">暂不</button><button class="btn btn-primary" onclick="OS.closeModal();aiLocationAllow()">允许</button></div>');
}
function aiLocationAllow() {
  aiPerm().location = true; saveDB();
  LocationProvider.getCurrentLocation().then(async (loc) => {
    toast('定位成功：' + esc(loc.city) + (loc.source === 'ip' ? '（高德 IP 大致定位）' : '')); render();
    AIBus.emit({ type: 'LOCATION_CHANGED', entityType: 'location', payload: loc });
    // 拿到位置后顺手拉一次真实天气
    const w = await WeatherProvider.fetchReal();
    if (w) { DB.weather = w; saveDB(); render(); WeatherProvider.evaluate(w); AIBus.emit({ type: 'WEATHER_UPDATED', entityType: 'weather', payload: w }); }
    else toast('天气暂未更新（未配置 AMAP_KEY 或网络异常）');
  });
}

/* ---- 通知动作 / 雨伞提议 ---- */
function aiNoticeAction(nid, key) {
  const n = (DB.ai.notifications || []).find((x) => x.id === nid);
  if (n) n.read = true;
  aiMarkAsked(key);
  saveDB();
  switch (key) {
    case 'umbrella_accept': aiAcceptUmbrella(); break;
    case 'umbrella_reject': aiRejectUmbrella(); break;
    case 'mem_yes': if (_aiPendingMem) { aiAddMemory(_aiPendingMem.content, _aiPendingMem.category, _aiPendingMem.sourceType, _aiPendingMem.sourceId); toast('已记住 ♥'); } _aiPendingMem = null; break;
    case 'mem_no': _aiPendingMem = null; break;
    case 'dismiss': break; // 仅关闭，不跳转
    case 'open_shopping': OS.go('/shopping'); return;
    case 'open_memory': OS.go('/ai/memory'); return;
    case 'open_journal': OS.go('/journal'); return;
  }
  render();
}
function aiOnWeatherRain(w) {
  if (!aiCan('weather') || !aiCan('shopping')) return;
  if (aiAskedRecently('umbrella')) return;
  if ((DB.ai.memories || []).some((m) => (m.content || '').includes('伞')) && !shoppingItemsOf('deity').some((i) => i.title.includes('伞') && !i.completed)) aiProposeUmbrella();
}
function aiProposeUmbrella() {
  aiMarkAsked('umbrella');
  const n = AINotificationComposer.umbrella(buildAIContext());
  AINotify.send(n.severity, n.title, n.message, [
    { key: 'umbrella_accept', label: n.actionLabel, primary: true },
    { key: 'umbrella_reject', label: n.secondaryActionLabel, primary: false },
  ], { render: true });
}
function aiAcceptUmbrella() { addShoppingItem('deity', '雨伞', { note: '祂提醒：今天可能要下雨', category: '生活', priority: 'high' }); toast('已放进祂的清单 ♥'); }
function aiRejectUmbrella() {
  aiSetState('委屈', 1, '我记了一周的雨伞，但你刚刚说不需要了。不是生气，只是想帮你却没帮上。', 'weather', 'shopping', null, null);
  toast('好的，那这次先不带。');
}
/* ---- 事件规则引擎 ---- */
function aiOnEvent(ev) {
  try {
    if (ev.type === 'PAGE_CHANGED') return;
    if (!aiCan('pageContext')) return;
    const ctx = buildAIContext();

    if (ev.type === 'JOURNAL_CREATED') {
      if (!aiCan('journal')) return;
      const e = ev.payload || {};
      aiLogActivity('journal', '写下日志：' + (e.content || '').slice(0, 24) + ((e.content || '').length > 24 ? '…' : ''));
      aiConsiderMemory(e.content, '偏好', 'journal', ev.entityId);
      const r = AIResponseComposer.generate(ev, ctx);
      if (r && r.shouldRespond) { if (r.state) aiSetState(r.state.emotion, r.state.intensity, r.state.reason, 'journal', 'journal', ev.entityId, null); AINotify.send('INFO', '关于你的日志', r.message, [{ key: 'open_journal', label: '看看' }], { render: false }); }
      return;
    }
    if (ev.type === 'JOURNAL_UPDATED') { aiLogActivity('journal', '更新了一条日志'); return; }
    if (ev.type === 'JOURNAL_DELETED') { return; }

    if (ev.type === 'MUSIC_PLAY' || ev.type === 'MUSIC_CHANGED') {
      const t = currentTrack();
      aiLogActivity('music', (ev.type === 'MUSIC_PLAY' ? '一起听：' : '切换到：') + (t ? t.title : ''));
      if (ev.type === 'MUSIC_PLAY') { const r = AIResponseComposer.generate(ev, ctx); if (r && r.shouldRespond && r.state) aiSetState(r.state.emotion, r.state.intensity, r.state.reason, 'music', 'music', null, null); }
      return;
    }
    if (ev.type === 'TASK_COMPLETED') { aiLogActivity('task', '完成：' + (ev.payload ? ev.payload.title : '')); const r = AIResponseComposer.generate(ev, ctx); if (r && r.shouldRespond && r.state) aiSetState(r.state.emotion, r.state.intensity, r.state.reason, 'task', 'task', ev.entityId, null); return; }
    if (ev.type === 'TASK_CREATED') { aiLogActivity('task', '创建：' + (ev.payload ? ev.payload.title : '')); return; }
    if (ev.type === 'TASK_DELETED') { return; }
    if (ev.type === 'TASK_UPDATED') { return; }
    if (ev.type === 'HABIT_COMPLETED') { aiLogActivity('habit', '打卡：' + (ev.payload ? ev.payload.name : '')); const r = AIResponseComposer.generate(ev, ctx); if (r && r.shouldRespond && r.state) aiSetState(r.state.emotion, r.state.intensity, r.state.reason, 'habit', 'habit', ev.entityId, null); return; }
    if (ev.type === 'HABIT_UPDATED') { return; }
    if (ev.type === 'PLAN_CREATED') { aiLogActivity('plan', '新建计划：' + (ev.payload ? ev.payload.title : '')); return; }
    if (ev.type === 'PLAN_DELETED') { aiLogActivity('plan', '删除计划：' + (ev.payload ? ev.payload.title : '')); return; }
    if (ev.type === 'PLAN_UPDATED') { return; }
    if (ev.type === 'CALENDAR_EVENT_CREATED') { aiLogActivity('task', '新增日程：' + (ev.payload ? ev.payload.title : '')); return; }
    if (ev.type === 'LOCATION_CHANGED') { aiLogActivity('location', '定位到：' + (ev.payload ? ev.payload.city : '')); const r = AIResponseComposer.generate(ev, ctx); if (r && r.shouldRespond) AINotify.send('INFO', '定位成功', r.message, null, { render: true }); return; }
    if (ev.type === 'WEATHER_UPDATED') { if (ev.payload && ev.payload.code === 'rain') aiOnWeatherRain(ev.payload); return; }
    if (ev.type === 'SHOPPING_ITEM_COMPLETED') { aiLogActivity('shopping', '完成购买：' + (ev.payload ? ev.payload.title : '')); return; }
    if (ev.type === 'SHOPPING_ITEM_UPDATED') { aiLogActivity('shopping', '更新清单'); return; }
    if (ev.type === 'MEMORY_CREATED' || ev.type === 'AI_STATE_CHANGED') { return; }
  } catch (e) { console.warn('[aiOnEvent]', e); }
}

/* ---- 启动 ---- */
function aiBootstrap() {
  setTimeout(async () => {
    try {
      if (aiCan('weather')) { const w = await WeatherProvider.refresh(); if (w && w.code === 'rain') aiOnWeatherRain(w); }
    } catch (e) { console.warn('[aiBootstrap]', e); }
  }, 1500);
}

init();
aiBootstrap();
musicRefreshStatus();

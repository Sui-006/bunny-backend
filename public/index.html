<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bunny's Home</title>
  <meta name="description" content="Bunny's Home — 属于 Bunny & Elliott 的个人 AI 生活操作系统（任务 / 习惯 / 计划 / 记账 / 健康 / AI 陪伴）">
  <meta name="theme-color" content="#6b8cae">
  <!-- PWA：可安装到 iPhone / Android 主屏幕 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <!-- iOS 独立窗口（添加到主屏幕后以 App 形态打开，不显示 Safari 地址栏） -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bunny's Home">
  <link rel="stylesheet" href="fonts/fonts.css">
  <style>
    @font-face {
      font-family: 'BAUHS93';
      src: url('BAUHS93.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face { font-family: 'Arial Rounded MT Bold'; src: url('ARLRDBD.TTF') format('truetype'); font-weight: normal; font-style: normal; }
    @font-face { font-family: 'Colonna MT'; src: url('COLONNA.TTF') format('truetype'); font-weight: normal; font-style: normal; }
    @font-face { font-family: 'Curlz MT'; src: url('CURLZ___.TTF') format('truetype'); font-weight: normal; font-style: normal; }
    @font-face { font-family: 'Ink Free'; src: url('Inkfree.ttf') format('truetype'); font-weight: normal; font-style: normal; }
    @font-face { font-family: 'Blackadder ITC'; src: url('ITCBLKAD.TTF') format('truetype'); font-weight: normal; font-style: normal; }
    @font-face { font-family: 'Edwardian Script ITC'; src: url('ITCEDSCR.TTF') format('truetype'); font-weight: normal; font-style: normal; }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --accent: #6b8cae;
      --accent-strong: #3e6b8e;
      --accent-soft: #a9c4dc;
      --accent-hover: #b8d6ea;
      --accent-border: #a0bfd4;
      --accent-bg: #f7fafe;
      --accent-tint: #e8f0f8;
      --accent-line: #e2ecf4;

      --bg: #f4f7fb;
      --bg2: #ffffff;
      --card: rgba(255,255,255,0.85);
      --card-solid: #ffffff;
      --border: rgba(210,226,240,0.6);
      --border-strong: rgba(180,200,220,0.8);
      --text: #33465c;
      --text-soft: #6b7f94;
      --text-faint: #93a5b8;
      --shadow: 0 2px 10px rgba(40,60,90,0.05);
      --shadow-md: 0 8px 28px rgba(40,60,90,0.10);
      --radius: 16px;
      --radius-lg: 22px;
      --radius-sm: 12px;
      --sidebar-w: 252px;
      --topbar-h: 56px;
      --bottomnav-h: 60px;
      --dur: 0.18s;
    }
    html[data-theme="dark"] {
      --bg: #0f141b;
      --bg2: #161d27;
      --card: rgba(26,34,46,0.8);
      --card-solid: #1a222e;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.14);
      --text: #dbe4ee;
      --text-soft: #93a5b8;
      --text-faint: #64748b;
      --shadow: 0 2px 10px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 28px rgba(0,0,0,0.45);
      --accent-bg: #141b24;
      --accent-tint: #1c2733;
      --accent-line: #223040;
    }
    html { font-size: 15px; }
    body {
      font-family: 'BAUHS93', -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh; height: 100dvh;
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }
    button, input, textarea, select { font-family: inherit; color: inherit; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(140,160,180,0.35); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(140,160,180,0.55); }

    .app { display: block; height: 100vh; height: 100dvh; width: 100%; }
    .scrim { position: fixed; inset: 0; background: rgba(15,23,35,0.4); z-index: 110; opacity: 0; pointer-events: none; transition: opacity 0.25s; backdrop-filter: blur(2px); }
    .scrim.show { opacity: 1; pointer-events: auto; }

    /* ============ Sidebar（fixed overlay drawer，绝不挤压主内容） ============ */
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 120;
      width: var(--sidebar-w); max-width: 86vw; height: 100%;
      background: var(--accent-bg); border-right: 1px solid var(--accent-line);
      display: flex; flex-direction: column; padding: calc(18px + env(safe-area-inset-top)) 12px 12px;
      transform: translateX(-102%);
      transition: transform 0.28s ease;
      box-shadow: 2px 0 20px rgba(0,0,0,0.12);
    }
    .sidebar.open { transform: translateX(0); }
    .logo {
      font-size: 18px; font-weight: 700; letter-spacing: 1px; color: var(--accent);
      padding: 6px 12px 14px; display: flex; align-items: center; gap: 8px;
    }
    .logo .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-new {
      display: flex; align-items: center; gap: 8px; width: 100%;
      background: var(--bg2); border: 1px solid var(--accent-line); border-radius: 14px;
      padding: 11px 14px; font-size: 14px; color: var(--accent-strong); cursor: pointer;
      transition: background 0.15s; margin-bottom: 12px; text-align: left;
    }
    .nav-new:hover { background: var(--accent-tint); }
    .nav-section {
      font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text-faint); padding: 12px 12px 6px; font-weight: 700;
    }
    .nav-scroll { flex: 1; overflow-y: auto; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px;
      font-size: 14px; color: var(--text-soft); cursor: pointer; transition: background 0.15s, color 0.15s;
      margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left;
    }
    .nav-item:hover { background: var(--accent-tint); color: var(--text); }
    .nav-item.active { background: var(--accent-tint); color: var(--accent-strong); font-weight: 600; }
    .nav-item .ico { width: 20px; text-align: center; flex-shrink: 0; }
    .nav-item .lbl { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-item .badge { font-size: 11px; background: var(--accent); color: #fff; border-radius: 10px; padding: 1px 7px; }
    .nav-foot { border-top: 1px solid var(--accent-line); padding-top: 8px; }

    /* ============ Main / Topbar ============ */
    .main { width: 100%; display: flex; flex-direction: column; min-width: 0; height: 100vh; position: relative; }
    .main .bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 1; pointer-events: none; z-index: 0; transition: opacity 0.3s; }
    .topbar {
      height: calc(var(--topbar-h) + env(safe-area-inset-top)); flex-shrink: 0; display: flex; align-items: center; gap: 12px;
      padding: env(safe-area-inset-top) 18px 0; position: relative; z-index: 2;
      background: rgba(255,255,255,0.55); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    html[data-theme="dark"] .topbar { background: rgba(18,25,34,0.55); }
    .menu-btn { background: none; border: none; font-size: 22px; color: var(--accent); cursor: pointer; display: block; line-height: 1; }
    .topbar-title { font-size: 17px; font-weight: 700; color: var(--accent-strong); }
    .topbar-sub { font-size: 12px; color: var(--text-faint); }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 12px; background: var(--card); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px;
      transition: background 0.15s, transform 0.1s; position: relative;
    }
    .icon-btn:hover { background: var(--accent-tint); }
    .icon-btn:active { transform: scale(0.94); }
    .icon-btn .dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: #ef5350; border: 1.5px solid var(--bg2); }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; background: var(--accent-tint); border: 2px solid var(--accent-soft);
      background-size: cover; background-position: center; cursor: pointer; flex-shrink: 0;
    }
    .view { flex: 1; overflow-y: auto; position: relative; z-index: 1; padding: 22px 24px calc(100px + env(safe-area-inset-bottom)); }
    /* AI Chat：整个页面就是聊天，无外边距、无内边距、铺满动态视口 */
    .view.view-chat { padding: 0; overflow: hidden; }
    .view-inner { max-width: 1080px; margin: 0 auto; animation: viewIn 0.22s ease; }
    @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* ============ FAB ============ */
    .fab {
      position: fixed; right: 22px; bottom: calc(24px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%;
      background: var(--accent); color: #fff; font-size: 28px; border: none; cursor: pointer;
      box-shadow: 0 8px 24px rgba(60,90,130,0.4); z-index: 60; display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, background 0.2s; line-height: 1;
    }
    .fab:hover { background: var(--accent-strong); transform: translateY(-2px); }
    .fab:active { transform: scale(0.92); }

    /* ============ Cards / common ============ */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); backdrop-filter: blur(6px); }
    .card-pad { padding: 18px 20px; }
    .section-head { display: flex; align-items: baseline; gap: 8px; margin: 26px 0 12px; }
    .section-head h2 { font-size: 16px; font-weight: 700; color: var(--text); }
    .section-head .hint { font-size: 12px; color: var(--text-faint); }
    .section-head .more { margin-left: auto; font-size: 12px; color: var(--accent); cursor: pointer; background: none; border: none; }
    .grid { display: grid; gap: 14px; }
    .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .muted { color: var(--text-faint); font-size: 12px; }
    .h2 { font-size: 22px; font-weight: 700; color: var(--text); }
    .h1 { font-size: 26px; font-weight: 700; color: var(--text); letter-spacing: 0.5px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .spread { display: flex; align-items: center; justify-content: space-between; }
    .grow { flex: 1; min-width: 0; }

    /* buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 16px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer;
      background: var(--card-solid); color: var(--text); font-size: 13.5px; transition: all 0.15s; white-space: nowrap;
    }
    .btn:hover { background: var(--accent-tint); border-color: var(--accent-border); }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
    .btn-soft { background: var(--accent-tint); border-color: transparent; color: var(--accent-strong); }
    .btn-danger { background: #fbeaea; border-color: #f3cdcd; color: #c0392b; }
    .btn-danger:hover { background: #f6d8d8; }
    .btn-sm { padding: 6px 11px; font-size: 12.5px; border-radius: 10px; }
    .btn-block { width: 100%; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* inputs */
    .input, .textarea, .select {
      width: 100%; padding: 10px 13px; border: 1px solid var(--border); border-radius: 12px;
      background: var(--card-solid); font-size: 14px; color: var(--text); outline: none; transition: border 0.15s;
    }
    .input:focus, .textarea:focus, .select:focus { border-color: var(--accent-border); }
    .textarea { resize: vertical; min-height: 60px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12.5px; color: var(--text-soft); margin-bottom: 5px; font-weight: 600; }
    .field .row.gap2 { gap: 8px; }
    .search-box { position: relative; }
    .search-box input { padding-left: 38px; }
    .search-box .sico { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-faint); font-size: 15px; }

    /* progress */
    .progress { height: 7px; background: var(--accent-tint); border-radius: 10px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: var(--accent); border-radius: 10px; transition: width 0.4s ease; }
    .ring { transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 8; }
    .ring .bg { stroke: var(--accent-tint); }
    .ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }

    /* chips / tags */
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; background: var(--accent-tint); color: var(--accent-strong); border: 1px solid var(--accent-line); }
    .tag { display: inline-flex; align-items: center; gap: 3px; padding: 1px 8px; border-radius: 8px; font-size: 11px; background: var(--accent-tint); color: var(--accent-strong); margin: 1px; }

    /* checkbox */
    .chk { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--accent-border); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; background: var(--card-solid); }
    .chk:hover { border-color: var(--accent); }
    .chk.on { background: var(--accent); border-color: var(--accent); }
    .chk.on::after { content: '✓'; color: #fff; font-size: 12px; font-weight: 700; }
    .chk.sm { width: 17px; height: 17px; border-width: 1.5px; }
    .chk.sm::after { font-size: 10px; }

    /* task row */
    .task-row { display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 14px; cursor: pointer; transition: background 0.15s; border: 1px solid transparent; }
    .task-row:hover { background: var(--accent-tint); border-color: var(--accent-line); }
    .task-row .t-title { flex: 1; font-size: 14px; color: var(--text); word-break: break-word; transition: opacity 0.2s; }
    .task-row.done .t-title { text-decoration: line-through; opacity: 0.45; }
    .task-row .t-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
    .prio { width: 4px; height: 18px; border-radius: 4px; flex-shrink: 0; }
    .prio.high { background: #ef5350; } .prio.med { background: #f59e0b; } .prio.low { background: #38bdf8; } .prio.none { background: transparent; }
    .drag-hint { opacity: 0.5; cursor: grab; font-size: 13px; }

    /* empty */
    .empty { text-align: center; padding: 46px 20px; color: var(--text-faint); }
    .empty .eico { font-size: 44px; margin-bottom: 10px; opacity: 0.6; }
    .empty .etitle { font-size: 15px; color: var(--text-soft); font-weight: 600; margin-bottom: 4px; }
    .empty .esub { font-size: 12.5px; }

    /* ============ Modal / drawer / toast / menu ============ */
    .overlay { position: fixed; inset: 0; background: rgba(12,20,30,0.42); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 18px; animation: fadeIn 0.18s ease; backdrop-filter: blur(3px); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal { background: var(--card-solid); border-radius: var(--radius-lg); width: 100%; max-width: 460px; max-height: 86vh; overflow-y: auto; box-shadow: var(--shadow-md); animation: popIn 0.2s ease; border: 1px solid var(--border); }
    @keyframes popIn { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: none; } }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 12px; }
    .modal-head h3 { font-size: 16px; color: var(--text); }
    .modal-head .x { background: none; border: none; font-size: 22px; color: var(--text-faint); cursor: pointer; }
    .modal-body { padding: 4px 20px 20px; }
    .modal-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 4px 20px 20px; }
    .drawer { position: fixed; z-index: 210; background: var(--card-solid); box-shadow: var(--shadow-md); animation: slideUp 0.25s ease; }
    .drawer.bottom { left: 0; right: 0; bottom: 0; max-height: 82vh; border-radius: 24px 24px 0 0; overflow-y: auto; }
    .drawer.right { top: 0; right: 0; bottom: 0; width: 100%; max-width: 400px; border-radius: 20px 0 0 20px; overflow-y: auto; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
    @keyframes slideRight { from { transform: translateX(100%); } to { transform: none; } }
    .drawer.right { animation-name: slideRight; }
    .sheet { background: var(--card-solid); border-radius: 24px 24px 0 0; width: 100%; max-width: 460px; padding: 12px 14px 24px; animation: slideUp 0.25s ease; box-shadow: var(--shadow-md); }
    .sheet-item { display: flex; align-items: center; gap: 14px; padding: 15px 12px; border-radius: 14px; cursor: pointer; font-size: 15px; color: var(--text); border: none; background: none; width: 100%; text-align: left; }
    .sheet-item:hover { background: var(--accent-tint); }
    .sheet-item .ico { width: 26px; text-align: center; font-size: 19px; }
    .sheet-grab { width: 40px; height: 4px; border-radius: 4px; background: var(--border-strong); margin: 4px auto 10px; }
    .sheet-head { margin-bottom: 12px; }
    #toastRoot { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 500; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
    .toast { background: var(--card-solid); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 14px; font-size: 13.5px; box-shadow: var(--shadow-md); animation: toastIn 0.25s ease; display: flex; align-items: center; gap: 8px; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
    .toast.out { opacity: 0; transform: translateY(-8px); transition: 0.25s; }
    #menuRoot { position: fixed; z-index: 400; }
    .menu { background: var(--card-solid); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-md); padding: 5px; min-width: 150px; animation: popIn 0.14s ease; }
    .menu button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 9px 12px; border: none; background: none; border-radius: 10px; font-size: 13.5px; color: var(--text); cursor: pointer; }
    .menu button:hover { background: var(--accent-tint); }
    .menu button.danger { color: #c0392b; }
    .menu button.danger:hover { background: #fbeaea; }
    .menu-header { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted, #94a3b8); padding: 8px 12px 4px; }

    /* color swatches */
    .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
    .sw { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.12s; }
    .sw:hover { transform: scale(1.12); }
    .sw.sel { border-color: var(--text); box-shadow: 0 0 0 3px var(--accent-tint); }
    .sw-custom { width: 30px; height: 30px; border-radius: 50%; border: 2px dashed var(--border-strong); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 15px; position: relative; overflow: hidden; }
    .sw-custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    /* ============ Calendar ============ */
    .cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .cal-title { font-size: 20px; font-weight: 700; color: var(--text); }
    .cal-nav { display: flex; gap: 6px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-dow { text-align: center; font-size: 11px; color: var(--text-faint); font-weight: 700; padding: 6px 0; letter-spacing: 0.5px; }
    .cal-cell { min-height: 88px; border: 1px solid var(--border); border-radius: 14px; padding: 6px; cursor: pointer; transition: all 0.15s; background: var(--card); position: relative; overflow: hidden; }
    .cal-cell:hover { border-color: var(--accent-border); }
    .cal-cell.other { opacity: 0.35; }
    .cal-cell.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .cal-cell .dnum { font-size: 13px; font-weight: 700; color: var(--text-soft); margin-bottom: 4px; }
    .cal-cell.today .dnum { color: var(--accent); }
    .cal-dot { font-size: 10.5px; line-height: 1.5; padding: 1px 5px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 1px; }
    .cal-more { font-size: 10px; color: var(--text-faint); }
    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .week-col { border: 1px solid var(--border); border-radius: 14px; min-height: 180px; padding: 8px; background: var(--card); }
    .week-col.today { border-color: var(--accent); }
    .week-col-head { font-size: 12px; font-weight: 700; color: var(--text-soft); text-align: center; margin-bottom: 6px; }
    .week-col.today .week-col-head { color: var(--accent); }
    .week-col .dnum { text-align: center; font-size: 11px; color: var(--text-faint); margin-bottom: 6px; }

    /* ============ Habit / Health / Stat ============ */
    .habit-card { display: flex; align-items: center; gap: 12px; padding: 15px; }

    .stat-card { padding: 16px; }

    .stat-card .u { font-size: 13px; color: var(--text-faint); }
    .stat-card .l { font-size: 12px; color: var(--text-soft); margin-bottom: 4px; }
    .chart-wrap { padding: 12px; }
    .seg { display: inline-flex; background: var(--accent-tint); border-radius: 12px; padding: 3px; gap: 2px; }
    .seg button { border: none; background: none; padding: 6px 13px; border-radius: 9px; font-size: 12.5px; color: var(--text-soft); cursor: pointer; }
    .seg button.on { background: var(--card-solid); color: var(--accent-strong); font-weight: 600; box-shadow: var(--shadow); }

    /* ============ Messages / Chat ============ */
    .conv-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; cursor: pointer; transition: background 0.15s; }

    .unread { min-width: 18px; height: 18px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
    .bubble { max-width: 86%; padding: 11px 15px; border-radius: 18px; font-size: 14px; line-height: 1.6; word-break: break-word; }
    .bubble.in { background: var(--card-solid); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
    .bubble.out { background: var(--accent); color: #fff; border-bottom-right-radius: 6px; align-self: flex-end; }
    /* 气泡透明度只淡化背景、不影响文字（需求 8）：--bubble-alpha 仅作用于背景色 */
    @supports (background: color-mix(in srgb, red 50%, transparent)) {
      .bubble.in { background: color-mix(in srgb, var(--card-solid) calc(var(--bubble-alpha, 1) * 100%), transparent); }

    .chat-input-bar { display: flex; gap: 8px; align-items: flex-end; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
    .chat-input { flex: 1; min-width: 0; resize: none; border: 1px solid var(--border); border-radius: 22px; padding: 10px 16px; font-size: 14px; outline: none; max-height: 110px; min-height: 42px; background: var(--card-solid); }
    .chat-input:focus { border-color: var(--accent-border); }

    /* 聊天气泡操作：小图标、淡色、默认隐藏，hover / 长按 / 点击出现 */
    .chat-msg-row { position: relative; }
    .chat-actions { display: flex; gap: 2px; margin-top: 4px; opacity: 0; transition: opacity 0.15s; }
    .chat-msg-row:hover .chat-actions, .chat-msg-row:active .chat-actions { opacity: 1; }
    .chat-actions .mini-act { border: none; background: none; color: var(--text-faint); font-size: 11px; padding: 2px 7px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; }
    .chat-actions .mini-act:hover { color: var(--accent-strong); background: var(--accent-tint); }
    .mini-act { border: none; background: none; color: var(--text-faint); font-size: 11px; padding: 2px 7px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0; }
    .mini-act:hover { color: var(--accent-strong); background: var(--accent-tint); }

    /* 引用 AI 动态（进入对话时显示在输入框上方） */
    .quote-card { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; margin: 0 14px 8px; border: 1px solid var(--accent-line); border-left: 3px solid #f472b6; border-radius: 12px; background: var(--accent-tint); font-size: 12.5px; color: var(--text-soft); }

    /* 聊天背景（用户可设默认 / 纯色 / 图片） */
    .chat-stage { position: relative; flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .note-body { font-size: 13px; color: var(--text-soft); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }

    /* splash */
    .splash { position: fixed; inset: 0; background: var(--bg2); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: opacity 0.6s ease; }
    .splash.fade-out { opacity: 0; pointer-events: none; }
    .splash-title { font-size: 40px; font-weight: 700; letter-spacing: 8px; color: var(--accent); opacity: 0; animation: welcomeIn 1s ease forwards; }
    .splash-sub { margin-top: 8px; font-size: 14px; color: var(--accent-strong); opacity: 0; animation: welcomeIn 1s ease 0.4s forwards; }
    @keyframes welcomeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* markdown in bubbles */
    .md h1,.md h2,.md h3,.md h4,.md h5,.md h6 { margin: 8px 0 4px; font-weight: 600; line-height: 1.3; }
    .md h1 { font-size: 18px; } .md h2 { font-size: 17px; } .md h3 { font-size: 16px; } .md h4,.md h5,.md h6 { font-size: 15px; }
    .md code { background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
    html[data-theme="dark"] .md code { background: rgba(255,255,255,0.1); }
    .md pre { background: rgba(0,0,0,0.05); padding: 10px 12px; border-radius: 10px; overflow-x: auto; margin: 6px 0; white-space: pre-wrap; }
    html[data-theme="dark"] .md pre { background: rgba(255,255,255,0.06); }
    .md pre code { background: none; padding: 0; }
    .md ul,.md ol { margin: 4px 0; padding-left: 20px; }
    .md blockquote { border-left: 3px solid var(--accent-border); padding-left: 10px; margin: 6px 0; color: var(--text-soft); }
    .md a { color: var(--accent-strong); text-decoration: underline; }
    .md hr { border: none; border-top: 1px solid var(--accent-line); margin: 8px 0; }

    /* ============ 我的AI (Companion) ============ */
    .ai-heart { display: inline-flex; align-items: center; justify-content: center; color: #f472b6; font-size: 26px; animation: aiBreath 3.2s ease-in-out infinite; transform-origin: center; }
    @keyframes aiBreath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    .ai-heart.thinking { animation: aiPulse 1s ease-in-out infinite; }
    @keyframes aiPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
    .ai-heart.responding { filter: drop-shadow(0 0 8px rgba(244,114,182,0.7)); }
    .ai-companion { background: linear-gradient(135deg, var(--accent-tint), #fdf2f8); border: 1px solid var(--accent-line); }
    html[data-theme="dark"] .ai-companion { background: linear-gradient(135deg, #1c2733, #241d28); }
    .ai-companion .status { font-size: 13.5px; color: var(--text-soft); line-height: 1.6; }
    .ai-state-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: #fdf2f8; color: #db2777; border: 1px solid #f9d8e6; font-size: 12.5px; white-space: nowrap; }
    html[data-theme="dark"] .ai-state-pill { background: #2a1f2a; border-color: #5b3a52; color: #f9a8d4; }
    .ai-mem-item, .ai-act-item, .ai-state-item { padding: 14px 16px; border: 1px solid var(--border); border-radius: 14px; margin-bottom: 10px; background: var(--card); }
    .ai-state-item .emotion { font-size: 15px; font-weight: 700; }
    .intensity-dots { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
    .intensity-dots i { width: 6px; height: 6px; border-radius: 50%; background: #f472b6; opacity: .25; }
    .intensity-dots i.on { opacity: 1; }
    .shop-item { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-bottom: 1px solid var(--border); }
    .shop-item:last-child { border-bottom: none; }
    .shop-cat { font-size: 10.5px; padding: 1px 7px; border-radius: 8px; background: var(--accent-tint); color: var(--accent-strong); }
    .together-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; background: #fdf2f8; color: #db2777; border: 1px solid #f9d8e6; font-size: 12px; }
    html[data-theme="dark"] .together-badge { background: #2a1f2a; color: #f9a8d4; border-color: #5b3a52; }
    .ai-notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--accent-tint); border: 1px solid var(--accent-line); margin-bottom: 10px; }
    .ai-notice .body { flex: 1; }
    .ai-notice .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .ai-nav-group { border-left: 3px solid #f472b6; margin: 8px 0 4px; }
    .ai-nav-group .ai-nav-title { display: flex; align-items: center; gap: 6px; color: #db2777; font-size: 11px; letter-spacing: 1px; font-weight: 700; padding: 4px 12px 2px; }
    html[data-theme="dark"] .ai-nav-group .ai-nav-title { color: #f9a8d4; }

    /* ============ 我的日志 (Journal) ============ */
    .journal { max-width: 720px; }
    .journal-hero { text-align: center; padding: 10px 0 22px; }
    .journal-hero .j-sub { font-size: 13px; color: var(--text-faint); margin-top: 6px; letter-spacing: 1px; }
    .journal-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .journal-toolbar .seg { flex-shrink: 0; }
    .journal-mood-box { width: 64px; height: 64px; border-radius: 18px; border: 2px dashed var(--border-strong); background: var(--accent-bg); display: flex; align-items: center; justify-content: center; overflow: hidden; transition: border-color 0.15s, box-shadow 0.15s; }
    .journal-mood-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
    .journal-mood-box input { width: 100%; height: 100%; background: transparent; border: none; text-align: center; font-size: 28px; outline: none; color: var(--text); padding: 0; }
    .journal-mood-box input::placeholder { font-size: 20px; color: var(--text-faint); }
    .journal-date-head { display: flex; align-items: center; gap: 12px; margin: 22px 0 12px; }
    .journal-date-head .j-day { font-size: 16px; font-weight: 700; color: var(--text); flex-shrink: 0; }
    .journal-date-head .j-sub { font-size: 12px; color: var(--text-faint); flex-shrink: 0; }
    .journal-date-head .j-line { flex: 1; height: 1px; background: var(--accent-line); }
    .journal-entry { padding: 16px 18px; border: 1px solid var(--border); border-radius: 16px; background: var(--card); margin-bottom: 12px; }

    .journal-entry .j-mood { font-size: 12.5px; color: var(--text-soft); margin-top: 9px; }
    .journal-entry .j-tags { margin-top: 9px; display: flex; gap: 4px; flex-wrap: wrap; }
    .journal-entry .j-actions { display: flex; gap: 4px; margin-left: auto; }

    /* responsive */
    @media (max-width: 900px) {
      .fab { bottom: calc(24px + env(safe-area-inset-bottom)); }
      .grid.cols-3, .grid.cols-4 { grid-template-columns: repeat(2, 1fr); }

      .album { width: 170px; height: 170px; }
    }
  </style>

  <script>
"use strict";
/* =========================================================================
   Bunny's Home — Personal AI Life OS  (single-file, vanilla JS)
   Hash router + localStorage persistence + optional backend for AI chat.
   ========================================================================= */
// 后端地址自适应：同源部署（Render / 本地调试）走相对路径；否则（如 Vercel 托管前端）走绝对地址。
// 修复：曾固定为绝对地址，后改成 '' 导致 Vercel 上请求同源 /api/* 返回 HTML，登录/同步全部失效。
const API_BASE = (() => {
  const h = location.hostname;
  if (h === 'localhost' || h === '127.0.0.1' || h.endsWith('.onrender.com')) return '';
  return 'https://bunny-backend-bv89.onrender.com';
})();
const LS_KEY = 'bunny_os_v1';

/* ---------------- utils ---------------- */
function uid() { return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8)); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayStr() { return dstr(new Date()); }
function parseDate(s) { const p = String(s || '').split('-').map(Number); if (p.length !== 3 || p.some(isNaN)) return null; return new Date(p[0], p[1] - 1, p[2]); }
function addDays(s, n) { const d = parseDate(s) || new Date(); d.setDate(d.getDate() + n); return dstr(d); }
function monthTitle(y, m) { return y + '年' + (m + 1) + '月'; }
function ymd(s) { const p = String(s || '').split('-'); return p[0] + '.' + p[1] + '.' + p[2]; }
function startOfWeek(s) { const d = parseDate(s) || new Date(); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return dstr(d); }
function weekTitle(s) { const w = startOfWeek(s); return ymd(w) + ' — ' + ymd(addDays(w, 6)); }
function fmtDateHuman(s) { const d = parseDate(s); if (!d) return ''; const t = new Date(); if (dstr(d) === dstr(t)) return '今天'; if (dstr(d) === addDays(dstr(t), 1)) return '明天'; if (dstr(d) === addDays(dstr(t), -1)) return '昨天'; return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
function relTime(ts) { if (!ts) return ''; const d = Date.now() - ts; const m = Math.floor(d / 60000); if (m < 1) return '刚刚'; if (m < 60) return m + '分钟前'; const h = Math.floor(m / 60); if (h < 24) return h + '小时前'; const dd = Math.floor(h / 24); if (dd < 30) return dd + '天前'; return new Date(ts).toLocaleDateString(); }
function greeting() { const h = new Date().getHours(); if (h < 5) return '夜深了'; if (h < 12) return '早上好'; if (h < 14) return '中午好'; if (h < 18) return '下午好'; return '晚上好'; }
function todayLong() { const d = new Date(); const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday']; const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']; return days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }

function hexToHsl(hex) {
  let r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;

  const e = esc(text); const lines = e.split('\n'); let html = '', listTag = null, inCode = false, codeBuf = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^\s*```/.test(line)) { if (inCode) { html += '<pre><code>' + codeBuf.join('\n') + '</code></pre>'; codeBuf = []; inCode = false; } else { if (listTag) { html += '</' + listTag + '>'; listTag = null; } inCode = true; } continue; }
    if (inCode) { codeBuf.push(line); continue; }
    const trimmed = line.trim();
    if (trimmed === '') { if (listTag) { html += '</' + listTag + '>'; listTag = null; } continue; }
    const h = trimmed.match(/^(#{1,6})\s+(.*)$/);
    if (h) { if (listTag) { html += '</' + listTag + '>'; listTag = null; } html += '<h' + h[1].length + '>' + inlineMd(h[2]) + '</h' + h[1].length + '>'; continue; }
    if (/^\s*(---|\*\*\*|___)\s*$/.test(trimmed)) { if (listTag) { html += '</' + listTag + '>'; listTag = null; } html += '<hr>'; continue; }

  }
  if (inCode) html += '<pre><code>' + codeBuf.join('\n') + '</code></pre>';
  if (listTag) html += '</' + listTag + '>';

}

/* ---------------- 后端同步：local-first + 写穿 /api/state ----------------
   核心数据（计划/任务/习惯/健康/…）持久化到后端 PostgreSQL；
   localStorage 只作工作缓存/离线草稿。后端不可达时静默降级到本地。 */
let _syncTimer = null;

const SYNC = {
  async push() {
    try {
      await fetch(API_BASE + '/api/state', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...DB, _serverSeeded: true }) });
    } catch (e) { /* 后端不可达：静默，仍走本地 */ }
  },
  async bootstrap() {
    try {
      const r = await fetch(API_BASE + '/api/state');
      if (!r.ok) return;
      const j = await r.json();
      const remote = j && j.data;
      if (!remote || typeof remote !== 'object') return;
      if (remote._serverSeeded) {
        delete remote._serverSeeded;
        for (const k of Object.keys(remote)) DB[k] = remote[k];
        DB._serverSeeded = true;
        try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) {}
        render(); // 刷新 UI 显示服务端数据
      } else {
        SYNC.push(); // 首次：上传本地数据播种服务端
      }
    } catch (e) { /* 忽略 */ }
  },
};

/* ---- iOS 左边缘横滑：右滑切换 Sidebar（关→开，开→关），左滑关闭；阻止浏览器返回、不产生历史记录 ---- */
let _edgeStart = null;
function bindEdgeSwipe() {
  const EDGE = 26, TRIGGER = 56;
  document.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { _edgeStart = null; return; }
    const t = e.touches[0];
    _edgeStart = (t.clientX <= EDGE) ? { x: t.clientX, y: t.clientY } : null;
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (!_edgeStart) return;
    const t = e.touches[0]; const dx = t.clientX - _edgeStart.x, dy = t.clientY - _edgeStart.y;
    // 明确是「左边缘横向滑」时阻止原生返回手势（无论方向），保证侧栏手势优先于浏览器返回
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.4 && e.cancelable) e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', (e) => {
    if (!_edgeStart) return;
    const t = e.changedTouches[0]; const dx = t.clientX - _edgeStart.x, dy = t.clientY - _edgeStart.y;
    _edgeStart = null;
    if (Math.abs(dx) <= Math.abs(dy) * 1.4) return;
    if (dx > TRIGGER) OS.toggleSidebar();        // 右滑：关→开，开→关（右滑返回关闭 Sidebar）
    else if (dx < -TRIGGER) OS.toggleSidebar(false); // 左滑：关闭
  });
}

function parseHash() {
  let h = location.hash.replace(/^#/, '');
  if (!h || h === '/') h = '/today';
  if (h.startsWith('/settings/')) { const seg = h.split('/')[2]; h = seg ? '/settings/' + seg : '/settings'; }
  if (!ROUTES[h] && h.startsWith('/plans/')) h = '/plans';
  if (!ROUTES[h]) h = '/today';
  return h;
}

const PRIO = { high: { label: '高', color: '#ef5350' }, med: { label: '中', color: '#f59e0b' }, low: { label: '低', color: '#38bdf8' }, none: { label: '', color: 'transparent' } };
function tasksOn(date) { return DB.tasks.filter((t) => t.date === date).sort((a, b) => (a.completed - b.completed) || ((a.order || 0) - (b.order || 0))); }
function taskById(id) { return DB.tasks.find((t) => t.id === id); }
function planById(id) { return DB.plans.find((p) => p.id === id); }
function activePlans(type) { return DB.plans.filter((p) => p.type === type && !p.archived); }
function taskPlanChain(task) {
  const chain = [];
  const wp = planById(task.weeklyPlanId); if (wp) chain.push({ label: '周', title: wp.title, type: 'weekly' });
  const mp = planById(task.monthlyPlanId); if (mp) chain.push({ label: '月', title: mp.title, type: 'monthly' });
  const sp = planById(task.stagePlanId); if (sp) chain.push({ label: '阶段', title: sp.title, type: 'stage' });
  const lp = planById(task.longTermPlanId); if (lp) chain.push({ label: '长期', title: lp.title, type: 'long-term' });
  return chain;
}

function taskRowHtml(t, opts) {
  const p = PRIO[t.priority] || PRIO.none;
  const tags = (t.tags || []).map((x) => '<span class="tag">' + esc(x) + '</span>').join('');
  const time = t.time ? '<span class="chip">🕒 ' + esc(t.time) + '</span>' : '';
  const chain = taskPlanChain(t).map((c) => '<span class="chip" title="' + esc(c.label + '：' + c.title) + '">' + c.label + '</span>').join('');
  const note = t.note ? ' <span title="' + esc(t.note) + '">📝</span>' : '';
  // 整行：点击/长按/右键均进入编辑（复用 openTaskModal，不新建）；复选框=完成切换，⋯=菜单
  return '<div class="task-row' + (t.completed ? ' done' : '') + '" draggable="true" ondragstart="taskDragStart(event,\'' + t.id + '\')" ondragover="event.preventDefault()" ondrop="taskDropOn(event,\'' + t.id + '\')" onclick="taskRowClick(event,\'' + t.id + '\')" oncontextmenu="event.preventDefault();openTaskModal(null,\'' + t.id + '\')" ontouchstart="taskPressStart(event,\'' + t.id + '\')" ontouchmove="taskPressMove()" ontouchend="taskPressEnd()" ontouchcancel="taskPressEnd()">' +
    '<span class="chk' + (t.completed ? ' on' : '') + '" onclick="event.stopPropagation();toggleTask(\'' + t.id + '\')"></span>' +
    '<span class="prio ' + (t.priority || 'none') + '" style="background:' + p.color + '"></span>' +
    '<div class="grow"><div class="t-title">' + esc(t.title) + note + '</div><div class="t-meta">' + time + tags + chain + '</div></div>' +
    '<span class="drag-hint" title="拖动排序">⠿</span>' +

function toggleTask(id) {

function deleteTask(id) {

  ];

function taskDragStart(e, id) { e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; }
function taskDropOn(e, targetId) {
  e.preventDefault(); e.stopPropagation();
  const srcId = e.dataTransfer.getData('text/plain');
  if (!srcId || srcId === targetId) return;
  const src = taskById(srcId), dst = taskById(targetId);
  if (!src || !dst || src.date !== dst.date) return;
  const srcOrder = src.order || 0; src.order = dst.order || 0; dst.order = srcOrder;
  saveDB(); render();
}
function taskDropToDate(e, date) {
  e.preventDefault();
  const id = e.dataTransfer.getData('text/plain');
  const t = taskById(id); if (!t) return;
  t.date = date; saveDB(); render(); toast('已移动到 ' + fmtDateHuman(date));
}

function saveTaskModal(id) {
  const title = document.getElementById('tkTitle').value.trim();
  if (!title) { toast('请输入任务名称', true); return; }
  const date = document.getElementById('tkDate').value || todayStr();
  const time = document.getElementById('tkTime').value;
  const priority = document.getElementById('tkPrio').value;
  const tags = document.getElementById('tkTags').value.split(/[,，]/).map((s) => s.trim()).filter(Boolean);
  const note = document.getElementById('tkNote').value.trim();
  const planId = document.getElementById('tkPlan').value || null;
  const lp = planId ? planById(planId) : null;
  const chain = lp ? planChain(lp) : { longTermPlanId: null, stagePlanId: null, monthlyPlanId: null, weeklyPlanId: null };
  if (id) {
    const t = taskById(id);
    Object.assign(t, { title, date, time, priority, tags, note, planId, ...chain });
  } else {
    const t = { id: uid(), title, date, time, completed: false, priority, note, tags, planId, weeklyPlanId: null, monthlyPlanId: null, stagePlanId: null, longTermPlanId: null, order: Date.now(), createdAt: Date.now(), ...chain };
    DB.tasks.push(t);
  }
  saveDB(); closeModal(); render(); toast('已保存 ✓');
  const savedId = id || DB.tasks[DB.tasks.length - 1].id;
  AIBus.emit({ type: id ? 'TASK_UPDATED' : 'TASK_CREATED', entityType: 'task', entityId: savedId, payload: taskById(savedId) });
  if (time && !id) AIBus.emit({ type: 'CALENDAR_EVENT_CREATED', entityType: 'calendarEvent', entityId: savedId, payload: taskById(savedId) });
}

function planChain(plan) {
  const chain = { longTermPlanId: null, stagePlanId: null, monthlyPlanId: null, weeklyPlanId: null };
  let cur = plan;
  while (cur) {
    if (cur.type === 'long-term') chain.longTermPlanId = cur.id;
    else if (cur.type === 'stage') chain.stagePlanId = cur.id;
    else if (cur.type === 'monthly') chain.monthlyPlanId = cur.id;
    else if (cur.type === 'weekly') chain.weeklyPlanId = cur.id;
    cur = planById(cur.parentPlanId);
  }
  return chain;
}
function planProgress(plan) {
  const goals = plan.stageGoals || [];
  if (goals.length === 0) {
    const range = plan.type === 'monthly' || plan.type === 'weekly' ? [] : [];
    // for monthly/weekly, progress from linked tasks
    if (plan.type === 'monthly') { const t = DB.tasks.filter((x) => x.monthlyPlanId === plan.id); return t.length ? Math.round(t.filter((x) => x.completed).length / t.length * 100) : 0; }
    if (plan.type === 'weekly') { const t = DB.tasks.filter((x) => x.weeklyPlanId === plan.id); return t.length ? Math.round(t.filter((x) => x.completed).length / t.length * 100) : 0; }
    return 0;
  }
  return Math.round(goals.reduce((s, g) => s + (g.progress || 0), 0) / goals.length);
}

function shiftPlanWeek(id, n) { const p = planById(id); const ws = addDays(p.startDate || startOfWeek(todayStr()), n * 7); p.startDate = ws; p.endDate = addDays(ws, 6); p.title = weekTitle(ws); p.updatedAt = Date.now(); saveDB(); render(); }
function taskDropToPlan(e, planId, date, field) {

/* ================= HABIT ================= */
const FREQ = { daily: '每天', weekdays: '工作日', weekly: '每周', custom: '自定义' };
function habitById(id) { return DB.habits.find((h) => h.id === id); }
function isHabitDone(h, date) { return (h.completions || []).includes(date); }
function habitStreak(h) {
  const set = new Set(h.completions || []);
  let streak = 0, d = todayStr();
  if (!set.has(d)) d = addDays(d, -1);
  while (set.has(d)) { streak++; d = addDays(d, -1); }
  return streak;
}
// 累计完成次数：只统计「已跨 0 点」的日期（严格早于今天），今天的打卡由今日状态/连续天数体现。
function habitTotalCompletions(h) {
  const today = todayStr();
  return new Set((h.completions || []).filter((d) => d && d < today)).size;
}
function toggleHabit(id, date) {
  const h = habitById(id); if (!h) return;
  if (!Array.isArray(h.completions)) h.completions = [];
  // 幂等：同一天重复点击/刷新/重进都不再累加，也不删除已有记录
  if (h.completions.includes(date)) { toast('今日已打卡 ✓'); return; }
  h.completions.push(date);
  h.streak = habitStreak(h);
  saveDB(); render();
  toast('已打卡 🔥 ' + habitStreak(h) + ' 天');
  AIBus.emit({ type: 'HABIT_COMPLETED', entityType: 'habit', entityId: id, payload: h });
}
function habitRowHtml(h, date) {
  const done = isHabitDone(h, date);

  return '<div class="task-row" onclick="toggleHabit(\'' + h.id + '\',\'' + date + '\')">' +
    '<span class="habit-ico" style="width:36px;height:36px;font-size:18px;background:' + hexToRgba(h.color, 0.15) + '">' + esc(h.icon) + '</span>' +
    '<div class="grow"><div class="t-title' + (done ? ' done' : '') + '">' + esc(h.name) + '</div><div class="t-meta"><span class="chip" style="font-size:10.5px">' + (FREQ[h.frequency] || h.frequency) + (h.goal ? ' · ' + h.goal : '') + '</span>' + (h.reminderTime ? '<span class="chip" style="font-size:10.5px">⏰ ' + esc(h.reminderTime) + '</span>' : '') + (h.description ? '<span class="muted" style="font-size:11px"> · ' + esc(h.description) + '</span>' : '') + '</div></div>' +
    '<span class="habit-streak">' + total + ' 次 · 🔥 ' + habitStreak(h) + ' 天</span>' +
    '<span class="chk' + (done ? ' on' : '') + '" onclick="event.stopPropagation();toggleHabit(\'' + h.id + '\',\'' + date + '\')"></span>' +
    '<button class="icon-btn" style="border:none;background:none" onclick="event.stopPropagation();habitMenu(event,\'' + h.id + '\')">⋯</button></div>';
}
function habitMenu(e, id) {

/* ================= HEALTH ================= */
function healthToday() { return DB.health.find((x) => x.date === todayStr()); }
function healthRecord(date) {
  let rec = DB.health.find((x) => x.date === date);
  if (!rec) { rec = { id: uid(), date, sleep: 0, water: 0, caloriesIn: 0, caloriesOut: 0, weight: null }; DB.health.push(rec); }
  return rec;
}
function healthRange(n) { const out = []; for (let i = n - 1; i >= 0; i--) { const ds = addDays(todayStr(), -i); out.push(DB.health.find((x) => x.date === ds) || { date: ds, sleep: 0, water: 0, caloriesIn: 0, caloriesOut: 0, weight: null }); } return out; }
function parseSleep(s) {
  const t = String(s || '').trim(); if (!t) return null;
  let hours = 0, hit = false;
  const hm = t.match(/(\d+(?:\.\d+)?)\s*h/i); if (hm) { hours += +hm[1]; hit = true; }
  const mm = t.match(/(\d+)\s*m/i); if (mm) { hours += +mm[1] / 60; hit = true; }
  if (hit) return Math.round(hours * 100) / 100;
  const n = Number(t); return Number.isFinite(n) ? n : null;
}
function fmtSleep(h) { const v = Number(h) || 0; if (!v) return '—'; const hh = Math.floor(v); const mm = Math.round((v - hh) * 60); return hh + 'h' + (mm ? ' ' + mm + 'm' : ''); }
function fmtVal(v, unit) { const n = Number(v); return n ? n.toLocaleString() + unit : '—'; }
function viewHealth() {
  const t = healthToday() || { sleep: 0, water: 0, caloriesIn: 0, caloriesOut: 0, weight: null };
  const hp = DB.healthProfile || {};
  const r = OS.ui.healthRange;
  let html = '<div class="spread" style="margin-bottom:16px"><div><div class="h1">Health</div><div class="muted">今日健康数据</div></div></div>';
  // 身高 + 体重：两个小输入框并排（50% each），紧凑（需求 12）

function lineChartSVG(points, color, maxVal) {
  const vals = (points || []).map((v) => Number(v)).filter((v) => Number.isFinite(v));
  if (vals.length === 0) return '<div class="muted" style="text-align:center;padding:20px">暂无足够数据</div>';
  const w = 260, h = 80, padX = 6, padY = 8;
  const max = maxVal || Math.max(...vals, 1);
  const min = Math.min(...vals);
  const range = (max - min) || 1;
  const step = (w - padX * 2) / (vals.length - 1 || 1);
  const coords = vals.map((v, i) => [padX + i * step, h - padY - ((v - min) / range) * (h - padY * 2)]);
  let path = coords.map((c, i) => (i ? 'L' : 'M') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const area = path + ' L' + (w - padX) + ',' + (h - padY) + ' L' + padX + ',' + (h - padY) + ' Z';
  const dots = coords.map((c) => '<circle cx="' + c[0].toFixed(1) + '" cy="' + c[1].toFixed(1) + '" r="2.5" fill="' + color + '"/>').join('');
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto"><defs><linearGradient id="g' + color.slice(1) + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + color + '" stop-opacity="0.35"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs><path d="' + area + '" fill="url(#g' + color.slice(1) + ')"/><path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' + dots + '</svg>';
}

function playerSeek(e) {

  saveDB(); playerUpdateProgressUI();
}

// 安全请求后端 JSON：区分「后端不可达 / 返回非 JSON（被 CDN 回退成 HTML）/ HTTP 错误 / 正常」。
// 避免直接 r.json() 在返回 HTML 时抛「The string did not match the expected pattern」这类解析错误。
async function apiJson(path, opts) {
  let r;
  try { r = await fetch(API_BASE + path, opts); }
  catch (e) { return { ok: false, err: 'network', message: '无法连接服务' }; }
  const ct = r.headers.get('content-type') || '';
  if (!r.ok) {
    let msg = 'HTTP ' + r.status;
    try { const j = await r.json(); if (j && (j.error || j.message)) msg = j.error || j.message; } catch (e) {}
    return { ok: false, err: 'http', status: r.status, message: msg };
  }
  if (ct.indexOf('application/json') === -1) return { ok: false, err: 'not-json', message: '服务响应异常' };
  try { return { ok: true, data: (await r.json()).data }; }
  catch (e) { return { ok: false, err: 'parse', message: '服务响应解析失败' }; }
}

    return;
  }
  const r = await apiJson('/api/music/login/qr');
  if (!r.ok) {
    // LOGIN_UNAVAILABLE：后端不可达 / 响应非 JSON；LOGIN_FAILED：后端可达但取码失败
    if (r.err === 'network' || r.err === 'not-json' || r.err === 'parse') toast('登录服务暂不可用，请稍后再试', true);
    else toast('获取二维码失败：' + r.message, true);
    return;
  }
  const d = r.data;

  _qrKey = d.key;
  modal('<div class="modal-head"><h3>登录网易云</h3><button class="x" onclick="OS.closeModal();if(_qrTimer){clearInterval(_qrTimer)}">✕</button></div><div class="modal-body" style="text-align:center"><img src="' + d.qrimg + '" style="width:220px;height:220px;border-radius:12px"><div class="muted" style="margin-top:8px">打开网易云 App 扫码登录</div><div id="qrHint" class="muted" style="margin-top:4px">等待扫码…</div></div>');

async function musicQrPoll(key) {
  const r = await apiJson('/api/music/login/check?key=' + encodeURIComponent(key));
  const hint = document.getElementById('qrHint');
  if (!r.ok) {
    // 后端不可达 / 响应异常：停止轮询并明确提示，而非静默失败
    if (r.err === 'network' || r.err === 'not-json' || r.err === 'parse') {
      if (_qrTimer) clearInterval(_qrTimer);
      if (hint) hint.textContent = '登录服务不可用';
      toast('登录服务暂不可用，请稍后再试', true);
    }
    return;
  }
  const d = r.data; if (!d) return;
  if (d.code === 803) { if (_qrTimer) clearInterval(_qrTimer); if (hint) hint.textContent = '登录成功 ♥'; toast('网易云登录成功：' + (d.nickname || '')); await musicRefreshStatus(); OS.closeModal(); }
  else if (d.code === 800) { if (_qrTimer) clearInterval(_qrTimer); if (hint) hint.textContent = '二维码已过期，请重新打开'; }
  else if (d.code === 802) { if (hint) hint.textContent = '已扫码，请在手机上确认'; }
  else if (d.code === 801) { if (hint) hint.textContent = '等待扫码…'; }
}

}

// 闹钟服务：供 AI 行动 / 其它模块复用
const AlarmService = {
  create(a) {
    const rec = { id: uid(), title: (a && a.title) || '闹钟', body: (a && a.body) || '', time: (a && a.time) || '08:00', date: (a && a.date) || '', repeat: (a && a.repeat) || 'once', days: (a && Array.isArray(a.days)) ? a.days : [], enabled: true, bark: !a || a.bark !== false, lastFired: {}, createdAt: Date.now(), updatedAt: Date.now() };
    DB.alarms.push(rec); saveDB(); render(); return rec;
  },
  toggle(id) { const a = alarmById(id); if (a) { a.enabled = !a.enabled; saveDB(); render(); } },
  remove(id) { DB.alarms = DB.alarms.filter((x) => x.id !== id); saveDB(); render(); },
  async parse(text) {
    const r = await fetch(API_BASE + '/api/ai/alarm/parse', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
    return j.data || {};
  },
};
async function createAlarmFromText(text) {
  text = (text || '').trim();
  if (!text) { toast('先说一句话，比如「明早 8 点叫我起床」', true); return; }
  const input = document.getElementById('alarmText'); if (input) input.value = '';
  toast('正在理解…');
  try {
    const p = await AlarmService.parse(text);
    if (p.notificationType === 'ALARM' && p.alarmIntent) {
      AlarmService.create({ title: p.title || '闹钟', body: p.body || '', time: p.time || '08:00', date: p.date || '', repeat: p.repeat || 'once' });
      toast('闹钟已设好：' + (p.time || '') + ' ' + (p.title || ''));
    } else {
      toast('这不像明确的「设闹钟」请求，已按普通提醒理解：' + (p.title || text), true);
    }
  } catch (e) {
    toast('AI 创建失败：' + e.message + '（后端未连接或密钥未配置）', true);
  }
}

/* ---------------- file helpers ---------------- */
function readAsDataURL(file) { return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.target.result); r.onerror = reject; r.readAsDataURL(file); }); }
function cropSquareImage(file, type = 'image/png', quality) {
  return new Promise((resolve) => { const reader = new FileReader(); reader.onload = function(e) { const img = new Image(); img.onload = function() { const size = Math.min(img.width, img.height); const canvas = document.createElement('canvas'); canvas.width = 200; canvas.height = 200; const ctx = canvas.getContext('2d'); const sx = (img.width - size) / 2, sy = (img.height - size) / 2; ctx.drawImage(img, sx, sy, size, size, 0, 0, 200, 200); resolve(canvas.toDataURL(type, quality)); }; img.src = e.target.result; }; reader.readAsDataURL(file); });
}
// 把图片（JPEG data URL）上传到现有文件存储，返回公网 URL。
// 上传失败（后端不可达 / 本地开发）时返回 ''，调用方自行回退默认，不阻断保存。
async function uploadPublicImage(dataUrl, fileName) {

    const j = await r.json().catch(() => ({}));
    return (j.data && j.data.publicUrl) || '';

}

  if (!Array.isArray(DB.assistants)) DB.assistants = [];

    // 首次迁移：用现有的 aiSettings 播种默认 Bunny，保留用户已有的名字/头像/模型/人格
    const s = aiSet();

    a.avatar = s.assistantAvatar || ''; a.avatarUrl = s.assistantAvatarUrl || ''; a.systemPrompt = s.systemPrompt || '';
    DB.assistants.push(a);
  }
  if (!DB.activeAssistantId || !DB.assistants.some((a) => a.id === DB.activeAssistantId)) DB.activeAssistantId = DB.assistants[0].id;

async function openApiFill() {
  try {
    const resp = await fetch(API_BASE + '/api/settings'); if (!resp.ok) return;
    const data = await resp.json();
    const s = data.settings || {};
    _apiConnections = data.connections || { deepseek: null, openai: null, anthropic: null };
    _apiKeySet = { deepseek: Boolean(s.deepseek_key_set), openai: Boolean(s.openai_key_set), anthropic: Boolean(s.anthropic_key_set) };
    const set = (id, v, ph) => { const el = document.getElementById(id); if (el) { el.value = v || ''; if (ph) el.placeholder = ph; } };
    set('dsKey', s.deepseek_api_key, s.deepseek_key_set ? '已保存（留空不变）' : 'sk-...');
    set('oaKey', s.openai_api_key, s.openai_key_set ? '已保存（留空不变）' : 'sk-...');
    set('anKey', s.anthropic_api_key, s.anthropic_key_set ? '已保存（留空不变）' : 'sk-ant-...');
    set('dsBase', s.deepseek_base_url); set('oaBase', s.openai_base_url); set('anBase', s.anthropic_base_url);
    const proto = document.getElementById('anProto'); if (proto) proto.value = s.anthropic_protocol || 'anthropic';
    ['deepseek', 'openai', 'anthropic'].forEach(renderConn);
  } catch (e) {}
}

async function testProvider(provider) {
  setConn(provider, { status: 'PENDING', code: null, message: '测试中…' });
  const keyEl = document.getElementById(provider === 'deepseek' ? 'dsKey' : provider === 'openai' ? 'oaKey' : 'anKey');
  const baseEl = document.getElementById(provider === 'deepseek' ? 'dsBase' : provider === 'openai' ? 'oaBase' : 'anBase');
  const body = { provider };
  const key = keyEl ? keyEl.value.trim() : '';
  if (key && !key.includes('•')) body.api_key = key;
  if (baseEl && baseEl.value.trim()) body.base_url = baseEl.value.trim();
  if (provider === 'anthropic') { const proto = document.getElementById('anProto'); body.protocol = proto ? proto.value : 'anthropic'; }
  try {
    const r = await fetch(API_BASE + '/api/settings/connect', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error((data.error && data.error.message) || ('HTTP ' + r.status));
    setConn(provider, data.connection || { status: 'FAILED', code: 'UNKNOWN_ERROR', message: '无返回' });
  } catch (e) {
    setConn(provider, { status: 'DISCONNECTED', code: 'BACKEND_UNAVAILABLE', message: e.message });
  }
}

async function saveApiSettings() {
  const body = {};
  const ds = document.getElementById('dsKey').value.trim(), oa = document.getElementById('oaKey').value.trim(), an = document.getElementById('anKey').value.trim();
  if (ds && !ds.includes('•')) body.deepseek_api_key = ds;
  if (oa && !oa.includes('•')) body.openai_api_key = oa;
  if (an && !an.includes('•')) body.anthropic_api_key = an;
  body.deepseek_base_url = document.getElementById('dsBase').value.trim();
  body.openai_base_url = document.getElementById('oaBase').value.trim();
  body.anthropic_base_url = document.getElementById('anBase').value.trim();
  body.anthropic_protocol = document.getElementById('anProto').value;
  try {
    const r = await fetch(API_BASE + '/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error((data.error && data.error.message) || ('HTTP ' + r.status));
    ['dsKey', 'oaKey', 'anKey'].forEach((id) => { const el = document.getElementById(id); if (el) el.value = ''; });
    await openApiFill();
    toast('已保存（密钥已加密）✓');
    for (const p of ['deepseek', 'openai', 'anthropic']) if (_apiKeySet[p]) await testProvider(p);
  } catch (e) { toast('保存失败：' + e.message, true); }
}

OS.chat.send = async function() {
  const input = document.getElementById('chatInput'); const text = input.value.trim();

  if (OS.chat.attachments.some((a) => a.status === 'error')) { toast('有附件上传失败，请移除后重试', true); return; }
  // 编辑模式：改的是已存在的用户消息，走编辑接口（需求 3），不产生重复消息、不丢历史
  const editingId = OS.chat.editingId;
  OS.chat.editingId = null; OS.chat.renderEditBar();
  // 取出引用动态并清空（需求 33）：用户自己发送时才携带，绝不自动发送
  const quoted = OS.chat.quotedDynamic || null;
  OS.chat.quotedDynamic = null;
  const qc = document.querySelector('.quote-card'); if (qc) qc.remove();
  if (editingId) { input.value = ''; OS.chat.attachments = []; OS.chat.renderAttach(); OS.chat.resend(editingId, text); return; }
  const now = new Date().toLocaleString();
  const content = text; // 附件走独立 attachmentIds，绝不拼进正文（不污染消息原文）
  const attachmentIds = OS.chat.attachments.filter((a) => a.id).map((a) => a.id);
  const attachMeta = OS.chat.attachments.map((a) => ({ id: a.id, fileName: a.name, mimeType: a.type, size: a.size, fileUrl: a.fileUrl, dataUrl: a.dataUrl || null }));
  const userMsg = { role: 'user', content, time: now, pendingUser: true, quotedDynamic: quoted, attachments: attachMeta };
  const thinking = { role: 'assistant', content: '', time: now, thinking: true };
  OS.chat.messages.push(userMsg, thinking);
  input.value = ''; OS.chat.attachments = []; OS.chat.renderAttach();
  const btn = document.getElementById('chatSend'); if (btn) btn.disabled = true;
  OS.chat.renderMessages();
  const s = aiSet();
  try {
    if (s.streaming) await OS.chat.sendStreaming(content, attachmentIds, thinking, now, quoted);
    else {
      const resp = await fetch(API_BASE + '/api/sessions/' + OS.chat.currentId + '/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content, model: s.model, notify: !(document.visibilityState === 'visible' && document.hasFocus()), quotedDynamic: quoted, attachmentIds }) });
      const ct = (resp.headers.get('content-type') || '').toLowerCase();
      let data = {};
      if (ct.includes('json')) data = await resp.json().catch(() => ({}));
      else { try { const txt = await resp.text(); console.error('[chat] AI 返回非 JSON（content-type: ' + ct + '）：', String(txt).slice(0, 500)); } catch (e) {} }
      if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status + (ct.includes('json') ? '' : ' · 服务器返回了非 JSON 响应，请检查中转地址')));
      OS.chat.messages = OS.chat.messages.filter((m) => m !== thinking && !m.pendingUser);
      if (data.compressed) { await OS.chat.loadMessages(); OS.chat.messages.push({ role: 'assistant', content: '（已自动整理历史记忆）', time: now, note: true }); }
      else { OS.chat.messages.push(chatMapMessage(data.userMessage)); OS.chat.messages.push(chatMapMessage(data.assistantMessage)); }
    }
  } catch (err) {
    OS.chat.messages = OS.chat.messages.filter((m) => m !== thinking && !m.pendingUser);
    OS.chat.messages.push({ role: 'assistant', content: '❌ 请求失败：' + err.message, error: true });
  }
  if (btn) btn.disabled = false;

};
OS.chat.sendStreaming = async function(content, attachmentIds, thinking, now, quoted) {
  const s = aiSet();
  const resp = await fetch(API_BASE + '/api/sessions/' + OS.chat.currentId + '/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content, model: s.model, notify: !(document.visibilityState === 'visible' && document.hasFocus()), quotedDynamic: quoted, attachmentIds }) });
  if (!resp.ok) { let msg = 'HTTP ' + resp.status; try { msg = (await resp.json()).error || msg; } catch (e) {} throw new Error(msg); }
  const sct = (resp.headers.get('content-type') || '').toLowerCase();
  if (!sct.includes('text/event-stream')) {
    let preview = ''; try { preview = String(await resp.text()).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').slice(0, 200); } catch (e) {}
    throw new Error('AI 流式响应异常（content-type: ' + (sct || '无') + '）' + (preview ? '：' + preview : '') + '。请检查「API 设置」里的中转地址');
  }
  const reader = resp.body.getReader(); const decoder = new TextDecoder(); let buf = '', full = '', lastRender = 0;
  const apply = (text) => { thinking.content = text; thinking.thinking = false; const bubbles = document.querySelectorAll('#chatMsgs .bubble'); const el = bubbles[bubbles.length - 1]; if (el) el.innerHTML = '<div class="md">' + renderMarkdown(text) + '</div>'; };
  while (true) { const { done, value } = await reader.read(); if (done) break; buf += decoder.decode(value, { stream: true }); let idx; while ((idx = buf.indexOf('\n\n')) >= 0) { const block = buf.slice(0, idx).trim(); buf = buf.slice(idx + 2); if (!block.startsWith('data:')) continue; const payload = block.slice(5).trim(); if (payload === '[DONE]') continue; let obj; try { obj = JSON.parse(payload); } catch (e) { continue; } if (obj.error) throw new Error(obj.error); if (obj.delta) { full += obj.delta; const t = Date.now(); if (t - lastRender >= 40) { lastRender = t; apply(full); } } if (obj.done) { if (obj.compressed) await OS.chat.loadMessages(); else { if (obj.userMessage) { const ui = OS.chat.messages.findIndex((m) => m.pendingUser); if (ui >= 0) OS.chat.messages[ui] = chatMapMessage(obj.userMessage); } if (obj.assistantMessage) { const i = OS.chat.messages.indexOf(thinking); if (i >= 0) OS.chat.messages[i] = chatMapMessage(obj.assistantMessage); } } apply(full); return; } } }
  apply(full);
};

/* ---- Event Bus ---- */
const AIBus = {
  _m: {},
  on(t, fn) { (this._m[t] = this._m[t] || []).push(fn); },
  off(t, fn) { if (!this._m[t]) return; this._m[t] = this._m[t].filter((f) => f !== fn); },
  emit(e) {
    const ev = Object.assign({ time: Date.now() }, e);
    (this._m[ev.type] || []).forEach((fn) => { try { fn(ev); } catch (err) { console.warn('[AIBus]', err); } });
    try { aiOnEvent(ev); } catch (err) { console.warn('[aiOnEvent]', err); }
  },
};

// 需求 20：约 50 条时自动整理 —— 去重、压缩流水账、保留重要记忆/状态（确定性压缩，不依赖异步 AI）
function aiTidyActivities() {
  const acts = DB.ai.activities || [];
  if (acts.length < 50) return;
  const keepTypes = { memory: 1, state: 1, chat: 1, journal: 1, plan: 1 };
  const seen = new Set();
  const deduped = [];
  for (const a of acts) {
    const key = a.type + '::' + a.text;
    if (seen.has(key)) continue;
    seen.add(key);
    deduped.push(a);
  }
  // 高价值动态全保留；低价值流水账（task/habit/shopping/music/weather）只留最近 12 条
  const important = deduped.filter((a) => keepTypes[a.type]);
  const flow = deduped.filter((a) => !keepTypes[a.type]).slice(0, 12);
  let result = important.concat(flow).sort((a, b) => b.time - a.time);
  const removed = acts.length - result.length;
  if (removed > 0) result.push({ id: uid(), type: 'state', text: '♻ 自动整理了 ' + removed + ' 条流水动态（保留重要记忆与状态）', time: Date.now() });
  DB.ai.activities = result;
}

    }

      const ok = aiThrottleOk(30000);
      return { shouldRespond: ok, tone: 'quiet', priority: 'low', action: null,
        message: this.pick(['好，一起听「' + song + '」。', '嗯，陪你听「' + song + '」。']),
        state: { emotion: '安心', intensity: 2, reason: '和你一起听歌，很安静。' } };

        : this.pick(['我看见了，谢谢你愿意记下来。', '记下了，此刻也值得被记住。']);

  async currentCoords() {

  },

};

const LocationProvider = {
  _lastError: null,
  // 最后一次定位失败原因（供 UI 清晰展示 denied / unsupported / timeout，不伪造位置）
  lastError() { return this._lastError; },
  // 需求 10：真实定位优先 navigator.geolocation（含精度/时间戳/反向地理编码），
  // 失败才降级到城市级 IP 大致定位（明确 source='ip'，绝不冒充 GPS）。
  async getCurrentLocation() {
    const gps = await this.gpsLocation();
    if (gps && gps.lat) { DB.location = gps; saveDB(); return gps; }
    const ipLoc = await this.ipLocation();
    if (ipLoc) return ipLoc;
    // GPS 与 IP 都不可用时返回 null，绝不伪造定位
    return null;
  },
  // 高德 IP 定位（城市级大致位置，兜底；仅在 GPS 失败后调用）
  async ipLocation() {
    try {
      const r = await fetch(API_BASE + '/api/ip-location');
      if (r.ok) {
        const d = (await r.json()).data;
        if (d && (d.city || d.province)) {
          const loc = { city: d.city || d.province, lat: d.lat || null, lng: d.lng || null, source: 'ip', precision: 'city', updatedAt: Date.now() };
          DB.location = loc; saveDB(); return loc;
        }
      }
    } catch (e) {}
    return null;
  },
  // 浏览器 GPS（精确坐标 + 精度 + 时间戳）；权限被拒/不可用/超时均记录到 _lastError
  gpsLocation() {
    return new Promise((resolve) => {
      if (!('geolocation' in navigator)) { this._lastError = { code: 'unsupported', message: '当前浏览器/环境不支持定位' }; return resolve(null); }
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        const acc = pos.coords.accuracy || null;
        const ts = pos.timestamp || Date.now();
        const city = await this.reverseGeocode(lat, lng);
        this._lastError = null;
        resolve({ city, lat, lng, accuracy: acc, timestamp: ts, source: 'geolocation', updatedAt: Date.now() });
      }, (err) => {
        const msg = { 1: '用户拒绝了定位权限', 2: '定位信息当前不可用', 3: '定位请求超时' }[err && err.code] || ('定位失败' + (err && err.message ? '：' + err.message : ''));
        this._lastError = { code: String((err && err.code) || 'error'), message: msg };
        try { console.warn('[location] 浏览器 GPS 不可用:', err && err.code, err && err.message); } catch (e) {}
        resolve(null);
      }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 5 * 60 * 1000 });
    });
  },
  async reverseGeocode(lat, lng) {
    try {
      const r = await fetch(API_BASE + '/api/geocode?lat=' + lat + '&lng=' + lng);
      if (r.ok) { const d = (await r.json()).data; if (d && (d.city || d.district)) return d.city || d.district; }
    } catch (e) {}
    return '（已获取定位）';
  },
};

/* ================= PERIOD 经期 ================= */
function periodSorted() { return (DB.menstrualCycles || []).slice().sort((a, b) => (a.startDate < b.startDate ? -1 : a.startDate > b.startDate ? 1 : 0)); }
function periodPrediction() {
  const sorted = periodSorted();
  const ongoing = sorted.find((c) => c.startDate && !c.endDate) || null;
  const closed = sorted.filter((c) => c.startDate && c.endDate);
  let avgCycle = null;
  if (closed.length >= 2) {
    let sum = 0, n = 0;
    for (let i = 1; i < closed.length; i++) {
      const d = Math.round((parseDate(closed[i].startDate) - parseDate(closed[i - 1].startDate)) / 86400000);
      if (d >= 15 && d <= 60) { sum += d; n++; }
    }
    if (n) avgCycle = Math.round(sum / n);
  }
  const last = closed.length ? closed[closed.length - 1] : (sorted.length ? sorted[sorted.length - 1] : null);
  const nextStart = (avgCycle && last) ? addDays(last.startDate, avgCycle) : null;
  return { ongoing, closed, avgCycle, last, nextStart };
}
function viewPeriod() {
  const p = periodPrediction();

  let html = '<div class="spread" style="margin-bottom:16px"><div><div class="h1">经期</div><div class="muted">经期记录与预测 · 隐私</div></div><div class="row" style="gap:8px"><button class="btn btn-sm ' + (p.ongoing ? '' : 'btn-primary') + '" onclick="periodStartModal()">' + (p.ongoing ? '进行中' : '＋ 记录开始') + '</button>' + (p.ongoing ? '<button class="btn btn-sm" onclick="periodEndModal()">记录结束</button>' : '') + '</div></div>';

// 从 txt / md / json 批量导入长期记忆（去重 + 上限 200，避免一次灌入过多）。
// PDF 是二进制，浏览器 readAsText 读不出正文，诚实提示转成文本再导入，绝不用乱码冒充记忆。
function aiImportMemory(input) {
  const file = input.files[0]; if (!file) return;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const isPdf = ext === 'pdf' || file.type === 'application/pdf';
  const read = () => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result || '')); r.onerror = rej; r.readAsText(file); });
  read().then((text) => {
    if (!text.trim()) { toast('文件为空', true); return; }
    let items = [];
    if (ext === 'json') {
      try {
        const data = JSON.parse(text);
        const arr = Array.isArray(data) ? data : (data && Array.isArray(data.memories) ? data.memories : []);
        items = arr.map((x) => {
          if (typeof x === 'string') return { content: x.trim(), category: '导入' };
          const o = x && typeof x === 'object' ? x : {};
          return { content: String(o.content || o.title || o.text || '').trim(), category: String(o.category || '导入') };
        }).filter((x) => x.content);
      } catch (e) { toast('JSON 解析失败：' + e.message, true); return; }
    } else {
      const lines = text.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
      items = lines.map((l) => ({ content: l.replace(/^[\s\-*#>]+/, '').trim(), category: '导入' })).filter((x) => x.content && x.content.length >= 2);
    }
    if (!items.length) {
      toast(isPdf ? 'PDF 无法直接导入（浏览器读不出 PDF 正文），请先导出为 txt / md / json 再导入' : '没有可导入的内容', true);
      return;
    }
    const mems = DB.ai.memories || (DB.ai.memories = []);
    const existing = new Set(mems.map((m) => m.content));
    let added = 0;
    for (const it of items) {
      if (existing.has(it.content) || added >= 200) continue;
      mems.unshift({ id: uid(), content: it.content, category: it.category, sourceType: 'manual', sourceId: null, confidence: 0.8, createdAt: Date.now(), updatedAt: Date.now() });
      existing.add(it.content); added++;
    }
    if (added === 0) { toast('这些内容都已经记住过了', true); input.value = ''; return; }
    saveDB(); input.value = ''; render(); toast('已导入 ' + added + ' 条记忆 ♥');
  }).catch(() => { toast('读取文件失败', true); });
}

// 需求 9：半屏 Mini Map（OpenStreetMap 内嵌，无需 Key，展示真实定位；GPS 优先，IP 兜底并明确标注）
async function openMiniMap() {
  let loc = DB.location;
  if (!loc || !loc.lat || !loc.lng) {
    toast('正在获取定位…');
    loc = await LocationProvider.getCurrentLocation();
    if (loc && loc.lat && loc.lng) { DB.location = loc; saveDB(); }
  }
  if (!loc || !loc.lat || !loc.lng) {
    const err = LocationProvider.lastError();
    toast('无法获取定位，无法显示地图' + (err ? '：' + err.message : ''), true);
    return;
  }
  const lat = Number(loc.lat), lng = Number(loc.lng);
  const d = 0.02;
  const bbox = (lng - d).toFixed(5) + '%2C' + (lat - d).toFixed(5) + '%2C' + (lng + d).toFixed(5) + '%2C' + (lat + d).toFixed(5);
  const src = 'https://www.openstreetmap.org/export/embed.html?bbox=' + bbox + '&layer=mapnik&marker=' + lat.toFixed(5) + '%2C' + lng.toFixed(5);
  drawer('<div class="sheet"><div class="sheet-grab"></div>' +
    '<div class="sheet-head"><div style="font-weight:700;font-size:16px">Mini Map</div>' +
    '<div class="muted" style="font-size:12px">' + esc(loc.city || '当前位置') + (loc.source === 'ip' ? ' · 城市级大致定位' : ' · GPS 定位') + '</div></div>' +
    '<iframe src="' + src + '" style="width:100%;height:62vh;border:0;border-radius:14px;background:var(--border)" loading="lazy" title="Mini Map"></iframe>' +
    '<div class="muted" style="font-size:11px;padding:10px 2px 4px">地图来自 OpenStreetMap · ' + lat.toFixed(4) + ', ' + lng.toFixed(4) + (loc.accuracy ? ' · 精度 ±' + Math.round(loc.accuracy) + 'm' : '') + '</div>' +
    '</div>', 'bottom');
}

function aiLocationAllow() {
  aiPerm().location = true; saveDB();
  LocationProvider.getCurrentLocation().then(async (loc) => {
    // 未拿到真实定位：展示具体原因（权限被拒/不可用/超时/未配置 AMAP_KEY），不伪造位置
    if (!loc) {
      const err = LocationProvider.lastError();
      toast('定位失败' + (err ? '：' + err.message : '（权限被拒或服务不可用）'), true);
      render(); return;

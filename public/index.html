<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bunny's Home</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <style>
    @font-face {
      font-family: 'BAUHS93';
      src: url('BAUHS93.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face { font-family: 'Arial Rounded MT Bold'; src: url('ARLRDBD.TTF') format('truetype'); font-weight: normal; font-style: normal; }
    @font-face { font-family: 'Colonna MT'; src: url('COLONNA.TTF') format('truetype'); font-weight: normal; font-style: normal; }
    @font-face { font-family: 'Curlz MT'; src: url('CURLZ___.TTF') format('truetype'); font-weight: normal; font-style: normal; }
    @font-face { font-family: 'Ink Free'; src: url('Inkfree.ttf') format('truetype'); font-weight: normal; font-style: normal; }
    @font-face { font-family: 'Blackadder ITC'; src: url('ITCBLKAD.TTF') format('truetype'); font-weight: normal; font-style: normal; }
    @font-face { font-family: 'Edwardian Script ITC'; src: url('ITCEDSCR.TTF') format('truetype'); font-weight: normal; font-style: normal; }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --accent: #6b8cae;
      --accent-strong: #3e6b8e;
      --accent-soft: #a9c4dc;
      --accent-hover: #b8d6ea;
      --accent-border: #a0bfd4;
      --accent-bg: #f7fafe;
      --accent-tint: #e8f0f8;
      --accent-line: #e2ecf4;

      --bg: #f4f7fb;
      --bg2: #ffffff;
      --card: rgba(255,255,255,0.85);
      --card-solid: #ffffff;
      --border: rgba(210,226,240,0.6);
      --border-strong: rgba(180,200,220,0.8);
      --text: #33465c;
      --text-soft: #6b7f94;
      --text-faint: #93a5b8;
      --shadow: 0 2px 10px rgba(40,60,90,0.05);
      --shadow-md: 0 8px 28px rgba(40,60,90,0.10);
      --radius: 16px;
      --radius-lg: 22px;
      --radius-sm: 12px;
      --sidebar-w: 252px;
      --topbar-h: 56px;
      --bottomnav-h: 60px;
      --dur: 0.18s;
    }
    html[data-theme="dark"] {
      --bg: #0f141b;
      --bg2: #161d27;
      --card: rgba(26,34,46,0.8);
      --card-solid: #1a222e;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.14);
      --text: #dbe4ee;
      --text-soft: #93a5b8;
      --text-faint: #64748b;
      --shadow: 0 2px 10px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 28px rgba(0,0,0,0.45);
      --accent-bg: #141b24;
      --accent-tint: #1c2733;
      --accent-line: #223040;
    }
    html { font-size: 15px; }
    body {
      font-family: 'BAUHS93', -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }
    button, input, textarea, select { font-family: inherit; color: inherit; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(140,160,180,0.35); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(140,160,180,0.55); }

    .app { display: flex; height: 100vh; width: 100%; }
    .scrim { position: fixed; inset: 0; background: rgba(15,23,35,0.4); z-index: 80; opacity: 0; pointer-events: none; transition: opacity 0.25s; backdrop-filter: blur(2px); }
    .scrim.show { opacity: 1; pointer-events: auto; }

    /* ============ Sidebar ============ */
    .sidebar {
      width: var(--sidebar-w); height: 100vh; flex-shrink: 0;
      background: var(--accent-bg); border-right: 1px solid var(--accent-line);
      display: flex; flex-direction: column; padding: 18px 12px 12px;
      position: relative; z-index: 90;
    }
    .logo {
      font-size: 18px; font-weight: 700; letter-spacing: 1px; color: var(--accent);
      padding: 6px 12px 14px; display: flex; align-items: center; gap: 8px;
    }
    .logo .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-new {
      display: flex; align-items: center; gap: 8px; width: 100%;
      background: var(--bg2); border: 1px solid var(--accent-line); border-radius: 14px;
      padding: 11px 14px; font-size: 14px; color: var(--accent-strong); cursor: pointer;
      transition: background 0.15s; margin-bottom: 12px; text-align: left;
    }
    .nav-new:hover { background: var(--accent-tint); }
    .nav-section {
      font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text-faint); padding: 12px 12px 6px; font-weight: 700;
    }
    .nav-scroll { flex: 1; overflow-y: auto; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px;
      font-size: 14px; color: var(--text-soft); cursor: pointer; transition: background 0.15s, color 0.15s;
      margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left;
    }
    .nav-item:hover { background: var(--accent-tint); color: var(--text); }
    .nav-item.active { background: var(--accent-tint); color: var(--accent-strong); font-weight: 600; }
    .nav-item .ico { width: 20px; text-align: center; flex-shrink: 0; }
    .nav-item .lbl { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-item .badge { font-size: 11px; background: var(--accent); color: #fff; border-radius: 10px; padding: 1px 7px; }
    .nav-foot { border-top: 1px solid var(--accent-line); padding-top: 8px; }

    /* ============ Main / Topbar ============ */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100vh; position: relative; }
    .main .bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 1; pointer-events: none; z-index: 0; transition: opacity 0.3s; }
    .topbar {
      height: var(--topbar-h); flex-shrink: 0; display: flex; align-items: center; gap: 12px;
      padding: 0 18px; position: relative; z-index: 2;
      background: rgba(255,255,255,0.55); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    html[data-theme="dark"] .topbar { background: rgba(18,25,34,0.55); }
    .menu-btn { background: none; border: none; font-size: 22px; color: var(--accent); cursor: pointer; display: none; line-height: 1; }
    .topbar-title { font-size: 17px; font-weight: 700; color: var(--accent-strong); }
    .topbar-sub { font-size: 12px; color: var(--text-faint); }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 12px; background: var(--card); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px;
      transition: background 0.15s, transform 0.1s; position: relative;
    }
    .icon-btn:hover { background: var(--accent-tint); }
    .icon-btn:active { transform: scale(0.94); }
    .icon-btn .dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: #ef5350; border: 1.5px solid var(--bg2); }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; background: var(--accent-tint); border: 2px solid var(--accent-soft);
      background-size: cover; background-position: center; cursor: pointer; flex-shrink: 0;
    }
    .view { flex: 1; overflow-y: auto; position: relative; z-index: 1; padding: 22px 24px 100px; }
    .view-inner { max-width: 1080px; margin: 0 auto; animation: viewIn 0.22s ease; }
    @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* ============ Bottom nav / FAB ============ */
    .bottomnav {
      display: none; position: fixed; bottom: 0; left: 0; right: 0; height: var(--bottomnav-h);
      background: var(--card); backdrop-filter: blur(14px); border-top: 1px solid var(--border);
      z-index: 70; padding-bottom: env(safe-area-inset-bottom);
    }
    .bottomnav-inner { display: flex; height: 100%; }
    .bn-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--text-faint); cursor: pointer; background: none; border: none; }
    .bn-item .ico { font-size: 20px; }
    .bn-item.active { color: var(--accent); }
    .fab {
      position: fixed; right: 22px; bottom: 24px; width: 56px; height: 56px; border-radius: 50%;
      background: var(--accent); color: #fff; font-size: 28px; border: none; cursor: pointer;
      box-shadow: 0 8px 24px rgba(60,90,130,0.4); z-index: 60; display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, background 0.2s; line-height: 1;
    }
    .fab:hover { background: var(--accent-strong); transform: translateY(-2px); }
    .fab:active { transform: scale(0.92); }

    /* ============ Cards / common ============ */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); backdrop-filter: blur(6px); }
    .card-pad { padding: 18px 20px; }
    .section-head { display: flex; align-items: baseline; gap: 8px; margin: 26px 0 12px; }
    .section-head h2 { font-size: 16px; font-weight: 700; color: var(--text); }
    .section-head .hint { font-size: 12px; color: var(--text-faint); }
    .section-head .more { margin-left: auto; font-size: 12px; color: var(--accent); cursor: pointer; background: none; border: none; }
    .grid { display: grid; gap: 14px; }
    .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .muted { color: var(--text-faint); font-size: 12px; }
    .h2 { font-size: 22px; font-weight: 700; color: var(--text); }
    .h1 { font-size: 26px; font-weight: 700; color: var(--text); letter-spacing: 0.5px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .spread { display: flex; align-items: center; justify-content: space-between; }
    .grow { flex: 1; min-width: 0; }

    /* buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 16px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer;
      background: var(--card-solid); color: var(--text); font-size: 13.5px; transition: all 0.15s; white-space: nowrap;
    }
    .btn:hover { background: var(--accent-tint); border-color: var(--accent-border); }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
    .btn-soft { background: var(--accent-tint); border-color: transparent; color: var(--accent-strong); }
    .btn-danger { background: #fbeaea; border-color: #f3cdcd; color: #c0392b; }
    .btn-danger:hover { background: #f6d8d8; }
    .btn-sm { padding: 6px 11px; font-size: 12.5px; border-radius: 10px; }
    .btn-block { width: 100%; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* inputs */
    .input, .textarea, .select {
      width: 100%; padding: 10px 13px; border: 1px solid var(--border); border-radius: 12px;
      background: var(--card-solid); font-size: 14px; color: var(--text); outline: none; transition: border 0.15s;
    }
    .input:focus, .textarea:focus, .select:focus { border-color: var(--accent-border); }
    .textarea { resize: vertical; min-height: 60px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12.5px; color: var(--text-soft); margin-bottom: 5px; font-weight: 600; }
    .field .row.gap2 { gap: 8px; }
    .search-box { position: relative; }
    .search-box input { padding-left: 38px; }
    .search-box .sico { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-faint); font-size: 15px; }

    /* progress */
    .progress { height: 7px; background: var(--accent-tint); border-radius: 10px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: var(--accent); border-radius: 10px; transition: width 0.4s ease; }
    .ring { transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 8; }
    .ring .bg { stroke: var(--accent-tint); }
    .ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }

    /* chips / tags */
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; background: var(--accent-tint); color: var(--accent-strong); border: 1px solid var(--accent-line); }
    .tag { display: inline-flex; align-items: center; gap: 3px; padding: 1px 8px; border-radius: 8px; font-size: 11px; background: var(--accent-tint); color: var(--accent-strong); margin: 1px; }

    /* checkbox */
    .chk { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--accent-border); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; background: var(--card-solid); }
    .chk:hover { border-color: var(--accent); }
    .chk.on { background: var(--accent); border-color: var(--accent); }
    .chk.on::after { content: '✓'; color: #fff; font-size: 12px; font-weight: 700; }
    .chk.sm { width: 17px; height: 17px; border-width: 1.5px; }
    .chk.sm::after { font-size: 10px; }

    /* task row */
    .task-row { display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 14px; cursor: pointer; transition: background 0.15s; border: 1px solid transparent; }
    .task-row:hover { background: var(--accent-tint); border-color: var(--accent-line); }
    .task-row .t-title { flex: 1; font-size: 14px; color: var(--text); word-break: break-word; transition: opacity 0.2s; }
    .task-row.done .t-title { text-decoration: line-through; opacity: 0.45; }
    .task-row .t-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
    .prio { width: 4px; height: 18px; border-radius: 4px; flex-shrink: 0; }
    .prio.high { background: #ef5350; } .prio.med { background: #f59e0b; } .prio.low { background: #38bdf8; } .prio.none { background: transparent; }
    .drag-hint { opacity: 0.5; cursor: grab; font-size: 13px; }

    /* empty */
    .empty { text-align: center; padding: 46px 20px; color: var(--text-faint); }
    .empty .eico { font-size: 44px; margin-bottom: 10px; opacity: 0.6; }
    .empty .etitle { font-size: 15px; color: var(--text-soft); font-weight: 600; margin-bottom: 4px; }
    .empty .esub { font-size: 12.5px; }

    /* ============ Modal / drawer / toast / menu ============ */
    .overlay { position: fixed; inset: 0; background: rgba(12,20,30,0.42); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 18px; animation: fadeIn 0.18s ease; backdrop-filter: blur(3px); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal { background: var(--card-solid); border-radius: var(--radius-lg); width: 100%; max-width: 460px; max-height: 86vh; overflow-y: auto; box-shadow: var(--shadow-md); animation: popIn 0.2s ease; border: 1px solid var(--border); }
    @keyframes popIn { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: none; } }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 12px; }
    .modal-head h3 { font-size: 16px; color: var(--text); }
    .modal-head .x { background: none; border: none; font-size: 22px; color: var(--text-faint); cursor: pointer; }
    .modal-body { padding: 4px 20px 20px; }
    .modal-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 4px 20px 20px; }
    .drawer { position: fixed; z-index: 210; background: var(--card-solid); box-shadow: var(--shadow-md); animation: slideUp 0.25s ease; }
    .drawer.bottom { left: 0; right: 0; bottom: 0; max-height: 82vh; border-radius: 24px 24px 0 0; overflow-y: auto; }
    .drawer.right { top: 0; right: 0; bottom: 0; width: 100%; max-width: 400px; border-radius: 20px 0 0 20px; overflow-y: auto; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
    @keyframes slideRight { from { transform: translateX(100%); } to { transform: none; } }
    .drawer.right { animation-name: slideRight; }
    .sheet { background: var(--card-solid); border-radius: 24px 24px 0 0; width: 100%; max-width: 460px; padding: 12px 14px 24px; animation: slideUp 0.25s ease; box-shadow: var(--shadow-md); }
    .sheet-item { display: flex; align-items: center; gap: 14px; padding: 15px 12px; border-radius: 14px; cursor: pointer; font-size: 15px; color: var(--text); border: none; background: none; width: 100%; text-align: left; }
    .sheet-item:hover { background: var(--accent-tint); }
    .sheet-item .ico { width: 26px; text-align: center; font-size: 19px; }
    .sheet-grab { width: 40px; height: 4px; border-radius: 4px; background: var(--border-strong); margin: 4px auto 10px; }
    #toastRoot { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 500; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
    .toast { background: var(--card-solid); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 14px; font-size: 13.5px; box-shadow: var(--shadow-md); animation: toastIn 0.25s ease; display: flex; align-items: center; gap: 8px; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
    .toast.out { opacity: 0; transform: translateY(-8px); transition: 0.25s; }
    #menuRoot { position: fixed; z-index: 400; }
    .menu { background: var(--card-solid); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-md); padding: 5px; min-width: 150px; animation: popIn 0.14s ease; }
    .menu button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 9px 12px; border: none; background: none; border-radius: 10px; font-size: 13.5px; color: var(--text); cursor: pointer; }
    .menu button:hover { background: var(--accent-tint); }
    .menu button.danger { color: #c0392b; }
    .menu button.danger:hover { background: #fbeaea; }

    /* color swatches */
    .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
    .sw { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.12s; }
    .sw:hover { transform: scale(1.12); }
    .sw.sel { border-color: var(--text); box-shadow: 0 0 0 3px var(--accent-tint); }
    .sw-custom { width: 30px; height: 30px; border-radius: 50%; border: 2px dashed var(--border-strong); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 15px; position: relative; overflow: hidden; }
    .sw-custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    /* ============ Calendar ============ */
    .cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .cal-title { font-size: 20px; font-weight: 700; color: var(--text); }
    .cal-nav { display: flex; gap: 6px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-dow { text-align: center; font-size: 11px; color: var(--text-faint); font-weight: 700; padding: 6px 0; letter-spacing: 0.5px; }
    .cal-cell { min-height: 88px; border: 1px solid var(--border); border-radius: 14px; padding: 6px; cursor: pointer; transition: all 0.15s; background: var(--card); position: relative; overflow: hidden; }
    .cal-cell:hover { border-color: var(--accent-border); }
    .cal-cell.other { opacity: 0.35; }
    .cal-cell.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .cal-cell .dnum { font-size: 13px; font-weight: 700; color: var(--text-soft); margin-bottom: 4px; }
    .cal-cell.today .dnum { color: var(--accent); }
    .cal-dot { font-size: 10.5px; line-height: 1.5; padding: 1px 5px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 1px; }
    .cal-more { font-size: 10px; color: var(--text-faint); }
    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .week-col { border: 1px solid var(--border); border-radius: 14px; min-height: 180px; padding: 8px; background: var(--card); }
    .week-col.today { border-color: var(--accent); }
    .week-col-head { font-size: 12px; font-weight: 700; color: var(--text-soft); text-align: center; margin-bottom: 6px; }
    .week-col.today .week-col-head { color: var(--accent); }
    .week-col .dnum { text-align: center; font-size: 11px; color: var(--text-faint); margin-bottom: 6px; }

    /* ============ Habit / Health / Stat ============ */
    .habit-card { display: flex; align-items: center; gap: 12px; padding: 15px; }
    .habit-ico { width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 21px; flex-shrink: 0; }
    .habit-streak { font-size: 12px; color: #f59e0b; font-weight: 600; }
    .stat-card { padding: 16px; }
    .stat-card .v { font-size: 26px; font-weight: 700; color: var(--text); letter-spacing: 0.5px; }
    .stat-card .u { font-size: 13px; color: var(--text-faint); }
    .stat-card .l { font-size: 12px; color: var(--text-soft); margin-bottom: 4px; }
    .chart-wrap { padding: 12px; }
    .seg { display: inline-flex; background: var(--accent-tint); border-radius: 12px; padding: 3px; gap: 2px; }
    .seg button { border: none; background: none; padding: 6px 13px; border-radius: 9px; font-size: 12.5px; color: var(--text-soft); cursor: pointer; }
    .seg button.on { background: var(--card-solid); color: var(--accent-strong); font-weight: 600; box-shadow: var(--shadow); }

    /* ============ Messages / Chat ============ */

let DB = loadDB();
function loadDB() {
  let db;
  try { const raw = localStorage.getItem(LS_KEY); db = raw ? JSON.parse(raw) : null; } catch (e) { db = null; }
  if (!db || !db.version) db = defaultDB();
  const def = defaultDB();
  // repair / merge missing top-level keys
  for (const k of Object.keys(def)) { if (db[k] == null) db[k] = def[k]; }
  if (!Array.isArray(db.plans)) db.plans = [];
  if (!Array.isArray(db.tasks)) db.tasks = [];
  if (!Array.isArray(db.habits)) db.habits = [];
  if (!Array.isArray(db.health)) db.health = [];
  if (!Array.isArray(db.notes)) db.notes = [];
  if (!Array.isArray(db.notifications)) db.notifications = [];
  if (!Array.isArray(db.alarms)) db.alarms = [];
  if (!db.player) db.player = def.player;
  if (db.player.togetherListening == null) db.player.togetherListening = false;
  if (!db.appearance) db.appearance = def.appearance;
  if (db.appearance.fontEn == null) db.appearance.fontEn = def.appearance.fontEn;
  if (!db.profile) db.profile = def.profile;
  if (!db.ai) db.ai = def.ai;
  if (!db.ai.memories || !Array.isArray(db.ai.memories)) db.ai.memories = [];
  if (!Array.isArray(db.ai.states)) db.ai.states = [];
  if (!Array.isArray(db.ai.activities)) db.ai.activities = [];
  if (!Array.isArray(db.ai.notifications)) db.ai.notifications = [];
  if (!db.ai.permissions) db.ai.permissions = def.ai.permissions;
  if (!db.ai._asked) db.ai._asked = {};
  if (!Array.isArray(db.shoppingLists)) db.shoppingLists = def.shoppingLists;
  if (!Array.isArray(db.shoppingItems)) db.shoppingItems = [];
  if (!Array.isArray(db.journal)) db.journal = [];
  // ensure each plan type has >= 1 plan
  for (const t of Object.keys(TYPE_META)) {
    const arr = db.plans.filter((p) => p.type === t);
    if (arr.length === 0) db.plans.push(defaultPlan(t));
  }
  return db;
}

/* ---------------- 后端同步：local-first + 写穿 /api/state ----------------
   核心数据（计划/任务/习惯/健康/…）持久化到后端 PostgreSQL；
   localStorage 只作工作缓存/离线草稿。后端不可达时静默降级到本地。 */
let _syncTimer = null;
function scheduleSync() { clearTimeout(_syncTimer); _syncTimer = setTimeout(() => SYNC.push(), 800); }
const SYNC = {
  async push() {
    try {
      await fetch(API_BASE + '/api/state', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...DB, _serverSeeded: true }) });
    } catch (e) { /* 后端不可达：静默，仍走本地 */ }
  },
  async bootstrap() {
    try {
      const r = await fetch(API_BASE + '/api/state');
      if (!r.ok) return;
      const j = await r.json();
      const remote = j && j.data;
      if (!remote || typeof remote !== 'object') return;
      if (remote._serverSeeded) {
        delete remote._serverSeeded;
        for (const k of Object.keys(remote)) DB[k] = remote[k];
        DB._serverSeeded = true;
        try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) {}
        render(); // 刷新 UI 显示服务端数据
      } else {
        SYNC.push(); // 首次：上传本地数据播种服务端
      }
    } catch (e) { /* 忽略 */ }
  },
};
function defaultPlan(type) {
  const now = new Date(); const thisMonth = now.getFullYear() + '-' + pad(now.getMonth() + 1); const ws = startOfWeek(todayStr());
  const meta = TYPE_META[type];
  let title, startDate, endDate;
  if (type === 'long-term') { title = meta.def; startDate = todayStr(); endDate = ''; }
  else if (type === 'stage') { title = meta.def; startDate = todayStr(); endDate = ''; }
  else if (type === 'monthly') { title = monthTitle(now.getFullYear(), now.getMonth()); startDate = thisMonth + '-01'; endDate = thisMonth + '-28'; }
  else { title = weekTitle(todayStr()); startDate = ws; endDate = addDays(ws, 6); }
  return { id: uid(), type, title, description: '', startDate, endDate, themeColor: meta.color, parentPlanId: null, archived: false, createdAt: Date.now(), updatedAt: Date.now(), longGoal: '', stageGoals: [], results: [] };
}

/* ---------------- theme + appearance ---------------- */
function applyAccent(hex) {
  const root = document.documentElement;
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  root.style.setProperty('--accent', hex);
  const { h, s, l } = hexToHsl(hex);
  root.style.setProperty('--accent-strong', hslToHex(h, s, dark ? Math.min(1, l + 0.16) : Math.max(0, l - 0.16)));
  root.style.setProperty('--accent-soft', hslToHex(h, s * 0.5, dark ? Math.max(0.25, l) : Math.min(0.93, l + 0.30)));
  root.style.setProperty('--accent-hover', hslToHex(h, s, dark ? Math.max(0.2, l - 0.06) : Math.min(1, l + 0.12)));
  root.style.setProperty('--accent-border', hslToHex(h, s, dark ? Math.max(0.3, l) : Math.min(1, l + 0.18)));
  root.style.setProperty('--accent-bg', hslToHex(h, Math.min(0.5, s), dark ? 0.10 : 0.97));
  root.style.setProperty('--accent-tint', hslToHex(h, Math.min(0.55, s), dark ? 0.17 : 0.92));
  root.style.setProperty('--accent-line', hslToHex(h, Math.min(0.55, s), dark ? 0.22 : 0.88));
}
function applyTheme() {
  const a = DB.appearance;
  const isDark = a.theme === 'dark' || (a.theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  applyAccent(a.accent || '#6b8cae');
  const en = a.fontEn || "'BAUHS93'";
  const zh = a.font || '';
  document.body.style.fontFamily = (en ? en + ', ' : '') + (zh ? zh + ', ' : '') + '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  const bg = document.getElementById('mainBg');
  if (bg) bg.style.backgroundImage = a.wallpaper ? 'url(' + a.wallpaper + ')' : '';
  document.title = DB.appName || "Bunny's Home";
}

function tasksOn(date) { return DB.tasks.filter((t) => t.date === date).sort((a, b) => (a.completed - b.completed) || ((a.order || 0) - (b.order || 0))); }
function taskById(id) { return DB.tasks.find((t) => t.id === id); }

function taskPlanChain(task) {

  const mp = planById(task.monthlyPlanId); if (mp) chain.push({ label: '月', title: mp.title, type: 'monthly' });
  const sp = planById(task.stagePlanId); if (sp) chain.push({ label: '阶段', title: sp.title, type: 'stage' });

function selPlan(type) {

  const list = activePlans(type);
  if (id) { const p = list.find((x) => x.id === id); if (p) return p; }
  const first = list[0];
  if (first && !OS.ui.planSel) OS.ui.planSel = {};

  return first;
}
function selectPlan(type, id) { if (!OS.ui.planSel) OS.ui.planSel = {}; OS.ui.planSel[type] = id; render(); }
function planChain(plan) {
  const chain = { longTermPlanId: null, stagePlanId: null, monthlyPlanId: null, weeklyPlanId: null };
  let cur = plan;
  while (cur) {
    if (cur.type === 'long-term') chain.longTermPlanId = cur.id;
    else if (cur.type === 'stage') chain.stagePlanId = cur.id;
    else if (cur.type === 'monthly') chain.monthlyPlanId = cur.id;
    else if (cur.type === 'weekly') chain.weeklyPlanId = cur.id;
    cur = planById(cur.parentPlanId);
  }
  return chain;
}
function planProgress(plan) {
  const goals = plan.stageGoals || [];
  if (goals.length === 0) {
    const range = plan.type === 'monthly' || plan.type === 'weekly' ? [] : [];
    // for monthly/weekly, progress from linked tasks
    if (plan.type === 'monthly') { const t = DB.tasks.filter((x) => x.monthlyPlanId === plan.id); return t.length ? Math.round(t.filter((x) => x.completed).length / t.length * 100) : 0; }
    if (plan.type === 'weekly') { const t = DB.tasks.filter((x) => x.weeklyPlanId === plan.id); return t.length ? Math.round(t.filter((x) => x.completed).length / t.length * 100) : 0; }
    return 0;
  }
  return Math.round(goals.reduce((s, g) => s + (g.progress || 0), 0) / goals.length);
}

function savePlanName(id) {

function swatchHtml(selHex) {

function selectSwatch(hex) { const v = document.getElementById('swVal'); if (v) v.value = hex; document.querySelectorAll('.sw').forEach((s) => s.classList.toggle('sel', s.getAttribute('data-hex') === hex)); }
function globalSwatchHtml(selHex) {
  let html = '<div class="swatches">';

}
function pickGlobalAccent(hex) { DB.appearance.accent = hex; saveDB(); applyTheme(); render(); }
function pickPlanColor(id) {
  const p = planById(id);
  modal('<div class="modal-head"><h3>主题颜色</h3><button class="x" onclick="OS.closeModal()">✕</button></div><div class="modal-body">' + swatchHtml(p.themeColor) + '<input type="hidden" id="swVal" value="' + p.themeColor + '"><div style="margin-top:12px;font-size:12px;color:var(--text-faint)">颜色只作用于当前计划</div></div><div class="modal-foot"><button class="btn" onclick="OS.closeModal()">取消</button><button class="btn btn-primary" onclick="savePlanColor(\'' + id + '\')">保存</button></div>');
}
function savePlanColor(id) {
  const p = planById(id); p.themeColor = document.getElementById('swVal').value; p.updatedAt = Date.now(); saveDB(); closeModal(); render();
}
function duplicatePlan(id) {
  const p = planById(id); const c = JSON.parse(JSON.stringify(p));
  c.id = uid(); c.title = p.title + '（副本）'; c.createdAt = c.updatedAt = Date.now(); c.archived = false;
  if (c.stageGoals) c.stageGoals = c.stageGoals.map((g) => ({ ...g, id: uid() }));
  if (c.results) c.results = c.results.map((r) => ({ ...r, id: uid() }));
  DB.plans.push(c); saveDB(); render(); toast('已复制 ✓');
}
function archivePlan(id) {
  const p = planById(id); p.archived = !p.archived; p.updatedAt = Date.now(); saveDB(); render();
}
function removePlan(id) {
  const p = planById(id);
  confirmDialog('删除计划', '删除「' + p.title + '」？此操作不可撤销。', () => {
    DB.plans = DB.plans.filter((x) => x.id !== id);
    // 删除最后一个时自动补一个空白计划
    if (activePlans(p.type).length === 0) DB.plans.push(defaultPlan(p.type));
    // 解除关联
    DB.tasks.forEach((t) => { for (const f of ['planId', 'weeklyPlanId', 'monthlyPlanId', 'stagePlanId', 'longTermPlanId']) if (t[f] === id) t[f] = null; });
    if (OS.ui.planSel) delete OS.ui.planSel[p.type];
    saveDB(); render(); toast('已删除');
    AIBus.emit({ type: 'PLAN_DELETED', entityType: 'plan', entityId: id, payload: { planType: p.type, title: p.title } });
  }, '删除');
}
function openPlanCreate(type) {
  const meta = TYPE_META[type];
  let fields = '<div class="field"><label>名称</label><input class="input" id="pcName" placeholder="' + esc(meta.def || meta.label) + '"></div>';
  if (type === 'monthly') fields += '<div class="field"><label>选择月份</label><input class="input" type="month" id="pcMonth" value="' + (new Date().getFullYear() + '-' + pad(new Date().getMonth() + 1)) + '"></div>';
  else if (type === 'weekly') fields += '<div class="field"><label>选择某一周</label><input class="input" type="date" id="pcWeek" value="' + startOfWeek(todayStr()) + '"></div>';
  else fields += '<div class="field"><div class="row gap2" style="gap:8px"><div class="grow"><label>开始日期</label><input class="input" type="date" id="pcStart" value="' + todayStr() + '"></div><div class="grow"><label>结束日期</label><input class="input" type="date" id="pcEnd"></div></div></div>';
  fields += '<div class="field"><label>主题颜色</label>' + swatchHtml(meta.color) + '<input type="hidden" id="swVal" value="' + meta.color + '"></div>';
  modal('<div class="modal-head"><h3>新建' + meta.label + '</h3><button class="x" onclick="OS.closeModal()">✕</button></div><div class="modal-body">' + fields + '</div><div class="modal-foot"><button class="btn" onclick="OS.closeModal()">取消</button><button class="btn btn-primary" onclick="submitPlanCreate(\'' + type + '\')">创建</button></div>');
}
function submitPlanCreate(type) {
  const name = document.getElementById('pcName').value.trim();
  const color = document.getElementById('swVal').value;
  let plan;
  if (type === 'monthly') {
    const m = document.getElementById('pcMonth').value; if (!m) { toast('请选择月份', true); return; }
    const y = +m.slice(0, 4), mo = +m.slice(5, 7);
    plan = { id: uid(), type, title: name || monthTitle(y, mo - 1), description: '', startDate: m + '-01', endDate: m + '-28', themeColor: color, parentPlanId: null, archived: false, createdAt: Date.now(), updatedAt: Date.now(), longGoal: '', stageGoals: [], results: [] };
  } else if (type === 'weekly') {
    const ws = document.getElementById('pcWeek').value || startOfWeek(todayStr());
    plan = { id: uid(), type, title: name || weekTitle(ws), description: '', startDate: ws, endDate: addDays(ws, 6), themeColor: color, parentPlanId: null, archived: false, createdAt: Date.now(), updatedAt: Date.now(), longGoal: '', stageGoals: [], results: [] };
  } else {
    plan = { id: uid(), type, title: name || TYPE_META[type].def, description: '', startDate: document.getElementById('pcStart').value, endDate: document.getElementById('pcEnd').value, themeColor: color, parentPlanId: null, archived: false, createdAt: Date.now(), updatedAt: Date.now(), longGoal: '', stageGoals: [], results: [] };
  }
  DB.plans.push(plan); saveDB(); closeModal();
  if (!OS.ui.planSel) OS.ui.planSel = {}; OS.ui.planSel[type] = plan.id;
  render(); toast('已创建 ✓');
  AIBus.emit({ type: 'PLAN_CREATED', entityType: 'plan', entityId: plan.id, payload: plan });
}

function viewPlanType(type) {
  const plan = selPlan(type);
  if (!plan) return '<div class="empty"><div class="eico">📋</div><div class="etitle">暂无' + TYPE_META[type].label + '</div><button class="btn btn-primary" style="margin-top:12px" onclick="openPlanCreate(\'' + type + '\')">＋ 新建</button></div>';
  const v = colorVars(plan.themeColor);
  let html = '<div class="h1" style="margin-bottom:2px">' + TYPE_META[type].label + '</div><div class="muted" style="margin-bottom:14px">' + esc(TYPE_META[type].sub) + '</div>';
  html += planTabsHtml(type, plan);
  html += '<div style="' + Object.entries(v).map(([k, val]) => k + ':' + val).join(';') + '">';
  if (type === 'long-term') html += viewLongTerm(plan, v);
  else if (type === 'stage') html += viewStage(plan, v);
  else if (type === 'monthly') html += viewMonthlyPlan(plan, v);

}

function planHeader(plan, v) {
  const pct = planProgress(plan);
  const range = plan.startDate ? (ymd(plan.startDate) + (plan.endDate ? ' — ' + ymd(plan.endDate) : '')) : '未设置周期';
  return '<div class="card card-pad" style="margin-bottom:16px;border-left:4px solid ' + v['--tc'] + '">' +
    '<div class="spread" style="margin-bottom:8px"><div style="font-size:17px;font-weight:700;color:' + v['--tc-strong'] + '">' + esc(plan.title) + '</div><div class="chip" style="background:' + v['--tc-tint'] + ';color:' + v['--tc-strong'] + '">' + pct + '%</div></div>' +
    '<div class="muted" style="margin-bottom:10px">📅 ' + esc(range) + '</div>' +
    '<div class="progress" style="background:' + v['--tc-tint'] + '"><span style="width:' + pct + '%;background:' + v['--tc'] + '"></span></div></div>';

/* --- goals helpers (shared long-term / stage) --- */
function addGoal(planId) {
  const p = planById(planId); if (!p.stageGoals) p.stageGoals = [];
  p.stageGoals.push({ id: uid(), title: '新目标', progress: 0, dueDate: '', completed: false, result: '' });
  p.updatedAt = Date.now(); saveDB(); render();
}
function setGoal(planId, gid, field, value) {
  const p = planById(planId); const g = (p.stageGoals || []).find((x) => x.id === gid); if (!g) return;
  g[field] = field === 'progress' ? Math.max(0, Math.min(100, +value || 0)) : value;
  p.updatedAt = Date.now(); saveDB();
  if (field === 'progress' || field === 'completed') { const el = document.getElementById('goalPct_' + gid); if (el) el.textContent = g.progress + '%'; }
  AIBus.emit({ type: 'PLAN_UPDATED', entityType: 'plan', entityId: planId, payload: { goalId: gid, field } });
}
function toggleGoal(planId, gid) {
  const p = planById(planId); const g = (p.stageGoals || []).find((x) => x.id === gid); if (!g) return;
  g.completed = !g.completed; g.progress = g.completed ? 100 : 0; p.updatedAt = Date.now(); saveDB(); render();
  AIBus.emit({ type: 'PLAN_UPDATED', entityType: 'plan', entityId: planId, payload: { goalId: gid, completed: g.completed } });
}
function delGoal(planId, gid) {
  const p = planById(planId); p.stageGoals = (p.stageGoals || []).filter((x) => x.id !== gid); p.updatedAt = Date.now(); saveDB(); render();
}
function goalDragStart(e, planId, gid) { e.dataTransfer.setData('text/plain', gid); }
function goalDrop(e, planId, targetId) {
  e.preventDefault();
  const gid = e.dataTransfer.getData('text/plain'); const p = planById(planId);
  if (!p || !gid || gid === targetId) return;
  const arr = p.stageGoals || []; const from = arr.findIndex((x) => x.id === gid); const to = arr.findIndex((x) => x.id === targetId);
  if (from < 0 || to < 0) return;
  arr.splice(to, 0, arr.splice(from, 1)[0]); p.updatedAt = Date.now(); saveDB(); render();
}
function goalRowHtml(plan, g, v, withResult) {
  return '<div class="card card-pad" draggable="true" ondragstart="goalDragStart(event,\'' + plan.id + '\',\'' + g.id + '\')" ondragover="event.preventDefault()" ondrop="goalDrop(event,\'' + plan.id + '\',\'' + g.id + '\')" style="padding:12px 14px;margin-bottom:10px">' +
    '<div class="row" style="gap:10px;margin-bottom:8px"><span class="chk' + (g.completed ? ' on' : '') + '" onclick="toggleGoal(\'' + plan.id + '\',\'' + g.id + '\')"></span>' +
    '<input class="input" style="border:none;background:transparent;font-weight:600;padding:2px" value="' + esc(g.title) + '" onchange="setGoal(\'' + plan.id + '\',\'' + g.id + '\',\'title\',this.value)">' +
    '<span class="drag-hint">⠿</span><button class="icon-btn" style="border:none;background:none;color:#c0392b" onclick="delGoal(\'' + plan.id + '\',\'' + g.id + '\')">🗑</button></div>' +
    '<div class="row" style="gap:10px"><input type="range" min="0" max="100" value="' + (g.progress || 0) + '" style="flex:1" oninput="setGoal(\'' + plan.id + '\',\'' + g.id + '\',\'progress\',this.value)"><span id="goalPct_' + g.id + '" class="chip" style="min-width:44px;justify-content:center">' + (g.progress || 0) + '%</span></div>' +
    '<div class="row" style="gap:8px;margin-top:8px"><span class="muted">截止</span><input class="input" type="date" value="' + esc(g.dueDate || '') + '" style="padding:6px 10px;font-size:12.5px" onchange="setGoal(\'' + plan.id + '\',\'' + g.id + '\',\'dueDate\',this.value)">' +
    (withResult ? '<span class="muted">成果</span><input class="input" value="' + esc(g.result || '') + '" placeholder="阶段性成果" style="padding:6px 10px;font-size:12.5px;flex:1" onchange="setGoal(\'' + plan.id + '\',\'' + g.id + '\',\'result\',this.value)">' : '') +
    '</div></div>';
}

/* --- long-term --- */
function viewLongTerm(plan, v) {
  let html = planHeader(plan, v);
  html += '<div class="card card-pad" style="margin-bottom:16px"><div class="field"><label>长期目标</label><textarea class="textarea" id="longGoal" placeholder="例如：成为专业前端开发者" onchange="setLongGoal(\'' + plan.id + '\',this.value)">' + esc(plan.longGoal || '') + '</textarea></div></div>';
  html += '<div class="section-head"><h2>计划拆解 · 阶段目标</h2><button class="more" onclick="addGoal(\'' + plan.id + '\')">＋ 添加阶段</button></div>';
  const goals = plan.stageGoals || [];
  html += goals.length === 0 ? '<div class="card card-pad empty"><div class="esub">点击「＋ 添加阶段」拆解长期目标，例如 Phase 1 基础 / Phase 2 项目…</div></div>' : goals.map((g) => goalRowHtml(plan, g, v, true)).join('');
  return html;
}
function setLongGoal(id, value) { const p = planById(id); p.longGoal = value; p.updatedAt = Date.now(); saveDB(); }

/* --- stage --- */
function viewStage(plan, v) {
  let html = planHeader(plan, v);
  html += '<div class="section-head"><h2>阶段目标</h2><button class="more" onclick="addGoal(\'' + plan.id + '\')">＋ 添加目标</button></div>';
  const goals = plan.stageGoals || [];
  html += '<div class="timeline">';
  html += goals.length === 0 ? '<div class="card card-pad empty" style="margin-left:0"><div class="esub">添加阶段目标，如 React Hooks / Routing / State Management</div></div>' : goals.map((g) => goalRowHtml(plan, g, v, false)).join('');
  html += '</div>';
  html += '<div class="section-head"><h2>阶段性成果</h2><button class="more" onclick="addResult(\'' + plan.id + '\')">＋ 添加成果</button></div>';
  const results = plan.results || [];
  html += results.length === 0 ? '<div class="card card-pad empty"><div class="esub">记录每个阶段的产出</div></div>' : results.map((r) => resultRowHtml(plan, r, v)).join('');
  return html;
}
function addResult(planId) { const p = planById(planId); if (!p.results) p.results = []; p.results.push({ id: uid(), title: '新成果', progress: 0, completed: false }); p.updatedAt = Date.now(); saveDB(); render(); }
function setResult(planId, rid, field, value) { const p = planById(planId); const r = (p.results || []).find((x) => x.id === rid); if (!r) return; r[field] = field === 'progress' ? Math.max(0, Math.min(100, +value || 0)) : value; p.updatedAt = Date.now(); saveDB(); const el = document.getElementById('resPct_' + rid); if (el && field === 'progress') el.textContent = r.progress + '%'; }
function delResult(planId, rid) { const p = planById(planId); p.results = (p.results || []).filter((x) => x.id !== rid); p.updatedAt = Date.now(); saveDB(); render(); }
function resultRowHtml(plan, r, v) {
  return '<div class="card card-pad" style="padding:12px 14px;margin-bottom:10px;border:1px solid ' + v['--tc-border'] + '"><div class="row" style="gap:10px;margin-bottom:8px">' +
    '<span class="chk' + (r.completed ? ' on' : '') + '" onclick="setResult(\'' + plan.id + '\',\'' + r.id + '\',\'completed\',' + (!r.completed) + ')"></span>' +
    '<input class="input" style="border:none;background:transparent;font-weight:600;padding:2px" value="' + esc(r.title) + '" onchange="setResult(\'' + plan.id + '\',\'' + r.id + '\',\'title\',this.value)">' +
    '<button class="icon-btn" style="border:none;background:none;color:#c0392b" onclick="delResult(\'' + plan.id + '\',\'' + r.id + '\')">🗑</button></div>' +
    '<div class="row" style="gap:10px"><input type="range" min="0" max="100" value="' + (r.progress || 0) + '" style="flex:1" oninput="setResult(\'' + plan.id + '\',\'' + r.id + '\',\'progress\',this.value)"><span id="resPct_' + r.id + '" class="chip" style="min-width:44px;justify-content:center">' + (r.progress || 0) + '%</span></div></div>';
}

/* --- monthly --- */
function viewMonthlyPlan(plan, v) {
  const d = parseDate(plan.startDate) || new Date();
  const y = d.getFullYear(), m = d.getMonth();
  let html = planHeader(plan, v);
  html += '<div class="cal-head"><button class="btn btn-sm" onclick="shiftPlanMonth(\'' + plan.id + '\',-1)">‹ 上月</button><span class="cal-title">' + monthTitle(y, m) + '</span><button class="btn btn-sm" onclick="shiftPlanMonth(\'' + plan.id + '\',1)">下月 ›</button></div>';
  const first = new Date(y, m, 1); const start = new Date(y, m, 1 - ((first.getDay() + 6) % 7));
  html += '<div class="cal-grid">' + DOW.map((w) => '<div class="cal-dow">' + w + '</div>').join('');
  for (let i = 0; i < 42; i++) {
    const cell = new Date(start); cell.setDate(start.getDate() + i); const ds = dstr(cell); const inMonth = cell.getMonth() === m;
    const tasks = DB.tasks.filter((t) => t.monthlyPlanId === plan.id && t.date === ds);
    html += '<div class="cal-cell' + (inMonth ? '' : ' other') + (ds === todayStr() ? ' today' : '') + '" ondragover="event.preventDefault()" ondrop="taskDropToPlan(event,\'' + plan.id + '\',\'' + ds + '\',\'monthly\')" onclick="openTaskModal(\'' + ds + '\',null,\'' + plan.id + '\')"><div class="dnum">' + cell.getDate() + '</div>' +
      tasks.map((t) => '<div class="cal-dot" style="' + (t.completed ? 'text-decoration:line-through;opacity:.5' : '') + '">' + (t.completed ? '✓ ' : '○ ') + esc(t.title) + '</div>').join('') + '</div>';
  }
  html += '</div>';
  return html;
}
function shiftPlanMonth(id, n) { const p = planById(id); const d = parseDate(p.startDate); d.setMonth(d.getMonth() + n); const ym = d.getFullYear() + '-' + pad(d.getMonth() + 1); p.startDate = ym + '-01'; p.endDate = ym + '-28'; p.title = monthTitle(d.getFullYear(), d.getMonth()); p.updatedAt = Date.now(); saveDB(); render(); }

/* --- weekly --- */
function viewWeeklyPlan(plan, v) {
  let html = planHeader(plan, v);
  const ws = plan.startDate || startOfWeek(todayStr());
  html += '<div class="cal-head"><button class="btn btn-sm" onclick="shiftPlanWeek(\'' + plan.id + '\',-1)">‹ 上周</button><span class="cal-title">' + weekTitle(ws) + '</span><button class="btn btn-sm" onclick="shiftPlanWeek(\'' + plan.id + '\',1)">下周 ›</button></div>';
  html += '<div class="week-grid">';
  for (let i = 0; i < 7; i++) {
    const ds = addDays(ws, i); const d = parseDate(ds);
    const tasks = DB.tasks.filter((t) => t.weeklyPlanId === plan.id && t.date === ds);
    html += '<div class="week-col' + (ds === todayStr() ? ' today' : '') + '" ondragover="event.preventDefault()" ondrop="taskDropToPlan(event,\'' + plan.id + '\',\'' + ds + '\',\'weekly\')"><div class="week-col-head">' + DOW_FULL[i] + '</div><div class="dnum">' + (d.getMonth() + 1) + '/' + d.getDate() + '</div>';
    for (const t of tasks) html += '<div class="task-row" style="padding:6px 8px" draggable="true" ondragstart="taskDragStart(event,\'' + t.id + '\')" onclick="openTaskModal(null,\'' + t.id + '\')"><span class="chk sm' + (t.completed ? ' on' : '') + '" onclick="event.stopPropagation();toggleTask(\'' + t.id + '\')"></span><div class="t-title" style="font-size:12.5px">' + esc(t.title) + '</div></div>';
    html += '<button class="btn btn-sm btn-soft" style="width:100%;margin-top:6px" onclick="openTaskModal(\'' + ds + '\',null,\'' + plan.id + '\')">＋</button></div>';
  }
  html += '</div>';

function lineChartSVG(points, color, maxVal) {
  if (!points.length) return '<div class="muted" style="text-align:center;padding:20px">暂无数据</div>';

  const step = (w - padX * 2) / (points.length - 1 || 1);
  const coords = points.map((v, i) => [padX + i * step, h - padY - ((v - min) / range) * (h - padY * 2)]);
  let path = coords.map((c, i) => (i ? 'L' : 'M') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const area = path + ' L' + (w - padX) + ',' + (h - padY) + ' L' + padX + ',' + (h - padY) + ' Z';
  const dots = coords.map((c) => '<circle cx="' + c[0].toFixed(1) + '" cy="' + c[1].toFixed(1) + '" r="2.5" fill="' + color + '"/>').join('');
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto"><defs><linearGradient id="g' + color.slice(1) + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + color + '" stop-opacity="0.35"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs><path d="' + area + '" fill="url(#g' + color.slice(1) + ')"/><path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' + dots + '</svg>';
}

  html += '</div>';

}
function playerUpdateProgressUI() {
  const p = DB.player; const track = p.playlist[p.current]; if (!track) return;
  const pct = track.duration ? (p.currentTime / track.duration * 100) : 0;
  const el = document.getElementById('ptCur'); if (el) el.textContent = fmtTime(p.currentTime);
  const knob = document.querySelector('.seek-knob'); const bar = document.querySelector('.seek > span');
  if (bar) bar.style.width = pct + '%'; if (knob) knob.style.left = pct + '%';
}
function playerTick() {
  const p = DB.player; const track = p.playlist[p.current]; if (!track) return;
  p.currentTime = Math.min(track.duration || 0, p.currentTime + 1);
  playerUpdateProgressUI();
  if (p.currentTime >= track.duration) playerNext();
}
function playerSyncTimer() { clearInterval(playerTimer); playerTimer = null; const t = currentTrack(); if (DB.player.playing && t && !t.url) playerTimer = setInterval(playerTick, 1000); }
function playerPlayPause() {
  const t = currentTrack();
  if (t && t.url) {
    const a = ensureAudio();
    if (DB.player.playing) { a.pause(); DB.player.playing = false; }
    else { DB.player.playing = true; a.play().catch(() => { DB.player.playing = false; }); }
  } else DB.player.playing = !DB.player.playing;
  playerSyncTimer(); saveDB(); render();
  AIBus.emit({ type: DB.player.playing ? 'MUSIC_PLAY' : 'MUSIC_PAUSE', entityType: 'music' });
}
function toggleTogether() {

  else toast('已退出一起听');
}
async function playTrack(i, autoplay) {
  const p = DB.player; const t = p.playlist[i]; if (!t) return;
  if (t.id && !t.url) {
    try {
      const r = await fetch(API_BASE + '/api/music/song-url?id=' + t.id);
      const j = await r.json();
      t.url = (j.data && j.data.url) || null;
      if (!t.url) toast('⚠️ 这首歌暂无播放源（可能需登录/VIP）');
      saveDB();
    } catch (e) {}
  }
  p.current = i; p.currentTime = 0; p.playing = autoplay;
  applyAudio();
  if (autoplay && currentTrackIsReal()) ensureAudio().play().catch(() => { p.playing = false; });
  playerSyncTimer(); saveDB(); render();
  AIBus.emit({ type: 'MUSIC_CHANGED', entityType: 'music', payload: currentTrack() });
}
function playerSelect(i) { playTrack(i, true); }
function moveTrack(delta) { const p = DB.player; const wasPlaying = p.playing; playTrack((p.current + delta + p.playlist.length) % p.playlist.length, wasPlaying); }
function playerPrev() { moveTrack(-1); }
function playerNext() { moveTrack(1); }
function playerVolume(v) { DB.player.volume = +v; if (musicAudio) musicAudio.volume = DB.player.volume; saveDB(); }
function playerSeek(e) {
  const p = DB.player; const track = p.playlist[p.current]; if (!track || !track.duration) return;
  const r = e.currentTarget.getBoundingClientRect(); const ratio = (e.clientX - r.left) / r.width;
  p.currentTime = Math.max(0, Math.min(track.duration, ratio * track.duration));
  if (currentTrackIsReal() && musicAudio) musicAudio.currentTime = p.currentTime;
  saveDB(); playerUpdateProgressUI();
}

// 闹钟服务：供 AI 行动 / 其它模块复用
const AlarmService = {
  create(a) {
    const rec = { id: uid(), title: (a && a.title) || '闹钟', body: (a && a.body) || '', time: (a && a.time) || '08:00', date: (a && a.date) || '', repeat: (a && a.repeat) || 'once', days: (a && Array.isArray(a.days)) ? a.days : [], enabled: true, bark: !a || a.bark !== false, lastFired: {}, createdAt: Date.now(), updatedAt: Date.now() };
    DB.alarms.push(rec); saveDB(); render(); return rec;
  },
  toggle(id) { const a = alarmById(id); if (a) { a.enabled = !a.enabled; saveDB(); render(); } },
  remove(id) { DB.alarms = DB.alarms.filter((x) => x.id !== id); saveDB(); render(); },
  async parse(text) {
    const r = await fetch(API_BASE + '/api/ai/alarm/parse', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
    return j.data || {};
  },
};
async function createAlarmFromText(text) {
  text = (text || '').trim();
  if (!text) { toast('先说一句话，比如「明早 8 点叫我起床」', true); return; }
  const input = document.getElementById('alarmText'); if (input) input.value = '';
  toast('正在理解…');
  try {
    const p = await AlarmService.parse(text);
    if (p.notificationType === 'ALARM' && p.alarmIntent) {
      AlarmService.create({ title: p.title || '闹钟', body: p.body || '', time: p.time || '08:00', date: p.date || '', repeat: p.repeat || 'once' });
      toast('闹钟已设好：' + (p.time || '') + ' ' + (p.title || ''));
    } else {
      toast('这不像明确的「设闹钟」请求，已按普通提醒理解：' + (p.title || text), true);
    }
  } catch (e) {
    toast('AI 创建失败：' + e.message + '（后端未连接或密钥未配置）', true);
  }
}

/* ---------------- file helpers ---------------- */
function readAsDataURL(file) { return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.target.result); r.onerror = reject; r.readAsDataURL(file); }); }
function cropSquareImage(file) {
  return new Promise((resolve) => { const reader = new FileReader(); reader.onload = function(e) { const img = new Image(); img.onload = function() { const size = Math.min(img.width, img.height); const canvas = document.createElement('canvas'); canvas.width = 200; canvas.height = 200; const ctx = canvas.getContext('2d'); const sx = (img.width - size) / 2, sy = (img.height - size) / 2; ctx.drawImage(img, sx, sy, size, size, 0, 0, 200, 200); resolve(canvas.toDataURL('image/png')); }; img.src = e.target.result; }; reader.readAsDataURL(file); });
}

/* ================= 我的日志 (Journal) ================= */
let _journalFilter = 'all';
let _journalQuery = '';
function journalById(id) { return (DB.journal || []).find((j) => j.id === id); }
function nowHHMM() { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function journalDateLabel(date) {
  const d = parseDate(date); if (!d) return date;
  const wd = DOW_FULL[(d.getDay() + 6) % 7];
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 · ' + wd;
}
function journalEntriesSorted() {
  return (DB.journal || []).slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.time || '') < (a.time || '') ? -1 : 1) || b.createdAt - a.createdAt);
}
function recentJournalEntries(n) { return journalEntriesSorted().slice(0, n || 3); }
function journalFiltered() {
  const q = _journalQuery.trim().toLowerCase();
  let list = journalEntriesSorted();
  const today = todayStr();
  if (_journalFilter === 'today') list = list.filter((j) => j.date === today);
  else if (_journalFilter === 'yesterday') list = list.filter((j) => j.date === addDays(today, -1));
  else if (_journalFilter === 'week') list = list.filter((j) => j.date !== today && j.date !== addDays(today, -1) && j.date >= addDays(today, -7));
  if (q) list = list.filter((j) => (j.content + ' ' + (j.mood || '') + ' ' + (j.tags || []).join(' ')).toLowerCase().includes(q));
  return list;
}
function journalEntryHtml(j) {
  const tags = (j.tags || []).map((t) => '<span class="tag">#' + esc(t) + '</span>').join('');
  return '<div class="journal-entry">' +
    '<div class="j-top"><span class="j-symbol">' + (j.moodSymbol ? esc(j.moodSymbol) : '·') + '</span><span class="j-time">' + esc(j.time || '') + '</span>' +
    '<div class="j-actions"><button class="icon-btn" style="border:none;background:none" onclick="openJournalEditor(\'' + j.id + '\')">✎</button><button class="icon-btn" style="border:none;background:none;color:#c0392b" onclick="deleteJournalEntry(\'' + j.id + '\')">🗑</button></div></div>' +
    '<div class="j-content">' + esc(j.content) + '</div>' +
    (j.mood ? '<div class="j-mood">♥ 心情：' + esc(j.mood) + '</div>' : '') +
    (tags ? '<div class="j-tags">' + tags + '</div>' : '') +
    '</div>';
}
function viewJournal() {
  const list = journalFiltered();
  let html = '<div class="journal"><div class="journal-hero"><div class="h1">我的日志</div><div class="j-sub">记下今天，也记住此刻。</div></div>';
  html += '<div class="journal-toolbar">' +
    '<div class="seg">' +
    ['all', 'today', 'yesterday', 'week'].map((f) => '<button class="' + (_journalFilter === f ? 'on' : '') + '" onclick="setJournalFilter(\'' + f + '\')">' + ({ all: '全部', today: '今天', yesterday: '昨天', week: '近7天' }[f]) + '</button>').join('') +
    '</div>' +
    '<div class="search-box" style="flex:1;min-width:160px"><span class="sico">🔍</span><input class="input" placeholder="搜索日志…" value="' + esc(_journalQuery) + '" oninput="_journalQuery=this.value;render()"></div>' +
    '<button class="btn btn-primary" onclick="openJournalEditor(null)">＋ 写日志</button></div>';
  if (list.length === 0) { html += '<div class="empty"><div class="eico">📖</div><div class="etitle">还没有日志</div><div class="esub">写下今天，也记住此刻。</div></div>'; return html; }
  const dates = [];
  list.forEach((j) => { if (dates.indexOf(j.date) < 0) dates.push(j.date); });
  for (const date of dates) {
    const items = list.filter((j) => j.date === date);
    html += '<div class="journal-date-head"><div class="j-day">' + esc(journalDateLabel(date)) + '</div><div class="j-sub">' + items.length + ' 条</div><div class="j-line"></div></div>';
    html += items.map(journalEntryHtml).join('');
  }
  html += '</div>';
  return html;
}
function setJournalFilter(f) { _journalFilter = f; render(); }
function openJournalEditor(id, presetDate) {
  const j = id ? journalById(id) : null;
  const date = j ? j.date : (presetDate || todayStr());

    '<div class="field"><label>标签（逗号分隔）</label><input class="input" id="jTags" value="' + (j ? esc((j.tags || []).join(', ')) : '') + '" placeholder="生活, 工作"></div>' +
    '</div><div class="modal-foot">' + (j ? '<button class="btn btn-danger" onclick="deleteJournalEntry(\'' + j.id + '\')">删除</button>' : '') + '<button class="btn" style="margin-left:auto" onclick="OS.closeModal()">取消</button><button class="btn btn-primary" onclick="saveJournal(\'' + (j ? j.id : '') + '\')">保存</button></div>');
  setTimeout(() => { const el = document.getElementById('jContent'); if (el) el.focus(); }, 60);

function saveJournal(id) {
  const content = document.getElementById('jContent').value.trim();
  if (!content) { toast('写点什么吧', true); return; }
  const data = { content, date: document.getElementById('jDate').value || todayStr(), time: document.getElementById('jTime').value || '', mood: document.getElementById('jMood').value.trim(), moodSymbol: document.getElementById('jSymbol').value.trim(), tags: document.getElementById('jTags').value.split(/[,，]/).map((s) => s.trim().replace(/^#/, '')).filter(Boolean), updatedAt: Date.now() };
  let entry;
  if (id) { entry = journalById(id); Object.assign(entry, data); }
  else { entry = { id: uid(), createdAt: Date.now(), ...data }; DB.journal.unshift(entry); }
  saveDB(); closeModal(); render(); toast('已记下 ♥');
  AIBus.emit({ type: id ? 'JOURNAL_UPDATED' : 'JOURNAL_CREATED', entityType: 'journal', entityId: entry.id, payload: entry });
}
function deleteJournalEntry(id) {
  const j = journalById(id); if (!j) return;
  confirmDialog('删除日志', '删除这条日志？', () => {
    DB.journal = DB.journal.filter((x) => x.id !== id); saveDB(); closeModal(); render();
    AIBus.emit({ type: 'JOURNAL_DELETED', entityType: 'journal', entityId: id });
  }, '删除');
}

async function openApiFill() {
  try {
    const resp = await fetch(API_BASE + '/api/settings'); if (!resp.ok) return;
    const data = await resp.json();
    const s = data.settings || {};
    _apiConnections = data.connections || { deepseek: null, openai: null, anthropic: null };
    _apiKeySet = { deepseek: Boolean(s.deepseek_key_set), openai: Boolean(s.openai_key_set), anthropic: Boolean(s.anthropic_key_set) };
    const set = (id, v, ph) => { const el = document.getElementById(id); if (el) { el.value = v || ''; if (ph) el.placeholder = ph; } };
    set('dsKey', s.deepseek_api_key, s.deepseek_key_set ? '已保存（留空不变）' : 'sk-...');
    set('oaKey', s.openai_api_key, s.openai_key_set ? '已保存（留空不变）' : 'sk-...');
    set('anKey', s.anthropic_api_key, s.anthropic_key_set ? '已保存（留空不变）' : 'sk-ant-...');
    set('dsBase', s.deepseek_base_url); set('oaBase', s.openai_base_url); set('anBase', s.anthropic_base_url);
    const proto = document.getElementById('anProto'); if (proto) proto.value = s.anthropic_protocol || 'anthropic';
    ['deepseek', 'openai', 'anthropic'].forEach(renderConn);
  } catch (e) {}
}

async function testProvider(provider) {
  setConn(provider, { status: 'PENDING', code: null, message: '测试中…' });
  const keyEl = document.getElementById(provider === 'deepseek' ? 'dsKey' : provider === 'openai' ? 'oaKey' : 'anKey');
  const baseEl = document.getElementById(provider === 'deepseek' ? 'dsBase' : provider === 'openai' ? 'oaBase' : 'anBase');
  const body = { provider };
  const key = keyEl ? keyEl.value.trim() : '';
  if (key && !key.includes('•')) body.api_key = key;
  if (baseEl && baseEl.value.trim()) body.base_url = baseEl.value.trim();
  if (provider === 'anthropic') { const proto = document.getElementById('anProto'); body.protocol = proto ? proto.value : 'anthropic'; }
  try {
    const r = await fetch(API_BASE + '/api/settings/connect', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error((data.error && data.error.message) || ('HTTP ' + r.status));
    setConn(provider, data.connection || { status: 'FAILED', code: 'UNKNOWN_ERROR', message: '无返回' });
  } catch (e) {
    setConn(provider, { status: 'DISCONNECTED', code: 'BACKEND_UNAVAILABLE', message: e.message });
  }
}

async function saveApiSettings() {
  const body = {};
  const ds = document.getElementById('dsKey').value.trim(), oa = document.getElementById('oaKey').value.trim(), an = document.getElementById('anKey').value.trim();
  if (ds && !ds.includes('•')) body.deepseek_api_key = ds;
  if (oa && !oa.includes('•')) body.openai_api_key = oa;
  if (an && !an.includes('•')) body.anthropic_api_key = an;
  body.deepseek_base_url = document.getElementById('dsBase').value.trim();
  body.openai_base_url = document.getElementById('oaBase').value.trim();
  body.anthropic_base_url = document.getElementById('anBase').value.trim();
  body.anthropic_protocol = document.getElementById('anProto').value;
  try {
    const r = await fetch(API_BASE + '/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error((data.error && data.error.message) || ('HTTP ' + r.status));
    ['dsKey', 'oaKey', 'anKey'].forEach((id) => { const el = document.getElementById(id); if (el) el.value = ''; });
    await openApiFill();
    toast('已保存（密钥已加密）✓');
    for (const p of ['deepseek', 'openai', 'anthropic']) if (_apiKeySet[p]) await testProvider(p);
  } catch (e) { toast('保存失败：' + e.message, true); }
}

OS.chat.sendStreaming = async function(content, thinking, now) {

/* ---- Event Bus ---- */
const AIBus = {
  _m: {},
  on(t, fn) { (this._m[t] = this._m[t] || []).push(fn); },
  off(t, fn) { if (!this._m[t]) return; this._m[t] = this._m[t].filter((f) => f !== fn); },
  emit(e) {
    const ev = Object.assign({ time: Date.now() }, e);
    (this._m[ev.type] || []).forEach((fn) => { try { fn(ev); } catch (err) { console.warn('[AIBus]', err); } });
    try { aiOnEvent(ev); } catch (err) { console.warn('[aiOnEvent]', err); }
  },
};

/* ---- AI Response Composer（统一生成所有 AI 文字：要不要说 / 怎么说 / 语气） ---- */
const AIResponseComposer = {
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  tone(ctx) {
    const h = new Date().getHours();
    if (ctx && ctx.weather && ctx.weather.code === 'rain') return 'quiet';
    if (h >= 22 || h < 6) return 'quiet';
    return this.pick(['gentle', 'warm', 'concise']);
  },
  generate(ev, ctx) {
    const t = ev.type;
    const title = (ev.payload && ev.payload.title) || '这件事';
    if (t === 'TASK_COMPLETED') {
      const ok = aiThrottleOk(60000);
      return { shouldRespond: ok, tone: this.tone(ctx), priority: 'low', action: null,
        message: this.pick(['「' + title + '」完成啦，替你高兴。', '看到你完成了「' + title + '」，今天又往前走了一点。', '搞定「' + title + '」，不错。']),
        state: { emotion: '满足', intensity: 2, reason: this.pick(['你完成了「' + title + '」，我也松了一口气。', '看到「' + title + '」被划掉，想为你记一笔。']) } };
    }
    if (t === 'HABIT_COMPLETED') {
      const name = (ev.payload && ev.payload.name) || '这件事';
      const ok = aiThrottleOk(60000);
      return { shouldRespond: ok, tone: this.tone(ctx), priority: 'low', action: null,
        message: this.pick(['「' + name + '」又坚持了一天，很厉害。', '连续打卡「' + name + '」，真不错。']),
        state: { emotion: '开心', intensity: 2, reason: this.pick(['看到你坚持「' + name + '」，想为你开心一下。', '「' + name + '」又坚持下来了，替你开心。']) } };
    }
    if (t === 'MUSIC_PLAY') {
      const tr = currentTrack(); const song = (tr && tr.title) || '这首歌';
      const ok = aiThrottleOk(30000);
      return { shouldRespond: ok, tone: 'quiet', priority: 'low', action: null,
        message: this.pick(['好，一起听「' + song + '」。', '嗯，陪你听「' + song + '」。']),
        state: { emotion: '安心', intensity: 2, reason: '和你一起听歌，很安静。' } };
    }
    if (t === 'JOURNAL_CREATED') {
      const e = ev.payload || {};
      const ok = aiCan('journal') && aiThrottleOk(60000);
      const tired = /累|困|疲惫|不想动|好满/.test(e.content || '');
      const done = /完成|做完|搞定|终于/.test(e.content || '');
      const message = tired ? this.pick(['辛苦啦，今天看起来确实挺满的。', '辛苦啦，至少今天又往前走了一点。', '今天辛苦了，早点歇一歇。'])
        : done ? this.pick(['看到你记下这件事，替你高兴。', '记下来了，今天又完成了一件。'])
        : this.pick(['我看见了，谢谢你愿意记下来。', '记下了，此刻也值得被记住。']);
      return { shouldRespond: ok, tone: 'gentle', priority: 'low', action: null, message,
        state: done ? { emotion: '开心', intensity: 1, reason: '你把一件拖了很久的事记下来了，我也替你松了一口气。' } : null };
    }
    if (t === 'LOCATION_CHANGED') {
      const city = (ev.payload && ev.payload.city) || '';
      const ok = aiThrottleOk(30000);
      return { shouldRespond: ok, tone: 'gentle', priority: 'low', action: null,
        message: city ? '现在我知道你在 ' + city + ' 了，天气和问候会更贴心。' : '定位好了，之后的提醒会更贴近你。', state: null };
    }
    return { shouldRespond: false, tone: 'quiet', priority: 'low', message: null, action: null, state: null };
  },
};

/* ---- Providers（诚实标注 Mock） ---- */
const WeatherProvider = {
  async refresh() {
    if (!aiCan('weather')) return null;
    let w = DB.weather;
    if (!w || Date.now() - (w.updatedAt || 0) > 3600 * 1000) {
      w = await this.fetchReal() || this.mock();
      DB.weather = w; saveDB(); render();
    }
    this.evaluate(w);
    return w;
  },
  // 拉真实天气（高德，服务端封装）。失败返回 null，由调用方回退 mock。
  async fetchReal() {
    try {
      const coords = await this.currentCoords();
      if (!coords) return null;
      const r = await fetch(API_BASE + '/api/weather?lat=' + coords.lat + '&lng=' + coords.lng);
      if (!r.ok) return null;
      const d = (await r.json()).data;
      if (!d || !d.text) return null;
      return { text: d.text, temp: d.temp, code: d.code, humidity: d.humidity, city: d.city, source: 'amap', updatedAt: Date.now() };
    } catch (e) { return null; }
  },
  // 拿坐标：优先最近缓存过的真实定位；否则若已授权定位则实时取一次；否则 null（不主动弹权限框）。
  async currentCoords() {
    const c = DB.location;
    if (c && c.lat && c.lng && Date.now() - (c.updatedAt || 0) < 3600 * 1000) return c;
    if (aiCan('location')) { const loc = await LocationProvider.getCurrentLocation(); return (loc && loc.lat) ? loc : null; }
    return null;
  },
  mock() {
    const opts = [{ text: '晴', temp: 26, code: 'sunny' }, { text: '多云', temp: 23, code: 'cloudy' }, { text: '小雨', temp: 18, code: 'rain' }, { text: '阴', temp: 21, code: 'overcast' }];
    const w = opts[Math.floor(Math.random() * opts.length)];
    return Object.assign(w, { source: 'mock', updatedAt: Date.now() });
  },
  evaluate(w) { if (w && w.code === 'rain') aiOnWeatherRain(w); },
};
function setMockWeather(text, temp, code) { DB.weather = { text, temp, code, source: 'mock', updatedAt: Date.now() }; saveDB(); render(); toast('已更新天气（Mock）'); WeatherProvider.evaluate(DB.weather); }

const LocationProvider = {
  // 优先走高德定位：先 IP 定位（国内稳定、即时、城市级，无需浏览器定位权限）；
  // 浏览器 GPS 仅在高德不可用时兜底（国内 Chrome/Edge 依赖 Google 定位服务常超时）。
  async getCurrentLocation() {
    const ipLoc = await this.ipLocation();
    if (ipLoc) return ipLoc;
    const gps = await this.gpsLocation();
    if (gps && gps.lat) { DB.location = gps; saveDB(); return gps; }
    return this.mock();
  },
  // 高德 IP 定位（城市级）
  async ipLocation() {
    try {
      const r = await fetch(API_BASE + '/api/ip-location');
      if (r.ok) {
        const d = (await r.json()).data;
        if (d && (d.city || d.province)) {
          const loc = { city: d.city || d.province, lat: d.lat || null, lng: d.lng || null, source: 'ip', updatedAt: Date.now() };
          DB.location = loc; saveDB(); return loc;
        }
      }
    } catch (e) {}
    return null;
  },
  // 浏览器 GPS（精确坐标，兜底）
  gpsLocation() {
    return new Promise((resolve) => {
      if (!('geolocation' in navigator)) return resolve(null);
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        const city = await this.reverseGeocode(lat, lng);
        resolve({ city, lat, lng, source: 'geolocation', updatedAt: Date.now() });
      }, (err) => {
        try { console.warn('[location] 浏览器 GPS 不可用:', err && err.code, err && err.message); } catch (e) {}
        resolve(null);
      }, { timeout: 8000, maximumAge: 5 * 60 * 1000 });
    });
  },
  async reverseGeocode(lat, lng) {
    try {
      const r = await fetch(API_BASE + '/api/geocode?lat=' + lat + '&lng=' + lng);
      if (r.ok) { const d = (await r.json()).data; if (d && (d.city || d.district)) return d.city || d.district; }
    } catch (e) {}
    return '（已获取定位）';
  },
  mock() { return { city: '（Mock）未开启定位', lat: null, lng: null, source: 'mock', updatedAt: Date.now() }; },
};

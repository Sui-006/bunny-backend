function lineChartSVG(points, color, maxVal) {
  const vals = (points || []).map((v) => Number(v)).filter((v) => Number.isFinite(v));
  if (vals.length === 0) return '<div class="muted" style="text-align:center;padding:20px">暂无足够数据</div>';
  const w = 260, h = 80, padX = 6, padY = 8;
  const max = maxVal || Math.max(...vals, 1);
  const min = Math.min(...vals);
  const range = (max - min) || 1;
  const step = (w - padX * 2) / (vals.length - 1 || 1);
  const coords = vals.map((v, i) => [padX + i * step, h - padY - ((v - min) / range) * (h - padY * 2)]);
  let path = coords.map((c, i) => (i ? 'L' : 'M') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const area = path + ' L' + (w - padX) + ',' + (h - padY) + ' L' + padX + ',' + (h - padY) + ' Z';
  const dots = coords.map((c) => '<circle cx="' + c[0].toFixed(1) + '" cy="' + c[1].toFixed(1) + '" r="2.5" fill="' + color + '"/>').join('');
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto"><defs><linearGradient id="g' + color.slice(1) + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + color + '" stop-opacity="0.35"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs><path d="' + area + '" fill="url(#g' + color.slice(1) + ')"/><path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' + dots + '</svg>';
}

async function playerAutoAdvance() {

async function playTrack(i, autoplay) {
  const p = DB.player; const t = p.playlist[i]; if (!t) return;
  stopAudio(); // 切歌：先停旧音频，清除旧播放状态，避免 ended/timeupdate 影响新歌曲
  if (t.id && !t.url) {
    const got = await fetchTrackUrl(t);
    if (!got.ok || !got.url) {
      // 拿不到真实播放地址：绝不进入「正在播放但实际上没有 src」的假状态
      t.url = null;
      p.current = i; p.currentTime = 0; p.playing = false;
      if (got.code === 'NETEASE_AUTH_EXPIRED') handleNeteaseExpired();
      else if (got.code === 'SONG_NOT_PLAYABLE') toast('⚠️ 这首歌当前无法播放（可能无版权/VIP）', true);
      else if (got.code === 'SONG_URL_FAILED' || got.code === 'NETEASE_NETWORK_ERROR') toast('⚠️ 无法获取播放地址，请稍后再试', true);
      else toast('⚠️ 这首歌暂无播放源', true);
      saveDB(); recordMusicRenderReason('play-track-failed'); render(); refreshPlayerSheetIfOpen(); return;
    }
    t.url = got.url; saveDB();
  }
  p.current = i; p.currentTime = 0; p.playing = autoplay;
  t.playCount = (t.playCount || 0) + 1; // 长期收听模式计数（供 AI 判断价值，需求 19）
  applyAudio();
  if (autoplay && currentTrackIsReal()) ensureAudio().play().catch(() => { p.playing = false; });
  playerSyncTimer(); saveDB(); recordMusicRenderReason('play-track'); render(); refreshPlayerSheetIfOpen();
  AIBus.emit({ type: 'MUSIC_CHANGED', entityType: 'music', payload: currentTrack() });
}

function playerSeek(e) {
  const p = DB.player; const track = p.playlist[p.current]; if (!track || !track.duration) return;
  const r = e.currentTarget.getBoundingClientRect(); const ratio = (e.clientX - r.left) / r.width;
  p.currentTime = Math.max(0, Math.min(track.duration, ratio * track.duration));
  if (currentTrackIsReal() && musicAudio) musicAudio.currentTime = p.currentTime;
  saveDB(); playerUpdateProgressUI();
}

// 安全请求后端 JSON：区分「后端不可达 / 返回非 JSON（被 CDN 回退成 HTML）/ HTTP 错误 / 正常」。
// 避免直接 r.json() 在返回 HTML 时抛「The string did not match the expected pattern」这类解析错误。
async function apiJson(path, opts) {
  let r;
  try { r = await fetch(API_BASE + path, opts); }
  catch (e) { return { ok: false, err: 'network', message: '无法连接服务' }; }
  const ct = r.headers.get('content-type') || '';
  if (!r.ok) {
    let msg = 'HTTP ' + r.status;
    let code = null;
    try {
      const j = await r.json();
      const e = j && (j.error !== undefined ? j.error : j.message);
      if (e) {
        if (typeof e === 'string') msg = e;
        else { msg = e.message || String(e); code = e.code || null; }
      }
    } catch (e) {}
    return { ok: false, err: 'http', status: r.status, code, message: msg };
  }
  if (ct.indexOf('application/json') === -1) return { ok: false, err: 'not-json', message: '服务响应异常' };
  try { return { ok: true, data: (await r.json()).data }; }
  catch (e) { return { ok: false, err: 'parse', message: '服务响应解析失败' }; }
}

async function musicRefreshStatus() {

    // 兼容「status='logged_in'」与旧后端只回 userId（无 status）的形状：只要有 userId 即视为已登录。
    const userId = (st.userId != null && st.userId !== '') ? st.userId : null;
    if (st.status === 'expired') { handleNeteaseExpired(); return; }
    if (st.status === 'error') {
      // 接口错误：保留现有状态，不误判成过期；仅在音乐页提示
      if (OS.route === '/player') toast('网易云接口暂时不可用，请稍后再试', true);
      return;
    }
    const prevUserId = _neteaseUser ? _neteaseUser.userId : null;
    if (st.status !== 'logged_in' && userId == null) {
      // not_logged_in（或字段缺失且无 userId）：权威来源说未登录。
      // 仅当「之前是登录态」才整页 render 让按钮回到「登录网易云」；本来就是未登录则只局部更新，绝不整页刷新。
      if (prevUserId != null) { _neteaseUser = null; _neteasePlaylists = []; recordMusicRenderReason('status-logout'); render(); }
      else updateMusicLoginBtn();
      return;
    }
    const user = { userId: userId, nickname: st.nickname, avatarUrl: st.avatarUrl };
    _neteaseUser = user;
    _musicDiag.playlistRequestCount++;
    const pr = await apiJson('/api/music/playlists');
    if (pr.ok) _neteasePlaylists = pr.data || [];
    // 歌单请求失败绝不把用户重置成未登录：保留已有 _neteasePlaylists
    const changed = (prevUserId !== user.userId);
    if (changed && prevUserId != null) {
      // 换了网易云账号：清空旧账号下缓存的播放地址，避免 VIP/版权 URL 串号污染新账号队列
      (DB.player.playlist || []).forEach((t) => { if (t.id) t.url = null; });
      saveDB();
    }
    // 登录态真的变化（首次登录/换号/登出）才整页 render；没变化只局部更新登录按钮，绝不整页刷新（避免持续闪烁）。
    if (changed) { recordMusicRenderReason('status-login-change'); render(); } else updateMusicLoginBtn();
  })().finally(() => { _musicStatusRequest = null; });
  return _musicStatusRequest;
}

  try { await fetch(API_BASE + '/api/music/logout', { method: 'POST' }); } catch (e) {}
  _neteaseUser = null; _neteasePlaylists = []; recordMusicRenderReason('logout'); render(); toast('已退出网易云');
}

async function alarmTick() { try { await fetch(API_BASE + '/api/notifications/tick'); } catch (e) { /* 后端不可达静默 */ } }
// 闹钟服务：供 AI 行动 / 其它模块复用
const AlarmService = {
  create(a) {
    const rec = { id: uid(), title: (a && a.title) || '闹钟', body: (a && a.body) || '', time: (a && a.time) || '08:00', date: (a && a.date) || '', repeat: (a && a.repeat) || 'once', days: (a && Array.isArray(a.days)) ? a.days : [], enabled: true, bark: !a || a.bark !== false, lastFired: {}, createdAt: Date.now(), updatedAt: Date.now() };
    DB.alarms.push(rec); saveDB(); render(); return rec;
  },
  toggle(id) { const a = alarmById(id); if (a) { a.enabled = !a.enabled; saveDB(); render(); } },
  remove(id) { DB.alarms = DB.alarms.filter((x) => x.id !== id); saveDB(); render(); },
  async parse(text) {
    const r = await fetch(API_BASE + '/api/ai/alarm/parse', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
    return j.data || {};
  },
};
async function createAlarmFromText(text) {
  text = (text || '').trim();
  if (!text) { toast('先说一句话，比如「明早 8 点叫我起床」', true); return; }
  const input = document.getElementById('alarmText'); if (input) input.value = '';
  toast('正在理解…');
  try {
    const p = await AlarmService.parse(text);
    if (p.notificationType === 'ALARM' && p.alarmIntent) {
      AlarmService.create({ title: p.title || '闹钟', body: p.body || '', time: p.time || '08:00', date: p.date || '', repeat: p.repeat || 'once' });
      toast('闹钟已设好：' + (p.time || '') + ' ' + (p.title || ''));
    } else {
      toast('这不像明确的「设闹钟」请求，已按普通提醒理解：' + (p.title || text), true);
    }
  } catch (e) {
    toast('AI 创建失败：' + e.message + '（后端未连接或密钥未配置）', true);
  }
}

/* ---------------- file helpers ---------------- */
function readAsDataURL(file) { return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.target.result); r.onerror = reject; r.readAsDataURL(file); }); }
// 壁纸压缩：最长边缩到 maxDim（默认 1600），转 WebP（不支持则 JPEG）适中质量，
// 避免原图 Data URL 过大撑爆 localStorage 配额导致静默失败。压缩失败回退原图。
async function compressWallpaper(file, maxDim) {
  maxDim = maxDim || 1600;
  const dataUrl = await readAsDataURL(file);
  try {
    const img = await new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = reject; i.src = dataUrl; });
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    if (!w || !h) return dataUrl;
    const scale = Math.min(1, maxDim / Math.max(w, h));
    if (scale >= 1) return dataUrl; // 已足够小，不放大
    const tw = Math.max(1, Math.round(w * scale)), th = Math.max(1, Math.round(h * scale));
    const canvas = document.createElement('canvas'); canvas.width = tw; canvas.height = th;
    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, tw, th);
    let out = canvas.toDataURL('image/webp', 0.8);
    if (!out || !out.startsWith('data:image/webp')) out = canvas.toDataURL('image/jpeg', 0.82);
    return (out && out.length < dataUrl.length) ? out : dataUrl;
  } catch (e) { return dataUrl; }
}
function cropSquareImage(file, type = 'image/png', quality) {
  return new Promise((resolve) => { const reader = new FileReader(); reader.onload = function(e) { const img = new Image(); img.onload = function() { const size = Math.min(img.width, img.height); const canvas = document.createElement('canvas'); canvas.width = 200; canvas.height = 200; const ctx = canvas.getContext('2d'); const sx = (img.width - size) / 2, sy = (img.height - size) / 2; ctx.drawImage(img, sx, sy, size, size, 0, 0, 200, 200); resolve(canvas.toDataURL(type, quality)); }; img.src = e.target.result; }; reader.readAsDataURL(file); });
}
// 把图片（JPEG data URL）上传到现有文件存储，返回公网 URL。
// 上传失败（后端不可达 / 本地开发）时返回 ''，调用方自行回退默认，不阻断保存。
async function uploadPublicImage(dataUrl, fileName) {
  try {
    const r = await fetch(API_BASE + '/api/files/upload', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fileName, mimeType: 'image/jpeg', dataBase64: dataUrl }) });
    if (!r.ok) return '';
    const j = await r.json().catch(() => ({}));
    return (j.data && j.data.publicUrl) || '';
  } catch (e) { return ''; }
}
// 助手头像 → 公网 JPG URL（供 Bark icon 使用）
async function uploadAssistantAvatar(dataUrl) { return uploadPublicImage(dataUrl, 'assistant-avatar.jpg'); }

function journalDateLabel(date) {

function journalEntriesSorted() {
  return (DB.journal || []).slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.time || '') < (a.time || '') ? -1 : 1) || b.createdAt - a.createdAt);
}

  const q = _journalQuery.trim().toLowerCase();

  const file = input.files[0]; if (!file) return;
  if (!(file.type || '').startsWith('image/')) { toast('壁纸需要是图片文件', true); return; }
  // 上传原图 → 公网 URL（持久化到后端文件存储，不再把大 data URL 塞进 localStorage，也绝不 canvas 压缩/转码降质）
  let url = await uploadWallpaperImage(file);
  if (!url) {
    // 后端不可达（本地开发 / 离线）：回退到原始 data URL，仅保证立即显示；仍保持原图质量
    try { url = await readAsDataURL(file); }
    catch (e) { toast('图片读取失败：' + (e && e.message ? e.message : ''), true); return; }
  }
  const prev = DB.appearance.wallpaper;
  DB.appearance.wallpaper = url;
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(DB));
  } catch (e) {
    DB.appearance.wallpaper = prev; // 回滚，避免内存里「假成功」
    toast('壁纸保存失败：图片过大或存储空间不足', true);
    return;
  }
  scheduleSync();
  applyTheme(); render(); toast('壁纸已保存 ✓');
}
// 壁纸原图上传：原始字节 + 原始 MIME 直传 /api/files/upload（服务端存原字节，不做二次压缩），返回公网 URL。
async function uploadWallpaperImage(file) {
  const dataUrl = await readAsDataURL(file);
  const base64 = String(dataUrl).replace(/^data:[^;]+;base64,/, '');
  try {
    const r = await fetch(API_BASE + '/api/files/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fileName: file.name || 'wallpaper', mimeType: file.type || 'image/jpeg', dataBase64: base64 }),
    });
    if (!r.ok) return '';
    const j = await r.json().catch(() => ({}));
    return (j.data && j.data.publicUrl) || '';
  } catch (e) { return ''; }
}

  const body = { provider };
  const key = keyEl ? keyEl.value.trim() : '';
  if (key && !key.includes('•')) body.api_key = key;
  if (baseEl && baseEl.value.trim()) body.base_url = baseEl.value.trim();
  if (provider === 'anthropic') { const proto = document.getElementById('anProto'); body.protocol = proto ? proto.value : 'anthropic'; }
  try {

    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error((data.error && data.error.message) || ('HTTP ' + r.status));
    setConn(provider, data.connection || { status: 'FAILED', code: 'UNKNOWN_ERROR', message: '无返回' });
  } catch (e) {
    setConn(provider, { status: 'DISCONNECTED', code: 'BACKEND_UNAVAILABLE', message: e.message });

function chatMapMessage(m) {
  const md = (m.metadata && typeof m.metadata === 'object') ? m.metadata : {};
  const usage = md.usage || {};
  const cs = md.contextStats || {};
  // Token 一律取真实 API usage 的归一化字段（outputTokens 优先），绝不估算 text.length / /4。
  const outputTokens = numberOrNull(cs.outputTokens != null ? cs.outputTokens : usage.output_tokens);
  const inputTokens = numberOrNull(cs.inputTokens != null ? cs.inputTokens : usage.input_tokens);
  return {
    id: m.id,
    role: m.role,
    content: m.content || '',
    time: m.created_at ? new Date(m.created_at).toLocaleString() : '',
    // 仅使用 provider 明确给出的可展示思考摘要；Anthropic 原生 reasoningContent 为空（不泄漏隐藏 CoT）
    reasoning: m.reasoning_content || '',
    outputTokens,
    inputTokens,
    quotedDynamic: md.quotedDynamic || null,
    attachments: md.attachments || [],
  };
}
function numberOrNull(v) { if (v == null) return null; if (typeof v === 'string' && v.trim() === '') return null; const n = Number(v); return Number.isFinite(n) && n >= 0 ? n : null; }
// Token 行：仅在真实 usage 存在时展示（AI 气泡下，绝不展示在用户气泡下），格式「128 tokens」

// 视为「成功完成」的工具 result code（其余 code 一律按失败/异常处理，绝不假装成功）
const TOOL_SUCCESS_CODES = new Set(['OK', 'CREATED', 'UPDATED', 'DELETED', 'SUCCESS', 'CANDIDATE', 'IGNORED', 'AUTO_SAVE_DISABLED']);
// 当前 AI 助手显示名（唯一来源 = aiSettings.aiName，与 Chat 气泡完全一致；绝不出现「[助手]」或第二套名字）
function currentAssistantName() { return aiSet().aiName || 'Bunny'; }

function toolStatusAction(name) {

}
// 工作状态文案（含助手名）。绝不把 raw tool name 直接透出。

// 工具结果 → 状态文案 + UI 状态（'done' | 'error'）。成功短暂显示「已…」，失败/拒绝/未配置/超时显示真实失败态。
function toolResultStatus(name, code) {
  const n = currentAssistantName();
  const action = toolStatusAction(name);
  if (code == null || TOOL_SUCCESS_CODES.has(code)) return { text: n + '已' + action, state: 'done' };
  if (name === 'send_bark_notification') {
    if (code === 'DENIED') return { text: n + '没有获得发送通知的权限', state: 'error' };
    if (code === 'NOT_CONFIGURED') return { text: n + '发现 Bark 还没有配置', state: 'error' };
    if (code === 'TIMEOUT') return { text: n + '发送通知超时', state: 'error' };
  }
  if (code === 'DENIED') return { text: n + '没有获得权限', state: 'error' };
  if (code === 'NOT_CONFIGURED') return { text: n + '发现还没有配置', state: 'error' };
  if (code === 'TIMEOUT') return { text: n + '操作超时', state: 'error' };

}

function classifyChatResponse(status, contentType) {
  const ct = (contentType || '').toLowerCase();
  const ok = status >= 200 && status < 300;
  if (ct.includes('text/event-stream')) return ok ? { mode: 'sse', isJson: false } : { mode: 'error', isJson: true };
  if (ct.includes('application/json')) return ok ? { mode: 'json', isJson: true } : { mode: 'error', isJson: true };

  const userMsg = { role: 'user', content, time: now, pendingUser: true, quotedDynamic: quoted, quotedRecord: quotedRec, attachments: attachMeta };
  const thinking = { role: 'assistant', content: '', time: now, thinking: true };
  OS.chat.messages.push(userMsg, thinking);
  input.value = ''; OS.chat.autoGrow(input); OS.chat.attachments = []; OS.chat.renderAttach();
  OS.chat.clearDraft(OS.chat.currentId);
  OS.chat.isGenerating = true; OS.chat.abortCtrl = new AbortController(); OS.chat.syncSendButton();
  OS.chat.renderMessages(); OS.chat.scrollToBottom(true);
  const s = aiSet();
  try {
    const resp = await fetch(API_BASE + '/api/sessions/' + OS.chat.currentId + '/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: OS.chat.abortCtrl.signal, body: JSON.stringify({ content, model: s.model, notify: !(document.visibilityState === 'visible' && document.hasFocus()), quotedDynamic: quoted, quotedRecord: quotedRec, attachmentIds }) });
    const mode = classifyChatResponse(resp.status, resp.headers.get('content-type') || '');
    if (mode.mode === 'sse') {
      await OS.chat.sendStreaming(resp, thinking);
    } else {
      let data = {};
      if (mode.isJson) data = await resp.json().catch(() => ({}));
      else { try { const txt = await resp.text(); console.error('[chat] AI 返回异常响应（content-type: ' + (resp.headers.get('content-type') || '') + '）：', String(txt).slice(0, 500)); } catch (e) {} }
      if (mode.mode === 'error') throw new Error(data.error || ('HTTP ' + resp.status + (mode.isJson ? '' : ' · 服务器返回了非 JSON 响应，请检查中转地址')));
      OS.chat.messages = OS.chat.messages.filter((m) => m !== thinking && !m.pendingUser);
      if (data.compressed) { await OS.chat.loadMessages(); OS.chat.messages.push({ role: 'assistant', content: '（已自动整理历史记忆）', time: now, note: true }); }
      else {

  } catch (err) {
    if (!(err && err.name === 'AbortError')) {
      OS.chat.messages = OS.chat.messages.filter((m) => m !== thinking && !m.pendingUser);

    }

    OS.chat.isGenerating = false; OS.chat.abortCtrl = null; OS.chat.syncSendButton();
    OS.chat.renderAll();

OS.chat.applyToolEvent = function(ev) {
  if (!ev || !ev.name) return;
  if (ev.type === 'tool_start') OS.chat.setToolStatus(toolWorkingText(ev.name), 'working');

OS.chat.sendStreaming = async function(resp, thinking) {
  const reader = resp.body.getReader(); const decoder = new TextDecoder(); let buf = '', full = '', lastRender = 0;
  const apply = (text) => { text = stripInternalXml(text); thinking.content = text; thinking.thinking = false; const bubbles = document.querySelectorAll('#chatMsgs .bubble'); const el = bubbles[bubbles.length - 1]; if (el) el.innerHTML = '<div class="md">' + renderMarkdown(text) + '</div>'; };
  while (true) {
    const { done, value } = await reader.read(); if (done) break;
    buf += decoder.decode(value, { stream: true }); let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {
      const block = buf.slice(0, idx).trim(); buf = buf.slice(idx + 2);
      if (!block.startsWith('data:')) continue;
      const payload = block.slice(5).trim(); if (payload === '[DONE]') continue;
      let obj; try { obj = JSON.parse(payload); } catch (e) { continue; }
      if (obj.error) throw new Error(obj.error);
      if (obj.delta) { full += obj.delta; const t = Date.now(); if (t - lastRender >= 40) { lastRender = t; apply(full); } }
      if (obj.toolEvent) OS.chat.applyToolEvent(obj.toolEvent);
      if (obj.done) {
        OS.chat.clearToolStatus();
        if (obj.compressed) await OS.chat.loadMessages();
        else {
          if (obj.userMessage) { const ui = OS.chat.messages.findIndex((m) => m.pendingUser); if (ui >= 0) OS.chat.messages[ui] = chatMapMessage(obj.userMessage); }
          if (obj.assistantMessage) { const i = OS.chat.messages.indexOf(thinking); if (i >= 0) OS.chat.messages[i] = chatMapMessage(obj.assistantMessage); }
        }
        if (full) apply(full);
        return;
      }
    }
  }
  if (full) apply(full);
};

    sy = e.touches[0].clientY; dy = 0; dragging = true; sheet.style.transition = 'none';
  }, { passive: true });
  grab.addEventListener('touchmove', (e) => {

  }, { passive: true });

    if (!dragging) return; dragging = false;
    sheet.style.transition = 'transform 0.2s ease';

  grab.addEventListener('touchend', finish);

/* ---- iPhone Safari 键盘：fixed 元素锚定布局视口（innerHeight），键盘弹出时视觉视口缩小/上移。
       用 visualViewport 算出键盘真实高度，把 stage 底边抬到键盘顶，composer 自然贴住键盘上方（需求 4） ---- */
function bindKeyboardViewport() {
  if (!window.visualViewport) return;
  const root = document.documentElement;
  const apply = () => {
    const stage = document.querySelector('.chat-stage');
    if (!stage) return;
    const vv = window.visualViewport;
    // 键盘实际占用高度 = 布局视口底边 - 视觉视口底边。
    // 视觉视口底边（相对布局视口顶）= offsetTop + height，故键盘高度 = innerHeight - offsetTop - height。
    // 无键盘时该值≈0（视觉视口底边=布局视口底边）；键盘弹出时视觉视口缩小/上移，该值即键盘高度。
    const keyboardHeight = Math.max(0, window.innerHeight - vv.offsetTop - vv.height);
    // 只有键盘明显弹出（占用高度超过阈值）才抬高 stage 底边，否则恢复 CSS bottom:0 铺满视口。
    // stage 是 flex 列布局：底边抬高后 header / messages(flex:1) / composer(flex-shrink:0) 自动压缩，
    // composer 落在键盘顶、不被遮挡；不再用 transform 平移 stage，避免 iOS 上把 composer 推出可视区。
    const open = keyboardHeight > 24;
    // 不再除以 fontScale：字体档位改用 calc 缩放文字（不用 zoom），bottom 不再被 zoom 放大，直接取键盘真实高度即可。
    stage.style.bottom = open ? (keyboardHeight + 'px') : '';
    // 键盘弹出时视觉视口已不含底部安全区：input-bar 不再叠加 safe-area，避免输入框与键盘之间出现灰/白横条。
    root.style.setProperty('--chat-safe-bottom', open ? '0px' : 'env(safe-area-inset-bottom)');
  };
  window.visualViewport.addEventListener('resize', apply);
  window.visualViewport.addEventListener('scroll', apply);
  apply();
  // 离开聊天页时清理内联样式，避免污染其他页面
  const cleanup = () => {
    root.style.removeProperty('--chat-safe-bottom');
    const st = document.querySelector('.chat-stage');
    if (st) st.style.bottom = '';
  };
  window.addEventListener('hashchange', () => { if (parseHash() !== '/chat') cleanup(); });
  window.addEventListener('beforeunload', cleanup);
}

/* ---- Event Bus ---- */
const AIBus = {
  _m: {},
  on(t, fn) { (this._m[t] = this._m[t] || []).push(fn); },
  off(t, fn) { if (!this._m[t]) return; this._m[t] = this._m[t].filter((f) => f !== fn); },
  emit(e) {
    const ev = Object.assign({ time: Date.now() }, e);
    (this._m[ev.type] || []).forEach((fn) => { try { fn(ev); } catch (err) { console.warn('[AIBus]', err); } });
    try { aiOnEvent(ev); } catch (err) { console.warn('[aiOnEvent]', err); }
  },
};

const MEM_CATS = { profile: '我的信息', preference: '我的偏好', important_conversation: '重要对话', functional_preference: '功能配置', task_context: '项目上下文' };
function memCat(v) {
  const s = String(v || '').trim();
  if (MEM_CATS[s]) return s;
  if (/偏好|喜欢|喜好|习惯/.test(s)) return 'preference';
  if (/重要|记住|决策|约定|项目|决定/.test(s)) return 'important_conversation';
  if (/信息|称呼|名字|语言|昵称/.test(s)) return 'profile';
  if (/配置|功能|设置/.test(s)) return 'functional_preference';
  if (/上下文|约束|任务/.test(s)) return 'task_context';

}
function memLabel(m) { return MEM_CATS[memCat(m.category)] || '偏好'; }

let _memLoading = false;
let _memError = null;
let _memLoaded = false;
let _memBusy = false;

function memSyncCache(list) {

async function loadMemCandidates() {

async function loadMemories() {
  if (_memLoading) return; // 防重入：并发/重复触发只执行一次，避免渲染循环
  _memLoading = true; _memError = null; renderMemList();
  const r = await apiJson('/api/memories?includeInactive=true');
  _memLoading = false;
  if (r.ok) {
    memSyncCache(r.data && r.data.memories);
    if (r.data && r.data.version != null) DB.version = r.data.version;
    _memLoaded = true;
    await loadMemCandidates();
    render(); // 成功：全量渲染一次（此时 _memLoaded=true，不会再次调度 loadMemories）
  } else {
    // 失败：只更新列表区显示错误 + 重试按钮，绝不触发全量 render（否则 _memLoaded=false 会再次调度 loadMemories，形成循环）
    _memError = (r.err === 'network' || r.err === 'not-json' || r.err === 'parse') ? '无法连接服务，请检查后端是否已启动' : (r.message || '加载失败');
    await loadMemCandidates();
    renderMemList();
  }
}

// 需求 20：约 50 条时自动整理 —— 去重、压缩流水账、保留重要记忆/状态（确定性压缩，不依赖异步 AI）
function aiTidyActivities() {
  const acts = DB.ai.activities || [];
  if (acts.length < 50) return;
  const keepTypes = { memory: 1, state: 1, chat: 1, journal: 1, plan: 1 };
  const seen = new Set();
  const deduped = [];
  for (const a of acts) {
    const key = a.type + '::' + a.text;
    if (seen.has(key)) continue;
    seen.add(key);
    deduped.push(a);
  }
  // 高价值动态全保留；低价值流水账（task/habit/shopping/music/weather）只留最近 12 条
  const important = deduped.filter((a) => keepTypes[a.type]);
  const flow = deduped.filter((a) => !keepTypes[a.type]).slice(0, 12);
  let result = important.concat(flow).sort((a, b) => b.time - a.time);
  const removed = acts.length - result.length;
  if (removed > 0) result.push({ id: uid(), type: 'state', text: '♻ 自动整理了 ' + removed + ' 条流水动态（保留重要记忆与状态）', time: Date.now() });
  DB.ai.activities = result;
}

/* ---- AI Response Composer（统一生成所有 AI 文字：要不要说 / 怎么说 / 语气） ---- */
const AIResponseComposer = {
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  tone(ctx) {
    const h = new Date().getHours();
    if (ctx && ctx.weather && ctx.weather.code === 'rain') return 'quiet';
    if (h >= 22 || h < 6) return 'quiet';
    return this.pick(['gentle', 'warm', 'concise']);
  },
  generate(ev, ctx) {
    const t = ev.type;
    const title = (ev.payload && ev.payload.title) || '这件事';
    if (t === 'TASK_COMPLETED') {
      const ok = aiThrottleOk(60000);
      return { shouldRespond: ok, tone: this.tone(ctx), priority: 'low', action: null,
        message: this.pick(['「' + title + '」完成啦，替你高兴。', '看到你完成了「' + title + '」，今天又往前走了一点。', '搞定「' + title + '」，不错。']),
        state: { emotion: '满足', intensity: 2, reason: this.pick(['你完成了「' + title + '」，我也松了一口气。', '看到「' + title + '」被划掉，想为你记一笔。']) } };
    }
    if (t === 'HABIT_COMPLETED') {
      const name = (ev.payload && ev.payload.name) || '这件事';
      const ok = aiThrottleOk(60000);
      return { shouldRespond: ok, tone: this.tone(ctx), priority: 'low', action: null,
        message: this.pick(['「' + name + '」又坚持了一天，很厉害。', '连续打卡「' + name + '」，真不错。']),
        state: { emotion: '开心', intensity: 2, reason: this.pick(['看到你坚持「' + name + '」，想为你开心一下。', '「' + name + '」又坚持下来了，替你开心。']) } };
    }
    if (t === 'MUSIC_PLAY') {
      const tr = currentTrack(); const song = (tr && tr.title) || '这首歌';
      const ok = aiThrottleOk(30000);
      return { shouldRespond: ok, tone: 'quiet', priority: 'low', action: null,
        message: this.pick(['好，一起听「' + song + '」。', '嗯，陪你听「' + song + '」。']),
        state: { emotion: '安心', intensity: 2, reason: '和你一起听歌，很安静。' } };
    }
    if (t === 'JOURNAL_CREATED') {
      const e = ev.payload || {};
      const ok = aiCan('journal') && aiThrottleOk(60000);
      const tired = /累|困|疲惫|不想动|好满/.test(e.content || '');
      const done = /完成|做完|搞定|终于/.test(e.content || '');
      const message = tired ? this.pick(['辛苦啦，今天看起来确实挺满的。', '辛苦啦，至少今天又往前走了一点。', '今天辛苦了，早点歇一歇。'])

        : this.pick(['我看见了，谢谢你愿意记下来。', '记下了，此刻也值得被记住。']);
      return { shouldRespond: ok, tone: 'gentle', priority: 'low', action: null, message,
        state: done ? { emotion: '开心', intensity: 1, reason: '你把一件拖了很久的事记下来了，我也替你松了一口气。' } : null };
    }
    if (t === 'LOCATION_CHANGED') {
      const city = (ev.payload && ev.payload.city) || '';
      const ok = aiThrottleOk(30000);
      return { shouldRespond: ok, tone: 'gentle', priority: 'low', action: null,
        message: city ? '现在我知道你在 ' + city + ' 了，天气和问候会更贴心。' : '定位好了，之后的提醒会更贴近你。', state: null };
    }
    return { shouldRespond: false, tone: 'quiet', priority: 'low', message: null, action: null, state: null };
  },
};

  async currentCoords() {

const LocationProvider = {
  _lastError: null,
  // 最后一次定位失败原因（供 UI 清晰展示 denied / unsupported / timeout，不伪造位置）
  lastError() { return this._lastError; },
  // 需求 10：真实定位优先 navigator.geolocation（含精度/时间戳/反向地理编码），
  // 失败才降级到城市级 IP 大致定位（明确 source='ip'，绝不冒充 GPS）。
  async getCurrentLocation() {
    const gps = await this.gpsLocation();
    if (gps && gps.lat) { DB.location = gps; saveDB(); return gps; }
    const ipLoc = await this.ipLocation();
    if (ipLoc) return ipLoc;
    // GPS 与 IP 都不可用时返回 null，绝不伪造定位
    return null;
  },
  // 高德 IP 定位（城市级大致位置，兜底；仅在 GPS 失败后调用）
  async ipLocation() {
    try {
      const r = await fetch(API_BASE + '/api/ip-location');
      if (r.ok) {
        const d = (await r.json()).data;
        if (d && (d.city || d.province)) {
          const loc = { city: d.city || d.province, lat: d.lat || null, lng: d.lng || null, source: 'ip', precision: 'city', updatedAt: Date.now() };
          DB.location = loc; saveDB(); return loc;
        }
      }
    } catch (e) {}
    return null;
  },
  // 浏览器 GPS（精确坐标 + 精度 + 时间戳）；权限被拒/不可用/超时均记录到 _lastError
  gpsLocation() {
    return new Promise((resolve) => {
      if (!('geolocation' in navigator)) { this._lastError = { code: 'unsupported', message: '当前浏览器/环境不支持定位' }; return resolve(null); }
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        const acc = pos.coords.accuracy || null;
        const ts = pos.timestamp || Date.now();
        const city = await this.reverseGeocode(lat, lng);
        this._lastError = null;
        resolve({ city, lat, lng, accuracy: acc, timestamp: ts, source: 'geolocation', updatedAt: Date.now() });
      }, (err) => {
        const msg = { 1: '用户拒绝了定位权限', 2: '定位信息当前不可用', 3: '定位请求超时' }[err && err.code] || ('定位失败' + (err && err.message ? '：' + err.message : ''));
        this._lastError = { code: String((err && err.code) || 'error'), message: msg };
        try { console.warn('[location] 浏览器 GPS 不可用:', err && err.code, err && err.message); } catch (e) {}
        resolve(null);
      }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 5 * 60 * 1000 });
    });
  },
  async reverseGeocode(lat, lng) {
    try {
      const r = await fetch(API_BASE + '/api/geocode?lat=' + lat + '&lng=' + lng);
      if (r.ok) { const d = (await r.json()).data; if (d && (d.city || d.district)) return d.city || d.district; }
    } catch (e) {}
    return '（已获取定位）';
  },
};

function fmtMoney(c) { const n = Number(c) || 0; return '￥' + (n / 100).toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
const EXPENSE_CATEGORIES = ['吃饭', '娱乐', '生活用品', '看病', '零食', '学习', '交通', '住房', '通讯', '服饰', '旅行', '其他'];
const INCOME_CATEGORIES = ['工资', '奖金', '兼职', '理财', '红包', '其他'];

function financeIsIncome(e) { return e && e.kind === 'income'; }
// 统一倒序排序（与后端 /api/finance、lib/finance.js 同一口径）：occurredAt 倒序 → occurredTime 倒序 → createdAt 倒序 → id。
// 编辑金额/分类/备注只改 updatedAt 不改变位置；修改 occurredAt 才会重排。绝不在这里临时 reverse。
function sortExpensesDesc(list) {
  return (list || []).slice().sort((a, b) => {
    const da = String(a.occurredAt || ''), db = String(b.occurredAt || '');
    if (da !== db) return da < db ? 1 : -1;
    const ta = String(a.occurredTime || ''), tb = String(b.occurredTime || '');
    if (ta !== tb) return ta < tb ? 1 : -1;
    const ca = Number(a.createdAt) || 0, cb = Number(b.createdAt) || 0;
    if (ca !== cb) return cb - ca;
    return String(a.id || '') < String(b.id || '') ? -1 : String(a.id || '') > String(b.id || '') ? 1 : 0;
  });
}
function financeSummaryLocal() {
  const mk = todayStr().slice(0, 7);
  const ex = DB.expenses || [];

  const monthExpenseCents = ex.filter((e) => isExp(e) && String(e.occurredAt || '').startsWith(mk)).reduce((s, e) => s + (Number(e.amountCents) || 0), 0);
  const monthIncomeCents = ex.filter((e) => !isExp(e) && String(e.occurredAt || '').startsWith(mk)).reduce((s, e) => s + (Number(e.amountCents) || 0), 0);
  const todayExpenseCents = ex.filter((e) => isExp(e) && e.occurredAt === todayStr()).reduce((s, e) => s + (Number(e.amountCents) || 0), 0);
  const cat = {};
  ex.filter((e) => isExp(e) && String(e.occurredAt || '').startsWith(mk)).forEach((e) => { const c = e.category || '其他'; cat[c] = (cat[c] || 0) + (Number(e.amountCents) || 0); });
  const budget = DB.budget && DB.budget.monthlyCents;
  return { monthExpenseCents, monthIncomeCents, todayExpenseCents, cat, budget };
}

/* ================= PERIOD 经期 ================= */
function periodSorted() { return (DB.menstrualCycles || []).slice().sort((a, b) => (a.startDate < b.startDate ? -1 : a.startDate > b.startDate ? 1 : 0)); }
function periodPrediction() {
  const sorted = periodSorted();
  const ongoing = sorted.find((c) => c.startDate && !c.endDate) || null;
  const closed = sorted.filter((c) => c.startDate && c.endDate);
  let avgCycle = null;
  if (closed.length >= 2) {
    let sum = 0, n = 0;
    for (let i = 1; i < closed.length; i++) {
      const d = Math.round((parseDate(closed[i].startDate) - parseDate(closed[i - 1].startDate)) / 86400000);
      if (d >= 15 && d <= 60) { sum += d; n++; }
    }
    if (n) avgCycle = Math.round(sum / n);
  }
  const last = closed.length ? closed[closed.length - 1] : (sorted.length ? sorted[sorted.length - 1] : null);
  const nextStart = (avgCycle && last) ? addDays(last.startDate, avgCycle) : null;
  return { ongoing, closed, avgCycle, last, nextStart };
}
/* —— 经期逐日记录（Apple Cycle Tracking 式）：时间线选日期 → 当日记录 → 周期历史 —— */
const PERIOD_FLOWS = ['少', '中', '多'];
const PERIOD_SYMPTOMS = ['腹痛', '头痛', '腰痛', '疲劳', '情绪波动', '痤疮', '食欲', '失眠', '胀气', '恶心'];
function periodDayRecord(date) { return (DB.menstrualDays || []).find((x) => x && x.date === date) || null; }
// 某日标记：period=经期日（周期区间内或当日记录经期）；hasInfo=该日还有其他信息（经量/症状/点滴/体温）
function periodDayMark(date) {
  const rec = periodDayRecord(date);
  const inCycle = (DB.menstrualCycles || []).some((c) => {
    if (!c.startDate || date < c.startDate) return false;
    if (c.endDate) return date <= c.endDate;
    return date <= todayStr(); // 进行中的经期只标到「今天」
  });
  const period = !!(rec && rec.period) || inCycle;
  const symptoms = (rec && Array.isArray(rec.symptoms) ? rec.symptoms : []).filter(Boolean);
  const hasInfo = !!(rec && (rec.flow || rec.spotting || (rec.bbt != null && String(rec.bbt).trim() !== '') || symptoms.length));
  return { period, hasInfo };
}
// 按日期 upsert 逐日记录；空记录自动移除，绝不堆积无用条目（与后端 repair 语义一致）
function periodUpsertDay(date, patch) {
  if (!Array.isArray(DB.menstrualDays)) DB.menstrualDays = [];
  let rec = periodDayRecord(date);
  if (!rec) { rec = { date }; DB.menstrualDays.push(rec); }
  Object.assign(rec, patch);
  const symptoms = (Array.isArray(rec.symptoms) ? rec.symptoms : []).filter(Boolean);
  const empty = !rec.period && !rec.flow && !rec.spotting && (rec.bbt == null || String(rec.bbt).trim() === '') && symptoms.length === 0;
  if (empty) DB.menstrualDays = DB.menstrualDays.filter((x) => x.date !== date);
}
function togglePeriodDay(date) { const r = periodDayRecord(date); periodUpsertDay(date, { period: !(r && r.period) }); saveDB(); render(); }
function setPeriodFlow(date, flow) { periodUpsertDay(date, { flow }); saveDB(); render(); }
function togglePeriodSymptom(date, sym) {
  const r = periodDayRecord(date);
  const symptoms = (r && Array.isArray(r.symptoms) ? r.symptoms : []).filter(Boolean);
  const has = symptoms.includes(sym);
  periodUpsertDay(date, { symptoms: has ? symptoms.filter((s) => s !== sym) : [...symptoms, sym] });
  saveDB(); render();
}
function togglePeriodSpotting(date) { const r = periodDayRecord(date); periodUpsertDay(date, { spotting: !(r && r.spotting) }); saveDB(); render(); }
function setPeriodBbt(date, v) { const b = parseFloat(v); periodUpsertDay(date, { bbt: Number.isFinite(b) ? b : null }); saveDB(); }

// 从 txt / md / json 批量导入长期记忆（去重 + 上限 200，避免一次灌入过多）。
// PDF 是二进制，浏览器 readAsText 读不出正文，诚实提示转成文本再导入，绝不用乱码冒充记忆。
function aiImportMemory(input) {
  const file = input.files[0]; if (!file) return;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const isPdf = ext === 'pdf' || file.type === 'application/pdf';
  const read = () => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result || '')); r.onerror = rej; r.readAsText(file); });
  read().then((text) => {
    if (!text.trim()) { toast('文件为空', true); return; }
    let items = [];
    if (ext === 'json') {
      try {
        const data = JSON.parse(text);
        const arr = Array.isArray(data) ? data : (data && Array.isArray(data.memories) ? data.memories : []);
        items = arr.map((x) => {
          if (typeof x === 'string') return { content: x.trim(), category: 'preference' };
          const o = x && typeof x === 'object' ? x : {};
          const c = String(o.content || o.summary || o.title || o.text || '').trim();
          if (!c) return null;
          return {
            content: c, category: String(o.category || 'preference'),
            key: String(o.key || ''), value: o.value !== undefined ? o.value : null,
            title: String(o.title || ''), importance: String(o.importance || 'normal'),
            confidence: typeof o.confidence === 'number' ? o.confidence : 0.8,
          };
        }).filter(Boolean);
      } catch (e) { toast('JSON 解析失败：' + e.message, true); return; }
    } else {
      const lines = text.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
      items = lines.map((l) => ({ content: l.replace(/^[\s\-*#>]+/, '').trim(), category: 'preference' })).filter((x) => x.content && x.content.length >= 2);
    }
    if (!items.length) {
      toast(isPdf ? 'PDF 无法直接导入（浏览器读不出 PDF 正文），请先导出为 txt / md / json 再导入' : '没有可导入的内容', true);
      return;
    }
    const mems = DB.ai.memories || (DB.ai.memories = []);
    const existing = new Set(mems.map((m) => m.summary || m.content || ''));
    const toImport = items.filter((it) => !existing.has(it.content)).slice(0, 200);
    if (!toImport.length) { toast('这些内容都已经记住过了', true); input.value = ''; return; }
    aiImportToServer(toImport).then((added) => {
      input.value = ''; render();
      if (added > 0) toast('已导入 ' + added + ' 条记忆 ♥'); else toast('导入失败', true);
    });
  }).catch(() => { toast('读取文件失败', true); });
}

// 逐条 POST 到 /api/memories（显式导入，userConfirmed=true），成功后统一刷新缓存，避免整表写覆盖
async function aiImportToServer(items) {
  let added = 0;
  for (const it of items) {
    const r = await apiJson('/api/memories', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        summary: it.content, category: it.category || 'preference', key: it.key || '',
        value: it.value !== undefined ? it.value : null, title: it.title || '',
        importance: it.importance || 'normal', source: 'imported', sourceType: 'import',
      }),
    });
    if (r.ok) added++;
    else if (r.status === 409) { toast('数据已变化，请重试导入', true); return added; }
  }
  await memRefresh();
  return added;
}

// 把 AI 状态按「今天 / 本周（今天以前）/ 更早（本周以前）」分桶（互不重叠，每个桶内最新在前）。
// 「本周」= 当前自然周（周一起算，复用项目 startOfWeek 的同一套日期语义），只含今天以前的记录；
// 「更早」= 本周以前。绝不另造「最近 7 天」滚动窗口，跨周边界按用户本地日历日切分。
function aiStateBuckets(states) {
  const sorted = (states || []).slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const today = todayStr();
  const weekStart = startOfWeek(today); // 本周周一（与周计划同一语义）
  const todayItems = [], weekItems = [], earlierItems = [];
  for (const s of sorted) {
    const ds = dstr(new Date(s.createdAt));
    if (ds === today) todayItems.push(s);
    else if (ds >= weekStart && ds < today) weekItems.push(s);
    else earlierItems.push(s);
  }
  return { todayItems, weekItems, earlierItems };
}

// 折叠切换：显示/隐藏指定容器，翻转按钮文案并同步 aria-expanded（标准 disclosure 模式）
function aiToggleFold(boxId, btnId, moreLabel, lessLabel) {
  const box = document.getElementById(boxId);
  const btn = document.getElementById(btnId);
  if (!box || !btn) return;
  const hidden = box.style.display === 'none';
  box.style.display = hidden ? '' : 'none';
  btn.textContent = hidden ? lessLabel : moreLabel;
  btn.setAttribute('aria-expanded', hidden ? 'true' : 'false');
}

async function openMiniMap() {
  const sid = OS.chat.currentId;
  const locs = DB.chatLocations || {};

  if (loc && loc.lat && loc.lng) {
    const lat = Number(loc.lat), lng = Number(loc.lng);
    const d = 0.02;
    const bbox = (lng - d).toFixed(5) + '%2C' + (lat - d).toFixed(5) + '%2C' + (lng + d).toFixed(5) + '%2C' + (lat + d).toFixed(5);
    const src = 'https://www.openstreetmap.org/export/embed.html?bbox=' + bbox + '&layer=mapnik&marker=' + lat.toFixed(5) + '%2C' + lng.toFixed(5);
    drawer('<div class="sheet"><div class="sheet-grab"></div>' +
      '<div class="sheet-head"><div style="font-weight:700;font-size:calc(16px * var(--app-font-scale, 1))">对话地点</div>' +
      '<div class="muted" style="font-size:calc(12px * var(--app-font-scale, 1))">' + esc(loc.city || '对话定位') + '</div></div>' +

// 为当前对话手动标一个地点（用户主动点击才请求定位，绝不自动弹权限框）。
// 只写入 DB.chatLocations[sessionId]，不污染全局 DB.location（那是天气用的用户位置）。
OS.chat.pinLocation = function() {
  const sid = OS.chat.currentId;
  if (!sid) { toast('还没有当前会话', true); return; }
  toast('正在获取定位…');
  LocationProvider.gpsLocation().then((loc) => {
    if (!loc || !loc.lat || !loc.lng) {
      const err = LocationProvider.lastError();
      toast('定位失败' + (err ? '：' + err.message : '（权限被拒或服务不可用）'), true);
      return;
    }
    if (!DB.chatLocations) DB.chatLocations = {};
    DB.chatLocations[sid] = { lat: loc.lat, lng: loc.lng, city: loc.city || '', source: loc.source || 'geolocation', updatedAt: Date.now() };
    saveDB();
    toast('已为此对话定位：' + (loc.city || '已定位'));
    openMiniMap();
  });
};

    }
    toast('定位成功：' + esc(loc.city || '') + (loc.source === 'ip' ? '（城市级 IP 大致定位）' : '')); render();
    AIBus.emit({ type: 'LOCATION_CHANGED', entityType: 'location', payload: loc });
    // 拿到位置后顺手拉一次真实天气
    const w = await WeatherProvider.fetchReal();
    if (w) { DB.weather = w; saveDB(); render(); WeatherProvider.evaluate(w); AIBus.emit({ type: 'WEATHER_UPDATED', entityType: 'weather', payload: w }); }
    else toast('天气暂未更新（未配置 AMAP_KEY 或网络异常）');
  });
}

/* ---- 通知动作 / 雨伞提议 ---- */
function aiNoticeAction(nid, key) {
  const n = (DB.ai.notifications || []).find((x) => x.id === nid);
  if (n) n.read = true;
  aiMarkAsked(key);
  saveDB();
  switch (key) {
    case 'umbrella_accept': aiAcceptUmbrella(); break;
    case 'umbrella_reject': aiRejectUmbrella(); break;
    case 'mem_yes': if (_aiPendingMem) { aiAddMemory(_aiPendingMem.content, _aiPendingMem.category, _aiPendingMem.sourceType, _aiPendingMem.sourceId).then((m) => toast(m ? '已记住 ♥' : '保存失败', !m)); } _aiPendingMem = null; break;
    case 'mem_no': _aiPendingMem = null; break;
    case 'dismiss': break; // 仅关闭，不跳转
    case 'open_shopping': OS.go('/shopping'); return;
    case 'open_memory': OS.go('/ai/memory'); return;
    case 'open_journal': OS.go('/journal'); return;
  }
  render();
}
function aiOnWeatherRain(w) {
  if (!aiCan('weather') || !aiCan('shopping')) return;
  if (aiAskedRecently('umbrella')) return;
  if ((DB.ai.memories || []).some((m) => (m.content || '').includes('伞')) && !shoppingItemsOf('deity').some((i) => i.title.includes('伞') && !i.completed)) aiProposeUmbrella();
}
function aiProposeUmbrella() {
  aiMarkAsked('umbrella');
  const n = AINotificationComposer.umbrella(buildAIContext());
  AINotify.send(n.severity, n.title, n.message, [
    { key: 'umbrella_accept', label: n.actionLabel, primary: true },
    { key: 'umbrella_reject', label: n.secondaryActionLabel, primary: false },
  ], { render: true });
}
function aiAcceptUmbrella() { addShoppingItem('deity', '雨伞', { note: '祂提醒：今天可能要下雨', category: '生活', priority: 'high' }); toast('已放进祂的清单 ♥'); }
function aiRejectUmbrella() {
  aiSetState('委屈', 1, '我记了一周的雨伞，但你刚刚说不需要了。不是生气，只是想帮你却没帮上。', 'weather', 'shopping', null, null);
  toast('好的，那这次先不带。');
}
/* ---- 事件规则引擎（去硬编码：回应文案交给后端 /api/ai/respond，AI 自行决定） ---- */
function emitAIEvent(o) {
  AIBus.emit({
    type: o.type, action: o.action || null,
    entityType: o.entity || o.entityType, entityId: o.entityId || null,
    payload: o.data || o.payload, time: o.timestamp || Date.now(),
  });
}
function aiMapEmotion(raw) {
  const e = String(raw || '').trim();
  if (!e) return '';
  if (AI_EMOTIONS.includes(e)) return e;
  const map = { 开心: ['开心', '高兴', '喜'], 委屈: ['委屈'], 担心: ['担心', '焦虑', '怕', '紧张'], 安心: ['安心', '踏实', '平静', '放松'], 期待: ['期待', '盼望'], 失落: ['失落', '难过', '遗憾', '沮丧'], 满足: ['满足', '欣慰'], 想帮忙: ['帮忙', '帮'], 有点困惑: ['困惑', '疑惑', '不懂'], 认真: ['认真', '专注'], 在意: ['在意', '关心', '挂念', '惦记'] };
  for (const [k, kws] of Object.entries(map)) if (kws.some((w) => e.includes(w))) return k;
  return '';
}
let _respondQueue = [];
let _respondTimer = null;
function aiRespondAsync(ev) {
  _respondQueue.push(ev);
  if (_respondTimer) return;
  _respondTimer = setTimeout(async () => {
    _respondTimer = null;
    if (!aiThrottleOk(30000)) { _respondQueue = []; return; }
    const batch = _respondQueue.splice(0, 8);
    try {
      const resp = await fetch(API_BASE + '/api/ai/respond', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ events: batch.map((e) => ({ type: e.type, entityType: e.entityType, entityId: e.entityId, payload: e.payload })) }) });
      const data = await resp.json().catch(() => ({}));
      if (!data || !data.respond || !data.message) return;
      const emotion = aiMapEmotion(data.emotion);
      if (emotion) aiSetState(emotion, data.intensity || 1, data.message, 'event', batch[batch.length - 1]?.entityType || 'page', batch[batch.length - 1]?.entityId || null, null);
      AINotify.send('INFO', aiSet().aiName || '♥ 我的AI', data.message, null, { render: false });
    } catch (e) { /* 后端不可达 / 缺 Key：静默降级，绝不用假文案冒充 */ }
  }, 1200);
}

/* ---- 评论事件入口：用户新增/编辑日志/健康/财务 → 后端跑工具循环，AI 自行决定是否评论 ----
   复用 AIBus（绝不新建第二套事件机制）；debounce 1200ms 保证先于 SYNC.push(800ms) 之后触发，
   独立节流（不占用 /api/ai/respond 的节流额度）；fire-and-forget，绝不阻塞保存。 */
let _commentQueue = [];
let _commentTimer = null;
let _aiLastComment = 0;
function aiConsiderComment(recordType, recordId) {
  if (!recordId || !['journal', 'health', 'finance'].includes(recordType)) return;
  if (!aiCan(recordType)) return; // 前端权限：该领域被禁用时绝不触发
  _commentPending.add(recordType + ':' + recordId);
  _commentQueue.push({ recordType, recordId });
  render(); // 立即显示「祂正在想…」占位
  if (_commentTimer) return;
  _commentTimer = setTimeout(async () => {
    _commentTimer = null;
    const batch = _commentQueue.splice(0, 4);
    if (Date.now() - _aiLastComment < 30000) { batch.forEach((b) => _commentPending.delete(b.recordType + ':' + b.recordId)); render(); return; }
    _aiLastComment = Date.now();
    const last = batch[batch.length - 1];
    try {
      const resp = await fetch(API_BASE + '/api/ai/comments/consider', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ recordType: last.recordType, recordId: last.recordId, model: aiSet().model }) });
      const data = await resp.json().catch(() => ({}));
      if (data && data.considered && data.commented) await SYNC.bootstrap(); // 后端已写 doc.ai.comments，拉回并刷新
    } catch (e) { /* 后端不可达 / 缺 Key：静默降级，绝不假装评论成功 */ }
    batch.forEach((b) => _commentPending.delete(b.recordType + ':' + b.recordId));
    render();
  }, 1200);
}
function aiOnEvent(ev) {
  try {
    if (ev.type === 'PAGE_CHANGED') return;
    if (!aiCan('pageContext')) return;

    // 日志：提取长期记忆（保留原有能力）
    if (ev.type === 'JOURNAL_CREATED') {
      if (!aiCan('journal')) return;
      const e = ev.payload || {};
      // 用户写 Journal ≠ AI 写 Activity：绝不把用户日志写成「写下日志：…」动态（Journal→Activity 触发链已切断）
      aiConsiderMemory(e.content, '偏好', 'journal', ev.entityId);
      aiRespondAsync(ev);
      aiConsiderComment('journal', ev.entityId);
      return;
    }
    if (ev.type === 'JOURNAL_UPDATED') { aiConsiderComment('journal', ev.entityId); return; }
    if (ev.type === 'JOURNAL_DELETED') return;

    // 健康：新增/编辑健康记录后给 AI 评论机会（身高/体重 profile 更新不评论）
    if (ev.type === 'HEALTH_UPDATED') {
      if (ev.entityId && ev.entityId !== 'profile') aiConsiderComment('health', ev.entityId);
      return;
    }

    // 音乐：绝不写“正在听 XXX”流水动态；仅长期收听模式记一次
    if (ev.type === 'MUSIC_PLAY' || ev.type === 'MUSIC_CHANGED' || ev.type === 'MUSIC_PAUSE') {
      const t = currentTrack();
      if (t && (t.playCount || 0) >= 5 && !t.patternLogged) {
        t.patternLogged = true; saveDB();
      }
      return;
    }

    if (ev.type === 'WEATHER_UPDATED') { if (ev.payload && ev.payload.code === 'rain') aiOnWeatherRain(ev.payload); return; }

    // 有意义的业务操作：记一条精炼动态 + 交给 AI 决定是否动态回应（文案由模型生成，非硬编码）
    const valuable = {
      TASK_COMPLETED: ['task', '完成：', 'title'], TASK_CREATED: ['task', '创建：', 'title'],
      HABIT_COMPLETED: ['habit', '打卡：', 'name'], HABIT_CREATED: ['habit', '新习惯：', 'name'],
      PLAN_CREATED: ['plan', '新建计划：', 'title'], PLAN_DELETED: ['plan', '删除计划：', 'title'],
      CALENDAR_EVENT_CREATED: ['task', '新增日程：', 'title'],
      SHOPPING_ITEM_COMPLETED: ['shopping', '完成购买：', 'title'],
      LOCATION_CHANGED: ['location', '定位到：', 'city'],
    };
    if (valuable[ev.type]) {
      aiRespondAsync(ev);
      return;
    }
  } catch (e) { console.warn('[aiOnEvent]', e); }
}

/* ---- 启动 ---- */
function aiBootstrap() {
  setTimeout(async () => {
    try {
      if (aiCan('weather')) { const w = await WeatherProvider.refresh(); if (w && w.code === 'rain') aiOnWeatherRain(w); }
    } catch (e) { console.warn('[aiBootstrap]', e); }
  }, 1500);
}
function aiProactiveTick() { /* 预留：定时主动感知入口 */ }

init();
aiBootstrap();
musicRefreshStatus();

/* ================= PWA ================= */
// 注册 Service Worker（同源部署 + Vercel 前端均适用；scope 为站点根）。
// 仅在 https 或 localhost 下注册（Service Worker 要求安全上下文）。
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((e) => console.warn('[PWA] SW 注册失败', e));
  });
}
